<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Video-Test</title>
<link rel="stylesheet" href="/vtest/vtest.css">
</head>
<body>
<h1>Video-Test Safari</h1>
<p>Fünf Varianten desselben Films, ohne Seiten-Code der Startseite. Bitte Screenshot von oben bis unten schicken.</p>
<p id="ua"></p>

<section>
  <h2>A · wie Startseite, ohne Code</h2>
  <video data-case="A" src="/assets/home/uc1.mp4" muted autoplay loop playsinline preload="auto" width="1280" height="720"></video>
  <p class="st"></p>
</section>

<section>
  <h2>B · mit Bedienleiste, zum Antippen</h2>
  <video data-case="B" src="/assets/home/uc1.mp4" controls playsinline preload="metadata" width="1280" height="720"></video>
  <p class="st"></p>
</section>

<section>
  <h2>C · gleiche Datei ohne Tonspur</h2>
  <video data-case="C" src="/vtest/uc1-ohne-ton.mp4" muted autoplay loop playsinline preload="auto" width="1280" height="720"></video>
  <p class="st"></p>
</section>

<section>
  <h2>D · alte Datei vom 06.11.</h2>
  <video data-case="D" src="/vtest/uc1-alt-1106.mp4" muted autoplay loop playsinline preload="auto" width="1280" height="720"></video>
  <p class="st"></p>
</section>

<section>
  <h2>E · wie A, mit Untertitel-Spur</h2>
  <video data-case="E" muted autoplay loop playsinline preload="auto" width="1280" height="720">
    <source src="/assets/home/uc1.mp4" type="video/mp4">
    <track kind="captions" srclang="en" label="English" src="/assets/home/uc1-en.vtt">
  </video>
  <p class="st"></p>
</section>

<script src="/vtest/vtest.js"></script>
</body>
</html>
