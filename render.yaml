  - type: web
    runtime: static
    name: hermes-web
    autoDeploy: true
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: PUBLIC_GATEWAY_URL
        value: "https://app.sundartha.com"
    buildFilter:
      paths:
        - "apps/web/**"
    routes:
      - type: rewrite
        source: /app/*
        destination: /app/index.html
      - type: redirect
        source: /auth/*
        destination: https://app.sundartha.com/auth/:splat
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=15552000; includeSubDomains"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; connect-src 'self' https://app.sundartha.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
      - path: /assets/hermes_olymp_v2.mp4
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
