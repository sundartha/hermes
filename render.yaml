# Render Blueprint - Gratis 24/7-Hosting (https://render.com)
# Secrets werden NICHT hier eingetragen, sondern verschluesselt im Render-Dashboard (sync: false).
services:
  - type: web
    name: vodafone-agent
    # Datenresidenz DE/EU (Entscheidung #4): Server in Frankfurt, kein US-Transfer.
    # Schuetzt gegen versehentliche US-Default-Region. Hinweis: fuer einen BEREITS
    # bestehenden Service ist die Region per Blueprint nicht aenderbar (gilt fuer
    # frische Deploys); Wert + Guard-Test sind der eigentliche Schutz. Steuert nur
    # die App-Server-Region; die DB-Residenz haengt am DATABASE_URL-Provisioning.
    region: frankfurt
    runtime: node
    plan: free
    # HINWEIS: Dieser Service ist DASHBOARD-MANAGED (Config via Render-API, nicht via
    # Blueprint-Sync). Werte hier sind REFERENZ/Doku - die Quelle der Wahrheit ist das
    # Render-Dashboard. NICHT blind annehmen, dass ein render.yaml-Push die Live-Config
    # aendert (autoDeploy/healthCheckPath/MULTI_TENANT/SELF_SERVICE weichen live ab).
    # Single-Origin (Phase A, 2026-06-27): der Gateway baut UND serviert das apps/web-
    # Astro-Build (WEB_DIST_DIR unten), damit Frontend + /api + /auth + Session-Cookie
    # unter EINEM Origin (app.sundartha.com) laufen. apps/web hat eine eigene Lockfile
    # -> --prefix + ci. PUBLIC_GATEWAY_URL inline = nur Build-Zeit (same-origin Funnel-Links).
    buildCommand: npm install && npm --prefix apps/web ci && PUBLIC_GATEWAY_URL=https://app.sundartha.com npm --prefix apps/web run build
    startCommand: npm start
    # GAP-38: KEIN Pre-Deploy-Kommando. Render fuehrt es auf plan:free nicht aus - der
    # Bootstrap-Seed lief live also nie, und ein frischer/leerer Store endete bei jedem
    # Deploy im fail-closed Boot-Refusal. Ersatz ist die In-Prozess-Heilung in src/boot.js
    # (liest BOOTSTRAP_E164/BOOTSTRAP_PROVIDER unten, heilt NUR einen nachweislich frischen
    # Store, schreibt Audit + Plattform-SMS). scripts/bootstrap-tenant.js bleibt der
    # manuelle/lokale Weg (npm run bootstrap-tenant).
    healthCheckPath: /healthz
    autoDeploy: false
    # Deploy-Isolation (W0): rein-Frontend-/rein-Doku-Commits duerfen diesen
    # live telefonierenden Prozess NICHT neu deployen (Blast-Radius: ein
    # Frontend-Commit wuerde sonst den Container mitten im Anruf SIGTERMen).
    # ignoredPaths = der Service deployt NUR dann nicht, wenn ALLE geaenderten
    # Dateien auf diese Muster passen; jeder src/**-Commit deployt weiterhin.
    # Falls Render den Filter fuer den bestehenden Service nicht nachtraeglich
    # per Blueprint anwendet (analog zur Region-Einschraenkung): im Dashboard
    # setzen. Der Wert + render-buildfilter.test.js sind der eigentliche Schutz.
    buildFilter:
      ignoredPaths:
        # GAP-37: KEIN Eintrag fuer das Frontend-Verzeichnis. Derselbe Service baut es
        # (buildCommand oben) und liefert es aus (WEB_DIST_DIR unten) - wer es hier
        # filtert, laesst einen reinen Frontend-Commit nie deployen und serviert
        # dauerhaft ein veraltetes Frontend. Reine Doku-Commits bleiben gefiltert.
        - "docs/**"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # B5: Schluessel des Fremdadapters (Secret, deshalb kein value:). Nur noetig,
      # wenn LLM_PROVIDER=deepseek gesetzt wird - dann ist er Boot-Pflicht.
      - key: DEEPSEEK_API_KEY
        sync: false
      # Hinweis: Absendernummern sind KEINE Env-Var mehr. Der Owner
      # ist Tenant Null und haelt seine Nummer(n) im Store - einmalig eintragen via
      # "npm run seed-owner-number -- <e164> telnyx" (gegen STORE_BACKEND=pg)
      # VOR dem ersten Boot; der Boot-Guard verlangt eine aktive Owner-Nummer.
      # ---- Telnyx (zweiter Provider, optional - P5) ----
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_PUBLIC_KEY
        sync: false
      - key: TELNYX_API_BASE
        value: "https://api.telnyx.com"
      # TeXML-Connection-ID (Outbound) + Account-ID (Hangup). Pflicht fuer Telnyx-Outbound.
      - key: TELNYX_CONNECTION_ID
        sync: false
      - key: TELNYX_ACCOUNT_SID
        sync: false
      # OUTBOUND-E4 (Drift-Waechter): FQDN-Connection (ANI-Override) + Outbound-Voice-
      # Profile (Ziellaender). Leer -> die Pruefungen 2/6/7 melden unbekannt (nie fatal).
      - key: TELNYX_FQDN_CONNECTION_ID
        sync: false
      - key: TELNYX_OUTBOUND_VOICE_PROFILE_ID
        sync: false
      # OUTBOUND-E5 (F3): Digest-Zugangsdaten der SIP-Trunk-FQDN-Connection oben, nur
      # gebraucht fuer ELEVENLABS_NUMBER_REGISTRATION_ENABLED=true (s.u.). Leer -> das
      # Anlegen einer Registrierung schlaegt fail-closed fehl (KEIN No-op).
      - key: TELNYX_SIP_TRUNK_USERNAME
        sync: false
      - key: TELNYX_SIP_TRUNK_PASSWORD
        sync: false
      # Globale Plattform-Stimme (Rueckfall der Stimm-Karte, EL-Anrufstart).
      - key: TELNYX_ELEVENLABS_VOICE_ID
        sync: false
      # Play-TTS: ElevenLabs-Stimme via <Play> in der Budget-Engine (Telnyx). GETRENNT
      # vom Relay oben. Default AUS -> Azure byte-identisch.
      # UMSTELLEN (IP4, Eigentuemer-Handlung, kein Deploy noetig - Render ist
      # dashboard-managed, dieser Blueprint ist NICHT die Live-Wahrheit):
      #   1. npm run inbound:hoerprobe -- --out /tmp/vorher   (erwartet: azure_say)
      #   2. Flag im Render-Dashboard auf true, Instanz startet neu
      #   3. Boot-Log: "Inbound-Sprechpfad: play_tts (ELEVENLABS_PLAY_TTS_ENABLED=true)"
      #   4. npm run inbound:hoerprobe -- --out /tmp/nachher  (erwartet: play_tts + Datei)
      #   5. echter Inbound-Testanruf: dieselbe Sprecherin wie bei einem Outbound-Anruf?
      # Es kostet ElevenLabs-Zeichen auf einem Plattform-Konto OHNE per-Tenant-Metering.
      # Eine spaetere sporadische Stimmaenderung ist an genau einer Log-Zeile erkennbar:
      #   [play-tts] Kontingent erschoepft (<x>/<quota>, Zyklus <k>) -> Azure-Fallback
      # Rueckweg: Flag zurueck auf false - sofort, ohne Deploy, byte-identisch zum Bestand.
      - key: ELEVENLABS_PLAY_TTS_ENABLED
        value: "false"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MODEL
        value: "eleven_v3_conversational"
      - key: ELEVENLABS_API_BASE
        value: "https://api.elevenlabs.io"
      - key: ELEVENLABS_OUTPUT_FORMAT
        value: "mp3_44100_128"
      - key: ELEVENLABS_SYNTH_TIMEOUT_MS
        value: "2000"
      - key: ELEVENLABS_SYNTH_TOTAL_TIMEOUT_MS
        value: "10000"
      - key: ELEVENLABS_TTS_TOKEN_TTL_MS
        value: "60000"
      # ---- ElevenLabs-Anrufstart (Convai SIP-Trunk-Outbound) ----
      # Dritter Outbound-Weg; Schluessel/Basis aus ELEVENLABS_API_KEY/_API_BASE oben
      # (EIN Konto). Default AUS -> alles laeuft unveraendert ueber Telnyx. Erst nach
      # angelegtem Agenten + registrierter Nummer im Dashboard scharfstellen; Flag an
      # ohne AGENT_ID/AGENT_PHONE_NUMBER_ID -> der Zweig waehlt NICHT (fail-closed).
      - key: ELEVENLABS_OUTBOUND_ENABLED
        value: "false"
      # SEC-P4: Mandanten-Bindung des Werkzeug-Tokens. Default AUS, bis die
      # Werkzeug-Definition am Anbieter den Parameter tenant_token traegt. Achtung: die
      # Live-Services sind Dashboard-managed, diese Zeile allein aendert Live nichts.
      - key: ELEVENLABS_TENANT_TOKEN_REQUIRED
        value: "false"
      # Opake Kennungen (kein Secret, aber deployment-spezifisch) -> Dashboard.
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: ELEVENLABS_AGENT_PHONE_NUMBER_ID
        sync: false
      # OUTBOUND-E5 (F3): Schalter fuer den EINZIGEN neuen Anbieter-SCHREIBZUGRIFF dieser
      # Etappe (Anlegen einer EL-Nummernregistrierung je Tenant-DID). Default AUS - erst
      # NACH Owner-Pilot (V1-V4, docs/RUNBOOK-OUTBOUND.md) auf "true" setzen.
      - key: ELEVENLABS_NUMBER_REGISTRATION_ENABLED
        value: "false"
      - key: ELEVENLABS_RESULT_POLL_MS
        value: "5000"
      # ---- ElevenLabs-Inbound (K1, IE3/IE5) ----
      # Default AUS. Erst scharfstellen, wenn IE5 live und der Testanruf gruen ist
      # (Owner-Entscheidung O10, Kosten pro Inbound-Minute). Achtung: die Live-Services
      # sind Dashboard-managed, diese Zeile allein aendert Live nichts.
      - key: ELEVENLABS_INBOUND_ENABLED
        value: "false"
      # IEL-B1: Allowlist + Zugang des EL-Inbound-Wegs. ALLE sync: false (Muster
      # OWNER_SELF_CALL_TENANT_IDS): kein Wert im Blueprint, Leer-Liste = NIEMAND.
      # Werte nie von Hand - nur per Skript-Lauf der IEL-Kette mit Lesebeleg.
      - key: ELEVENLABS_INBOUND_TENANT_IDS
        sync: false
      - key: ELEVENLABS_INBOUND_SIP_USER
        sync: false
      - key: ELEVENLABS_INBOUND_SIP_PASSWORD
        sync: false
      - key: ELEVENLABS_INIT_WEBHOOK_TOKEN
        sync: false
      # IEX-A9: Wirkungsbereich des EL-Inbound-Wegs (allowlist|registrierte_dids). Kein Geheimnis, daher
      # value statt sync:false. Default allowlist = heutiges Verhalten; eine Blueprint-Synchronisierung
      # faellt damit in die sichere Richtung zurueck. Live ist Dashboard-managed.
      - key: ELEVENLABS_INBOUND_SCOPE
        value: "allowlist"
      # IEP-P2: Begruessungslaut waehrend der Dial-Wartezeit. Kein Geheimnis, daher value.
      # Default "true" = der Auslieferungsstand der Phase; "false" ist der Rueckweg der Fuellung.
      # Live ist Dashboard-managed - diese Zeile allein aendert Live nichts.
      - key: ELEVENLABS_INBOUND_BEGRUESSUNGSLAUT_ENABLED
        value: "true"
      # ---- Bootstrap (Owner-Removal P2b, GAP-38: vom In-Prozess-Boot gelesen) ----
      # Erste Tenant-Absendernummer als E.164 (MUSS eine echte Provider-DID sein,
      # NICHT die Privatnummer - sonst Outbound-403). Secret-frei, aber sync:false,
      # damit der Wert nicht im Repo steht. Leer/ungueltig -> KEINE Heilung; ein
      # frischer Store endet dann im fail-closed Boot-Refusal (unveraendert).
      - key: BOOTSTRAP_E164
        sync: false
      # Provider der Bootstrap-Nummer: telnyx.
      - key: BOOTSTRAP_PROVIDER
        value: "telnyx"
      # OUTBOUND-E1: die Plattform-Absendernummer (ANI) des Produkt-Outbounds. MUSS eine
      # kontoeigene DID des BOOTSTRAP-Tenants sein, KEINE Kunden-DID (sonst friert der
      # Riegel die Doppelrolle ein, statt sie zu beenden). Secret-frei, aber sync:false -
      # Wert im Dashboard, render.yaml setzt live nichts.
      - key: PLATFORM_ANI_E164
        sync: false
      # Globaler Outbound-Kill-Switch (outbound-p3). true = ALLE Outbounds sofort 403.
      # Default false. Notbremse + Sekunden-Rollback fuer den Allowlist-Cutover.
      - key: OUTBOUND_FROZEN
        value: "false"
      # OUTBOUND-E4 (F4): der ANI-Riegel - das EINZIGE Gate der Drift-Waechter-Etappe.
      # Default AUS (nur Beobachtung). Lehnt NUR bei frischer, LIVE-nachgemessener
      # ownership_lost-Messung ab. OUTBOUND_FROZEN bleibt der bewusste Notaus.
      - key: OUTBOUND_ANI_GATE_ENABLED
        value: "false"
      - key: OUTBOUND_ANI_GATE_MAX_AGE_MS
        value: "900000"
      # ALLOWED_NUMBERS: ab outbound-p3 wirkungslos (statische Allowlist abgeschafft);
      # Permit = per-Tenant-Verifikation. Key bleibt fuer den Owner-Env-Cleanup.
      - key: ALLOWED_NUMBERS
        sync: false
      # Erlaubte Laendervorwahlen (Default +49,+33,+44 = DE/FR/UK). * = alle Laender.
      # Land + Stundenlimit greifen vor der Verifikation; statische Liste entfaellt (outbound-p3).
      - key: ALLOWED_COUNTRY_CODES
        value: "+49,+33,+44"
      # Max. Outbound-Calls EINES TENANTS pro gleitender Stunde (eigenes Gate, nicht
      # RATE_LIMIT_PER_MIN). Default UND Obergrenze fuer Profile - ein Profil kann nur
      # senken. Es gibt KEINE plattformweite Stundenbremse - Not-Aus ist OUTBOUND_FROZEN.
      - key: MAX_CALLS_PER_HOUR
        value: "6"
      # ---- Per-(Tenant,Ziel)-Cap + Cooldown (outbound-p1d) ----
      - key: PER_TARGET_CALL_CAP
        value: "3"
      - key: PER_TARGET_WINDOW_MS
        value: "86400000"
      # ---- Onboarding ohne Payment (Kosten-Notbremse statt Stripe) ----
      # Harte Obergrenze provisionierbarer Nummern (jede kostet Geld). 0 = Not-Aus.
      - key: MAX_NUMBERS
        value: "5"
      - key: MAX_NUMBERS_PER_TENANT
        value: "1"
      # Echter Nummern-Kauf. false (Default) = Dry-Run (kein Geld). Erst true -> Kaeufe.
      - key: PROVISIONING_ENABLED
        value: "false"
      - key: PROVISIONING_COUNTRY
        value: "DE"
      # PROV-01 (F4/F5): Auto-Redrive-Fenster (ms) fuer haengende Provisioning-Jobs.
      # 0 = Observe-Only (fail-closed, kein Auto-Nachkauf). Muss < kleinstem Anbieter-
      # Idempotenz-Fenster bleiben (Stripe 24h); scharf empfohlen 3600000. Erst nach
      # gruenem Telnyx-Idempotenz-Smoke scharfschalten.
      - key: PROVISIONING_REDRIVE_MAX_AGE_MS
        value: "0"
      # GP-P3: Versuchsdeckel je Mandant fuer den automatischen Wiederanlauf nach
      # Kartenwechsel. Erschoepft -> needs_manual_reconcile. 0 = komplett aus.
      - key: PROVISIONING_RETRY_MAX_ATTEMPTS
        value: "3"
      # GP-P4: Mindestfrist zwischen zwei automatischen Anstoessen desselben Mandanten
      # durch den zeitgesteuerten Wiederanlauf. 0 = zeitgesteuerter Zweig komplett aus.
      - key: PROVISIONING_RETRY_MIN_INTERVAL_MS
        value: "86400000"
      # tenant-prolif-d: Grace (TAGE) bis zum Auto-DID-Release suspendierter Tenants.
      # 0 = Observe-Only (fail-closed, kein DELETE). Erst > 0 gibt echte DIDs frei.
      - key: RELEASE_GRACE_DAYS
        value: "0"
      # Kauf-Land-Override (ISO-2): alle neuen Nummern werden DORT gekauft, die Sprache
      # bleibt am erkannten Herkunftsland. "US" = jeder User bekommt eine US-Nummer; leer
      # = Kauf-Land = erkanntes Land. Geo-/Sprach-Erkennung bleibt aktiv.
      - key: FORCE_NUMBER_COUNTRY
        value: "US"
      # PLAN-I18N-FIX.md P10, Aktivierungsfenster (S2, quer zu P10-P13): der Weltdefault-
      # Flip (DEFAULT_LANGUAGE de->en fuer Laender ohne eigenes Sprach-Bundle) soll in
      # Produktion erst NACH der P13-Abnahme scharf sein (sonst STT/TTS/Offenlegung eines
      # neuen Nicht-DE/FR-Tenants auf Englisch, waehrend Systemprompt/Greeting/SMS/MCP/
      # Widget noch Deutsch sind - "wirkt kaputt"). Der Blueprint-Wert ist deshalb "false" -
      # das Aktivierungsfenster bleibt bis zur P13-Abnahme geschlossen, ohne dass ein
      # manueller Render-Dashboard-Schritt das erst herstellen muss (Review-Fix Runde 2:
      # "true" haette den Flip ab der ersten Sekunde scharf geschaltet, da die Var im
      # Dashboard heute nicht existiert und der Code-Default true ist). Freischalten NACH
      # P13 = diesen Wert auf "true" setzen (Deploy) ODER direkt im Render-Dashboard
      # ueberschreiben (kein Deploy noetig). Der Katalog (test/e2e-05-us-launch-full-
      # chain.test.js "Schritt 1b") prueft den Flip-MECHANISMUS unter einem eigenen
      # env-Override, nicht ueber diesen Blueprint-Wert - siehe dortiger Kommentar.
      - key: WORLD_DEFAULT_LANGUAGE_ENABLED
        value: "false"
      # ---- Payment/Billing (Stripe Hold/Capture, P6b1) ----
      - key: PAYMENT_ENABLED
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_API_BASE
        value: "https://api.stripe.com"
      - key: NUMBER_SETUP_FEE_CENTS
        value: "0"
      # KV-P0: Flush-Stichtag fuer POST /api/billing/flush-meters (ISO-8601 mit Zone).
      # LEER = es wird NICHTS an Stripe gemeldet (fail-closed). Explizit ausgeliefert,
      # damit der Live-Wert ablesbar ist statt nur im Code zu stehen. NIE zurueckdatieren.
      - key: BILLING_FLUSH_EPOCH
        value: ""
      - key: PAYMENT_CURRENCY
        value: "eur"
      # Waehrung der Provider-Detail-Records. Default im Code = USD; hier explizit, damit
      # der Live-Wert ablesbar ist statt nur im Code zu stehen.
      - key: PROVIDER_CURRENCY
        value: "USD"
      # Kurs Provider-Waehrung -> Bucket in Mikro-Einheiten (920000 = 0,92 EUR je USD).
      # Explizit, damit der Live-Wert ablesbar ist statt nur im Code zu stehen.
      - key: PROVIDER_TO_BUCKET_RATE_MICRO
        value: "920000"
      # ---- Kosten-Abgleich im Beobachtungsmodus (LCT P3, misst - bucht NICHT) ----
      # KE-P6B: Verzug GEMESSEN (F3: Belege spaetestens 133 s nach Gespraechsende
      # vollstaendig und wertrichtig) - 30 statt 180.
      - key: COST_TRUING_DELAY_MINUTES
        value: "30"
      # KE-P6B: Kadenz des Sweeps in ms, bis dahin hartkodiert (6 h).
      - key: COST_TRUING_SWEEP_INTERVAL_MS
        value: "3600000"
      - key: COST_TRUING_MAX_ATTEMPTS
        value: "5"
      # LEER = 'incomplete' ("nichts bewiesen"), NIEMALS "vollstaendig". Erst nach
      # gemessenem Live-Beleg besetzen; waehlbar sind nur die ZUORDENBAREN Typen:
      # sip-trunking, call-control, speech-to-text, text-to-speech, recording,
      # ai-voice-assistant. NICHT waehlbar ist inference (nur conversation_id, keinem
      # Call zuordenbar) - als Pflicht-Typ verweigert der Boot seit LCT-FIX-1 den Start,
      # weil die Menge dauerhaft unerfuellbar waere. "call" existiert NICHT.
      - key: COST_TRUING_REQUIRED_RECORD_TYPES
        value: ""
      - key: COST_TRUING_MIN_COVERAGE_PERCENT
        value: "80"
      - key: COST_TRUING_COVERAGE_STALL_SWEEPS
        value: "8"
      - key: COST_DRIFT_WARN_PERCENT
        value: "50"
      - key: COST_ALERT_DEBOUNCE_MS
        value: "86400000"
      # ---- Drift-Waechter (LCT P5, misst den Ist-Minutensatz je Ziel-Praefix - justiert
      # NICHT). Default reicht, wird trotzdem explizit ausgeliefert (Muster P1/P3, der
      # Live-Wert ist ablesbar statt nur im Code zu stehen).
      - key: COST_CALIBRATION_MIN_SAMPLES
        value: "20"
      # ---- Abo-Buchung (Stripe Recurring, W4) ----
      # WARNUNG: bleibt einer der beiden Werte leer, waehrend PAYMENT_ENABLED=true,
      # verweigert der Dienst nach dem Deploy den Start (fatal, boot.js#assertPricedPlans,
      # GP-P6) - VOR einem Deploy im Dashboard nachsehen.
      - key: STRIPE_STARTER_PRICE_ID
        sync: false
      - key: STRIPE_BUSINESS_PRICE_ID
        sync: false
      # ---- Preis-Waechter (GP-P6) ----
      # Vergleicht den angezeigten Katalogpreis mit dem, was Stripe wirklich abbucht.
      # 0 = der Waechter ist KOMPLETT AUS.
      - key: PRICE_DRIFT_MIN_INTERVAL_MS
        value: "86400000"
      - key: PRICE_DRIFT_UNKNOWN_ESCALATE_AFTER
        value: "3"
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Self-Heal (Fix B): Wartezeit (ms) vor dem EINEN Checkout-Retry nach Stripe
      # resource_missing auf den Customer. 0 = sofortiger Retry.
      - key: STRIPE_CUSTOMER_RETRY_DELAY_MS
        value: "2000"
      # AUTH-P7: keine Route liest diese Variable mehr. Boot-Pflicht bleibt bis AUTH-P8
      # ausschliesslich als Rollback-Sicherung - wer sie hier streicht, macht einen
      # Rollback auf einen Commit vor AUTH-P7 unbrauchbar (kein scharfes Gate mehr).
      - key: DASHBOARD_PASSWORD
        sync: false
      # Rechteprofile (Phase 2) als JSON, z.B.
      # {"user_01ABC...":{"unrestricted":true,"maxCallsPerHour":6}}.
      # Schluessel = die Identitaet aus dem OAuth-Token (email, sonst der IdP-sub).
      # Hier setzen, weil der free plan ein fluechtiges Dateisystem hat (per-API
      # angelegte Profile ueberleben sonst keinen Neustart). Leer = keine Profile.
      - key: PROFILES_JSON
        sync: false
      # Auth-Modus fuer /mcp. Default leer = Legacy (Token unten oder localhost-only).
      # Auf "oauth" umstellen, sobald der IdP (OAUTH_ISSUER_URL) steht und der
      # End-to-End-Test gegen claude.ai gruen war (siehe PLAN-SECURITY.md, OAuth).
      - key: MCP_AUTH
        value: ""
      # Pflicht fuers Hosting (Modus leer/token): ohne Token ist /mcp nur von
      # localhost erreichbar. Render generiert den Wert; fuer den Claude-Connector auslesen.
      - key: MCP_AUTH_TOKEN
        generateValue: true
      # Nur bei MCP_AUTH=oauth noetig: Issuer-URL des IdP (im Dashboard eintragen).
      - key: OAUTH_ISSUER_URL
        sync: false
      # OAUTH_AUDIENCE (E8) hat hier BEWUSST keinen Eintrag: in Produktion bleibt die
      # Variable leer, dann gilt die kanonische <PUBLIC_URL>/mcp (s. Angekuendigter-Origin-
      # Block weiter unten). Die kanonische MCP-URL wird stattdessen beim Authorization
      # Server als Resource Indicator registriert (WorkOS: Connect -> Configuration).
      # Ein hier oder im Dashboard gesetzter, abweichender Wert ist Boot-Refusal
      # (boot-guard.angekuendigterOriginFindings) - und damit auch kein /voice.
      # AM6 (nur MCP_AUTH=oauth): WorkOS user.id (sub) des Owners -> bindet den Bootstrap-
      # Tenant idempotent (idp_subject), damit get_my_number ueber den OAuth-sub nicht leer
      # ist. Im Dashboard eintragen; opake user_-Id, kein Secret. Leer = kein Seed.
      - key: OWNER_IDP_SUBJECT
        sync: false
      # E7 (O-4/O-5): Domain-Ownership-Token der OpenAI-Einreichung. Wird im Dashboard
      # gesetzt (der Dienst ist dashboard-verwaltet, s. Kopf dieser Datei) - ein value:
      # hier waere eine zweite Wahrheit. Leer = die Challenge-Route antwortet 404.
      - key: OPENAI_APPS_CHALLENGE_TOKEN
        sync: false
      # Owner-Identitaet ist KEINE Env-Var mehr (P2b): ownerName setzt der Tenant ueber
      # das Self-Service-Dashboard (nach dem Bootstrap-CLI), nicht ueber die Env.
      - key: CLAUDE_MODEL
        value: claude-haiku-4-5
      # B5: Anbieter-Wahl. Default anthropic - B5 liefert die Faehigkeit zu wechseln,
