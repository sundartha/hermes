# Render Blueprint - Gratis 24/7-Hosting (https://render.com)
# Secrets werden NICHT hier eingetragen, sondern verschluesselt im Render-Dashboard (sync: false).
services:
  - type: web
    name: vodafone-agent
    # Datenresidenz DE/EU (Entscheidung #4): Server in Frankfurt, kein US-Transfer.
    # Schuetzt gegen versehentliche US-Default-Region. Hinweis: fuer einen BEREITS
    # bestehenden Service ist die Region per Blueprint nicht aenderbar (gilt fuer
    # frische Deploys); Wert + Guard-Test sind der eigentliche Schutz. Steuert nur
    # die App-Server-Region; die DB-Residenz haengt am DATABASE_URL-Provisioning.
    region: frankfurt
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_NUMBER
        sync: false
      # ---- Telnyx (zweiter Provider, optional - P5) ----
      # Leer lassen, wenn nur Twilio genutzt wird (Telnyx fail-closed inaktiv).
      - key: TELNYX_NUMBER
        sync: false
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_PUBLIC_KEY
        sync: false
      - key: TELNYX_API_BASE
        value: "https://api.telnyx.com"
      # TeXML-Connection-ID (Outbound) + Account-ID (Hangup). Pflicht fuer Telnyx-Outbound.
      - key: TELNYX_CONNECTION_ID
        sync: false
      - key: TELNYX_ACCOUNT_SID
        sync: false
      - key: OWNER_NUMBER
        sync: false
      - key: ALLOWED_NUMBERS
        sync: false
      # Erlaubte Laendervorwahlen (Default +49). * = alle Laender. Letztes Gate
      # bleibt ALLOWED_NUMBERS; Land + Stundenlimit greifen davor.
      - key: ALLOWED_COUNTRY_CODES
        value: "+49"
      # Max. Outbound-Calls pro gleitender Stunde (eigenes Gate, nicht RATE_LIMIT_PER_MIN).
      - key: MAX_CALLS_PER_HOUR
        value: "6"
      # ---- Onboarding ohne Payment (Kosten-Notbremse statt Stripe) ----
      # Harte Obergrenze provisionierbarer Nummern (jede kostet Geld). 0 = Not-Aus.
      - key: MAX_NUMBERS
        value: "5"
      - key: MAX_NUMBERS_PER_TENANT
        value: "1"
      # Echter Nummern-Kauf. false (Default) = Dry-Run (kein Geld). Erst true -> Kaeufe.
      - key: PROVISIONING_ENABLED
        value: "false"
      - key: PROVISIONING_COUNTRY
        value: "DE"
      - key: DASHBOARD_PASSWORD
        sync: false
      # Rechteprofile (Phase 2) als JSON, z.B.
      # {"user_01ABC...":{"unrestricted":true,"maxCallsPerHour":6}}.
      # Schluessel = die Identitaet aus dem OAuth-Token (email, sonst der IdP-sub).
      # Hier setzen, weil der free plan ein fluechtiges Dateisystem hat (per-API
      # angelegte Profile ueberleben sonst keinen Neustart). Leer = keine Profile.
      - key: PROFILES_JSON
        sync: false
      # Auth-Modus fuer /mcp. Default leer = Legacy (Token unten oder localhost-only).
      # Auf "oauth" umstellen, sobald der IdP (OAUTH_ISSUER_URL) steht und der
      # End-to-End-Test gegen claude.ai gruen war (siehe PLAN-PHASE1-OAUTH.md).
      - key: MCP_AUTH
        value: ""
      # Pflicht fuers Hosting (Modus leer/token): ohne Token ist /mcp nur von
      # localhost erreichbar. Render generiert den Wert; fuer den Claude-Connector auslesen.
      - key: MCP_AUTH_TOKEN
        generateValue: true
      # Nur bei MCP_AUTH=oauth noetig: Issuer-URL des IdP (im Dashboard eintragen).
      - key: OAUTH_ISSUER_URL
        sync: false
      - key: OWNER_NAME
        value: Jonas
      - key: CLAUDE_MODEL
        value: claude-haiku-4-5
      - key: MAX_BUDGET_EUR
        value: "8"
      - key: MAX_CALL_DURATION_S
        value: "180"
      - key: RATE_LIMIT_PER_MIN
        value: "120"
      - key: RETENTION_DAYS
        value: "30"
      # Store-Backend: json (Default, Datei) oder pg (Postgres). Bei pg DATABASE_URL setzen.
      - key: STORE_BACKEND
        value: "json"
      # Postgres-Connection-String (nur bei STORE_BACKEND=pg). Secret -> im Dashboard.
      - key: DATABASE_URL
        sync: false
      - key: TWILIO_EDGE
        value: frankfurt
      - key: SEND_SMS_SUMMARY
        value: "true"
      - key: VOICE_ENGINE
        value: budget
      # PUBLIC_URL nicht noetig: Render setzt RENDER_EXTERNAL_URL automatisch
