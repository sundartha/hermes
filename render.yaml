# Render Blueprint - Gratis 24/7-Hosting (https://render.com)
# Secrets werden NICHT hier eingetragen, sondern verschluesselt im Render-Dashboard (sync: false).
services:
  - type: web
    name: vodafone-agent
    # Datenresidenz DE/EU (Entscheidung #4): Server in Frankfurt, kein US-Transfer.
    # Schuetzt gegen versehentliche US-Default-Region. Hinweis: fuer einen BEREITS
    # bestehenden Service ist die Region per Blueprint nicht aenderbar (gilt fuer
    # frische Deploys); Wert + Guard-Test sind der eigentliche Schutz. Steuert nur
    # die App-Server-Region; die DB-Residenz haengt am DATABASE_URL-Provisioning.
    region: frankfurt
    runtime: node
    plan: free
    # HINWEIS: Dieser Service ist DASHBOARD-MANAGED (Config via Render-API, nicht via
    # Blueprint-Sync). Werte hier sind REFERENZ/Doku - die Quelle der Wahrheit ist das
    # Render-Dashboard. NICHT blind annehmen, dass ein render.yaml-Push die Live-Config
    # aendert (autoDeploy/healthCheckPath/MULTI_TENANT/SELF_SERVICE weichen live ab).
    # Single-Origin (Phase A, 2026-06-27): der Gateway baut UND serviert das apps/web-
    # Astro-Build (WEB_DIST_DIR unten), damit Frontend + /api + /auth + Session-Cookie
    # unter EINEM Origin (app.sundartha.com) laufen. apps/web hat eine eigene Lockfile
    # -> --prefix + ci. PUBLIC_GATEWAY_URL inline = nur Build-Zeit (same-origin Funnel-Links).
    buildCommand: npm install && npm --prefix apps/web ci && PUBLIC_GATEWAY_URL=https://app.sundartha.com npm --prefix apps/web run build
    startCommand: npm start
    # Pre-Deploy (Owner-Removal P2b): seedet den ersten Tenant + seine aktive Nummer
    # IN-NETWORK, BEVOR der Web-Prozess startet - loest den fail-closed Boot-Refusal
    # (leerer/frischer Store ohne Nummer -> exit 1) an der Wurzel, ohne die DB extern
    # zu oeffnen. Idempotent (zweiter Lauf = No-Op), laeuft bei jedem Deploy -> eine
    # frische DB heilt sich selbst. BOOTSTRAP_E164/PROVIDER sind NEUTRALE Deploy-
    # Parameter (KEINE Owner-Identitaet; ownerName setzt der Tenant per Self-Service).
    # Leeres BOOTSTRAP_E164 -> Script wirft fail-closed -> Deploy bricht ab (korrekt).
    preDeployCommand: npm run bootstrap-tenant -- "$BOOTSTRAP_E164" "$BOOTSTRAP_PROVIDER"
    healthCheckPath: /healthz
    autoDeploy: false
    # Deploy-Isolation (W0): rein-Frontend-/rein-Doku-Commits duerfen diesen
    # live telefonierenden Prozess NICHT neu deployen (Blast-Radius: ein
    # Frontend-Commit wuerde sonst den Container mitten im Anruf SIGTERMen).
    # ignoredPaths = der Service deployt NUR dann nicht, wenn ALLE geaenderten
    # Dateien auf diese Muster passen; jeder src/**-Commit deployt weiterhin.
    # Falls Render den Filter fuer den bestehenden Service nicht nachtraeglich
    # per Blueprint anwendet (analog zur Region-Einschraenkung): im Dashboard
    # setzen. Der Wert + render-buildfilter.test.js sind der eigentliche Schutz.
    buildFilter:
      ignoredPaths:
        - "apps/web/**"
        - "docs/**"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      # Hinweis: Absendernummern (Twilio/Telnyx) sind KEINE Env-Var mehr. Der Owner
      # ist Tenant Null und haelt seine Nummer(n) im Store - einmalig eintragen via
      # "npm run seed-owner-number -- <e164> <twilio|telnyx>" (gegen STORE_BACKEND=pg)
      # VOR dem ersten Boot; der Boot-Guard verlangt eine aktive Owner-Nummer.
      # ---- Telnyx (zweiter Provider, optional - P5) ----
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_PUBLIC_KEY
        sync: false
      - key: TELNYX_API_BASE
        value: "https://api.telnyx.com"
      # TeXML-Connection-ID (Outbound) + Account-ID (Hangup). Pflicht fuer Telnyx-Outbound.
      - key: TELNYX_CONNECTION_ID
        sync: false
      - key: TELNYX_ACCOUNT_SID
        sync: false
      # ElevenLabs-TTS ueber Telnyx (globale Plattform-Stimme). Nur aktiv, wenn
      # REF + VOICE_ID gesetzt sind; leer = Azure-Bestand. Erst NACH gruenem
      # Live-Smoke setzen (Plan/tasks/todo.md).
      - key: TELNYX_ELEVENLABS_API_KEY_REF
        sync: false
      - key: TELNYX_ELEVENLABS_VOICE_ID
        sync: false
      - key: TELNYX_ELEVENLABS_MODEL
        value: "Default"
      # Play-TTS: ElevenLabs-Stimme via <Play> in der Budget-Engine (Telnyx). GETRENNT
      # vom Relay oben. Default AUS -> Azure byte-identisch. Erst NACH gruenem
      # Live-Smoke setzen (Plan/tasks/todo.md).
      - key: ELEVENLABS_PLAY_TTS_ENABLED
        value: "false"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MODEL
        value: "eleven_flash_v2_5"
      - key: ELEVENLABS_API_BASE
        value: "https://api.elevenlabs.io"
      - key: ELEVENLABS_OUTPUT_FORMAT
        value: "mp3_44100_128"
      - key: ELEVENLABS_SYNTH_TIMEOUT_MS
        value: "4000"
      - key: ELEVENLABS_TTS_TOKEN_TTL_MS
        value: "60000"
      # ---- Telnyx AI Assistant / Brain-Shim (C-Telnyx, P10) ----
      # Master-Flag: 404 bis Cutover. Erst NACH verifiziertem Deploy im Dashboard auf
      # "true" (Owner-Cutover P11). Flag an -> Boot verlangt ASSISTANT_ID + API_KEY +
      # CONNECTION_ID + CALL_CONTROL_APP_ID (assertConfig fail-closed).
      - key: TELNYX_AI_ASSISTANT_ENABLED
        value: "false"
      # Opake Assistant-ID (KEIN Secret, aber deployment-spezifisch) -> Dashboard.
      - key: TELNYX_ASSISTANT_ID
        sync: false
      # Call-Control-App-ID (Outbound ueber /v2/calls). ANDERER Objekttyp als
      # TELNYX_CONNECTION_ID (TeXML) - Verwechslung = HTTP 422 bei jedem Outbound.
      - key: TELNYX_CALL_CONTROL_APP_ID
        sync: false
      - key: TELNYX_SHIM_MAX_TURNS_PER_MIN
        value: "30"
      # E2: statisches Shim-Bearer-Secret (SECRET) -> Dashboard.
      - key: TELNYX_SHIM_SHARED_SECRET
        sync: false
      # E3: NAME des Telnyx-Integration-Secrets fuer external_llm.llm_api_key_ref.
      - key: TELNYX_SHIM_API_KEY_REF
        sync: false
      # OBS-FLAG (Diagnose): einmaliger Shape-Dump im Shim (keys-only, NIE Werte). Safe-
      # Default false; Owner flippt im Dashboard nur fuer den EINEN Diagnose-Call auf true.
      - key: TELNYX_SHIM_DEBUG_SHAPE
        value: "false"
      # ---- Bootstrap (Owner-Removal P2b, vom preDeployCommand oben genutzt) ----
      # Erste Tenant-Absendernummer als E.164 (MUSS eine echte Provider-DID sein,
      # NICHT die Privatnummer - sonst Outbound-403). Secret-frei, aber sync:false,
      # damit der Wert nicht im Repo steht. Pflicht: leer -> Deploy bricht fail-closed.
      - key: BOOTSTRAP_E164
        sync: false
      # Provider der Bootstrap-Nummer: twilio | telnyx.
      - key: BOOTSTRAP_PROVIDER
        value: "telnyx"
      # Globaler Outbound-Kill-Switch (outbound-p3). true = ALLE Outbounds sofort 403.
      # Default false. Notbremse + Sekunden-Rollback fuer den Allowlist-Cutover.
      - key: OUTBOUND_FROZEN
        value: "false"
      # ALLOWED_NUMBERS: ab outbound-p3 wirkungslos (statische Allowlist abgeschafft);
      # Permit = per-Tenant-Verifikation. Key bleibt fuer den Owner-Env-Cleanup.
      - key: ALLOWED_NUMBERS
        sync: false
      # Erlaubte Laendervorwahlen (Default +49,+33,+44 = DE/FR/UK). * = alle Laender.
      # Land + Stundenlimit greifen vor der Verifikation; statische Liste entfaellt (outbound-p3).
      - key: ALLOWED_COUNTRY_CODES
        value: "+49,+33,+44"
      # Max. Outbound-Calls pro gleitender Stunde (eigenes Gate, nicht RATE_LIMIT_PER_MIN).
      - key: MAX_CALLS_PER_HOUR
        value: "6"
      # ---- Per-(Tenant,Ziel)-Cap + Cooldown (outbound-p1d) ----
      - key: PER_TARGET_CALL_CAP
        value: "3"
      - key: PER_TARGET_WINDOW_MS
        value: "86400000"
      # ---- Onboarding ohne Payment (Kosten-Notbremse statt Stripe) ----
      # Harte Obergrenze provisionierbarer Nummern (jede kostet Geld). 0 = Not-Aus.
      - key: MAX_NUMBERS
        value: "5"
      - key: MAX_NUMBERS_PER_TENANT
        value: "1"
      # Echter Nummern-Kauf. false (Default) = Dry-Run (kein Geld). Erst true -> Kaeufe.
      - key: PROVISIONING_ENABLED
        value: "false"
      - key: PROVISIONING_COUNTRY
        value: "DE"
      # PROV-01 (F4/F5): Auto-Redrive-Fenster (ms) fuer haengende Provisioning-Jobs.
      # 0 = Observe-Only (fail-closed, kein Auto-Nachkauf). Muss < kleinstem Anbieter-
      # Idempotenz-Fenster bleiben (Stripe 24h); scharf empfohlen 3600000. Erst nach
      # gruenem Telnyx-Idempotenz-Smoke scharfschalten.
      - key: PROVISIONING_REDRIVE_MAX_AGE_MS
        value: "0"
      # tenant-prolif-d: Grace (TAGE) bis zum Auto-DID-Release suspendierter Tenants.
      # 0 = Observe-Only (fail-closed, kein DELETE). Erst > 0 gibt echte DIDs frei.
      - key: RELEASE_GRACE_DAYS
        value: "0"
      # Kauf-Land-Override (ISO-2): alle neuen Nummern werden DORT gekauft, die Sprache
      # bleibt am erkannten Herkunftsland. "US" = jeder User bekommt eine US-Nummer; leer
      # = Kauf-Land = erkanntes Land. Geo-/Sprach-Erkennung bleibt aktiv.
      - key: FORCE_NUMBER_COUNTRY
        value: "US"
      # ---- Payment/Billing (Stripe Hold/Capture, P6b1) ----
      - key: PAYMENT_ENABLED
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_API_BASE
        value: "https://api.stripe.com"
      - key: NUMBER_SETUP_FEE_CENTS
        value: "0"
      - key: PAYMENT_CURRENCY
        value: "eur"
      # Waehrung der Provider-Detail-Records. Default im Code = USD; hier explizit, damit
      # der Live-Wert ablesbar ist statt nur im Code zu stehen.
      - key: PROVIDER_CURRENCY
        value: "USD"
      # Kurs Provider-Waehrung -> Bucket in Mikro-Einheiten (920000 = 0,92 EUR je USD).
      # Explizit, damit der Live-Wert ablesbar ist statt nur im Code zu stehen.
      - key: PROVIDER_TO_BUCKET_RATE_MICRO
        value: "920000"
      # ---- Kosten-Abgleich im Beobachtungsmodus (LCT P3, misst - bucht NICHT) ----
      # KE-P6B: Verzug GEMESSEN (F3: Belege spaetestens 133 s nach Gespraechsende
      # vollstaendig und wertrichtig) - 30 statt 180.
      - key: COST_TRUING_DELAY_MINUTES
        value: "30"
      # KE-P6B: Kadenz des Sweeps in ms, bis dahin hartkodiert (6 h).
      - key: COST_TRUING_SWEEP_INTERVAL_MS
        value: "3600000"
      - key: COST_TRUING_MAX_ATTEMPTS
        value: "5"
      # LEER = 'incomplete' ("nichts bewiesen"), NIEMALS "vollstaendig". Erst nach
      # gemessenem Live-Beleg besetzen; waehlbar sind nur die ZUORDENBAREN Typen:
      # sip-trunking, call-control, speech-to-text, text-to-speech, recording,
      # ai-voice-assistant. NICHT waehlbar ist inference (nur conversation_id, keinem
      # Call zuordenbar) - als Pflicht-Typ verweigert der Boot seit LCT-FIX-1 den Start,
      # weil die Menge dauerhaft unerfuellbar waere. "call" existiert NICHT.
      - key: COST_TRUING_REQUIRED_RECORD_TYPES
        value: ""
      - key: COST_TRUING_MIN_COVERAGE_PERCENT
        value: "80"
      - key: COST_TRUING_COVERAGE_STALL_SWEEPS
        value: "8"
      - key: COST_DRIFT_WARN_PERCENT
        value: "50"
      - key: COST_ALERT_DEBOUNCE_MS
        value: "86400000"
      # ---- Drift-Waechter (LCT P5, misst den Ist-Minutensatz je Ziel-Praefix - justiert
      # NICHT). Default reicht, wird trotzdem explizit ausgeliefert (Muster P1/P3, der
      # Live-Wert ist ablesbar statt nur im Code zu stehen).
      - key: COST_CALIBRATION_MIN_SAMPLES
        value: "20"
      # ---- Abo-Buchung (Stripe Recurring, W4) ----
      - key: STRIPE_STARTER_PRICE_ID
        sync: false
      - key: STRIPE_BUSINESS_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Self-Heal (Fix B): Wartezeit (ms) vor dem EINEN Checkout-Retry nach Stripe
      # resource_missing auf den Customer. 0 = sofortiger Retry.
      - key: STRIPE_CUSTOMER_RETRY_DELAY_MS
        value: "2000"
      - key: DASHBOARD_PASSWORD
        sync: false
      # Rechteprofile (Phase 2) als JSON, z.B.
      # {"user_01ABC...":{"unrestricted":true,"maxCallsPerHour":6}}.
      # Schluessel = die Identitaet aus dem OAuth-Token (email, sonst der IdP-sub).
      # Hier setzen, weil der free plan ein fluechtiges Dateisystem hat (per-API
      # angelegte Profile ueberleben sonst keinen Neustart). Leer = keine Profile.
      - key: PROFILES_JSON
        sync: false
      # Auth-Modus fuer /mcp. Default leer = Legacy (Token unten oder localhost-only).
      # Auf "oauth" umstellen, sobald der IdP (OAUTH_ISSUER_URL) steht und der
      # End-to-End-Test gegen claude.ai gruen war (siehe PLAN-SECURITY.md, OAuth).
      - key: MCP_AUTH
        value: ""
      # Pflicht fuers Hosting (Modus leer/token): ohne Token ist /mcp nur von
      # localhost erreichbar. Render generiert den Wert; fuer den Claude-Connector auslesen.
      - key: MCP_AUTH_TOKEN
        generateValue: true
      # Nur bei MCP_AUTH=oauth noetig: Issuer-URL des IdP (im Dashboard eintragen).
      - key: OAUTH_ISSUER_URL
        sync: false
      # AM6 (nur MCP_AUTH=oauth): WorkOS user.id (sub) des Owners -> bindet den Bootstrap-
      # Tenant idempotent (idp_subject), damit get_my_number ueber den OAuth-sub nicht leer
      # ist. Im Dashboard eintragen; opake user_-Id, kein Secret. Leer = kein Seed.
      - key: OWNER_IDP_SUBJECT
        sync: false
      # Owner-Identitaet ist KEINE Env-Var mehr (P2b): ownerName setzt der Tenant ueber
      # das Self-Service-Dashboard (nach dem Bootstrap-CLI), nicht ueber die Env.
      - key: CLAUDE_MODEL
        value: claude-haiku-4-5
      # ---- Pre-Call-Briefing (P8) ---- Default AUS; Anschalten ist Owner-Arbeit.
      - key: PRECALL_BRIEFING_ENABLED
        value: "false"
      - key: PRECALL_BRIEFING_MODEL
        value: claude-sonnet-5
      - key: PRECALL_BRIEFING_TIMEOUT_MS
        value: "6000"
      - key: MAX_BUDGET_EUR
        value: "8"
      # ---- Outbound-Kosten-Achse / Vorab-Reservierung (outbound-p1c) ----
      - key: VOICE_TARIFF_DOMESTIC_CENTS
        value: "20"
      - key: VOICE_TARIFF_DEFAULT_CENTS
        value: "300"
      # LCT P4b - Vollkosten-Untergrenze (EUR-Cent). Sinkt VOICE_TARIFF_DOMESTIC_CENTS
      # darunter bei duenner Abgleich-Deckung, warnt der Boot (WARN, kein exit).
      # 10 = teuerste aktivierbare Konfiguration (inkl. ai-voice-assistant), Kurs 0,92.
      - key: VOICE_TARIFF_FULL_COST_FLOOR_CENTS
        value: "10"
      # LCT P6 - Deckel-Basissatz je Voice-Minute (EUR-Cent). Leitet die Tenant-Kostendecke
      # aus dem Plan ab (30 min * Satz * 5/3 = Starter, 120 min * Satz * 5/4 = Business).
      # 6 = aufgerundete 5,4 gemessene ct/min -> 300 / 900 ct.
      - key: VOICE_CAP_RATE_CENTS_PER_MIN
        value: "6"
      # Muss ECHT KLEINER als MAX_BUDGET_EUR*100 sein - sonst verweigert der Boot-Guard
      # (spendCapCoherence) den Start. 600 = Starter-Minutenwert (30 min * 20 ct).
      - key: DEFAULT_TENANT_BUDGET_CENTS
        value: "600"
      # ---- Plattform-Fruehwarnung (Budget-Achsen P6) ----
      # 80% von MAX_BUDGET_EUR -> genau EIN Audit-Ereignis pro Spend-Monat, BEVOR der
      # Plattform-Notaus blockt. AENDERT KEINE Gate-Entscheidung.
      - key: PLATFORM_SPEND_WARN_PERCENT
        value: "80"
      # Betreiber-Nummer fuer die Warn-SMS. Leer = nur Audit-Log, keine SMS. MUSS vor
      # dem P7-Flip auf eine echte Betreiber-Nummer gesetzt werden (sonst liest niemand
      # die Warnung).
      - key: PLATFORM_ALERT_SMS_TO
        value: ""
      # ---- Spend-Monat-Flip (Budget-Achsen P7) ----
      # AN = beide Gate-Achsen messen im UTC-Kalendermonat statt lebenslang. AUS (Default)
      # ist byte-identisch zum Bestand. Vorbedingung vor dem Flip: Live-Beleg, dass
      # spendMonthKey einen Neustart uebersteht. Rollback = Env-Flip ohne Deploy.
      - key: BUDGET_MONTH_ENABLED
        value: "false"
      # ---- Fixkosten sichtbar machen (LCT P7) ---- Listenpreis, reine Anzeige, NIE ein Gate.
      - key: TTS_CHARACTER_QUOTA
        value: "39981"
      - key: TTS_CHARACTER_QUOTA_WARN_PERCENT
        value: "75"
      - key: TTS_QUOTA_CYCLE_ANCHOR_DAY
        value: "3"
      - key: PLATFORM_FIXED_COST_CENTS_PER_MONTH
        value: "600"
      - key: NUMBER_MONTHLY_COST_CENTS
        value: "92"
      # ---- LLM-Resilienz (Budget-Engine, src/llm.js) ----
      - key: LLM_REQUEST_TIMEOUT_MS
        value: "3500"
      - key: LLM_MAX_RETRIES
        value: "2"
      - key: LLM_BACKOFF_MS
        value: "250"
      - key: LLM_BREAKER_THRESHOLD
        value: "5"
      - key: LLM_BREAKER_WINDOW_MS
        value: "10000"
      - key: LLM_BREAKER_COOLDOWN_MS
        value: "30000"
      # L0-Instrumentierung: PII-freie Latenz-/STT-Gap-Logs UND (GAP-35) das
      # Ablehnungs-Ereignis mit Land/Sprache. Im Mehr-Laender-Betrieb
      # (ALLOWED_COUNTRY_CODES > 1 Eintrag bzw. "*") ist das die EINZIGE Log-Zeile, an
      # der ein laenderweiter Totalausfall auffaellt -> hier "true".
      # ACHTUNG: der Live-Service ist Dashboard-managed - dieser Blueprint-Wert allein
      # schaltet nichts scharf (Betriebsauflage im Abnahmeprotokoll).
      - key: METRICS_ENABLED
        value: "true"
      - key: MAX_CALL_DURATION_S
        value: "180"
      # OUT-05: Reserve-Backstop-Puffer (ms) ueber der Call-Max-Dauer.
      - key: RESERVE_RELEASE_GRACE_MS
        value: "15000"
      # A6 (F11): Watchdog-Obergrenze (ms) fuer den SIGTERM-Graceful-Shutdown-Drain.
      - key: SHUTDOWN_DRAIN_TIMEOUT_MS
        value: "8000"
      # OUT-05: Test-Seam - in Produktion IMMER false (der Boot verweigert true ohnehin,
      # da SKIP_TWILIO_SIGNATURE_CHECK dort false ist). Explizit gepinnt gegen Foot-Gun.
      - key: FAKE_ORIGINATE
        value: "false"
      - key: RATE_LIMIT_PER_MIN
        value: "120"
      - key: RETENTION_DAYS
        value: "30"
      # P2b: Diagnose-Retention in Produktion vorerst AUS. Erst auf "7" stellen, wenn die
      # Datenschutzerklaerung (apps/web) den Diagnosemodus + die Frist nennt. Achtung:
      # die Live-Services sind Dashboard-managed - diese Zeile allein aendert Live nichts.
      - key: DIAGNOSTIC_RETENTION_DAYS
        value: "0"
      # Store-Backend: json (Default, Datei) oder pg (Postgres). Bei pg DATABASE_URL setzen.
      - key: STORE_BACKEND
        value: "pg"
      # Postgres-Connection-String (nur bei STORE_BACKEND=pg). Secret -> im Dashboard.
      - key: DATABASE_URL
        sync: false
      # ---- Web-Login (Kunden-Portal, OIDC Auth-Code + PKCE) ----
      # SESSION_SECRET: langer Zufallswert (z.B. openssl rand -hex 32). Secret -> Dashboard.
      - key: SESSION_SECRET
        sync: false
      # OIDC-Client fuer den Browser-Flow (Issuer = OAUTH_ISSUER_URL, geteilt mit /mcp).
      - key: OIDC_CLIENT_ID
        sync: false
      # WorkOS AuthKit Client-Secret. Secret -> im Dashboard.
      - key: OIDC_CLIENT_SECRET
        sync: false
      # WorkOS User-Management API-Basis (authorize/authenticate). Default api.workos.com
      # (gleich fuer Staging/Prod; Umgebung via client_id/API-Key). Nur Self-Hosting/Tests aendern.
      - key: WORKOS_API_BASE
        value: https://api.workos.com
      # Admin-Allowlist (kommasepariert, E-Mails). Leer = kein Admin-Zugriff.
      - key: ADMIN_EMAILS
        sync: false
      # Strengeres Rate-Limit fuer Login/Callback (Brute-Force-Schutz). Default 10/min.
      - key: LOGIN_RATE_LIMIT_PER_MIN
        value: "10"
      # Lebensdauer der Browser-Session in Sekunden (Default 1 h).
      - key: SESSION_TTL_SECONDS
        value: "3600"
      # Lebensdauer der Login-Flow-Cookies (state/pkce) in Sekunden (Default 30 min).
      - key: LOGIN_COOKIE_TTL_SECONDS
        value: "1800"
      # ---- Multi-Tenant + Self-Service (web-session-only) ----
      # MULTI_TENANT: Tenant-Scoping aktivieren (Default aus = Owner byte-identisch).
      - key: MULTI_TENANT
        value: "false"
      # SELF_SERVICE_ENABLED: Kunden-Self-Service (/api/self-service/*). WEB-SESSION-ONLY:
      # die Routen sind NUR aktiv mit SESSION_SECRET + STORE_BACKEND=pg + MULTI_TENANT=true
      # (Login ueber /auth/login). Ohne diese Infra sind sie nicht erreichbar (404).
      - key: SELF_SERVICE_ENABLED
        value: "false"
      # Single-Origin (Phase A): Pfad zum apps/web-Astro-Build, das der Gateway statisch
      # ausliefert (src/server.js, gegated). Leer = Serving aus (byte-identisch). SCHARFER
      # SCHALTER: nur setzen, wenn der buildCommand oben apps/web/dist erzeugt - sonst
      # Boot-Refusal (config.js: WEB_DIST_DIR gesetzt aber kein dist/index.html).
      - key: WEB_DIST_DIR
        value: "apps/web/dist"
      - key: TWILIO_EDGE
        value: frankfurt
      - key: SEND_SMS_SUMMARY
        value: "true"
      - key: VOICE_ENGINE
        value: budget
      # PUBLIC_URL nicht noetig: Render setzt RENDER_EXTERNAL_URL automatisch

  # ---- 2) Produkt-Frontend (W0, Static Site aufs CDN) ----
  # Eigenstaendiges Astro-Paket unter apps/web/. Deployt getrennt vom Gateway;
  # ein reiner apps/web/**-Commit loest hier (paths), aber NICHT am Gateway
  # (ignoredPaths oben) einen Deploy aus. Erstmal unter eigener onrender.com-URL.
  - type: web
    runtime: static # Render-Static-Site (gegen render.yaml-Schema geprueft: type:web + runtime:static + staticPublishPath)
    name: hermes-web
    # KEIN plan-Feld: Static Sites haben keine Plan-Stufen (immer kostenlos). Ein
    # "plan: free" lehnt Render beim Blueprint ab ("no such plan free for service
    # type web"); nur der Node-Service oben traegt plan:free.
    autoDeploy: false
    # Build-Isolation via eigener Lockfile (R8): apps/web/ traegt ein eigenes
    # package-lock.json. Darum rootDir + npm ci (NICHT die Root-Workspace-Variante)
    # — die Root-package.json hat KEINE workspaces, und eine gemeinsame Lockfile
    # wuerde ein Frontend-Dep-Bump in den Gateway-paths-Filter ziehen.
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Build-Zeit-Var: Astro inlinet PUBLIC_*-Vars ins statische HTML. Absoluter
      # Auth-Origin des Gateways fuer die Login-/Funnel-Links (routes.js -> LOGIN_URL).
      # Die Static Site hat selbst kein /auth/login (404); der OIDC-Flow lebt auf dem
      # Gateway-Service. routes.js ist fail-closed -> fehlt die Var, bricht der Build ab
      # (statt still 404 zu liefern). Spaeterer Track-B-Cutover = nur dieser Wert.
      - key: PUBLIC_GATEWAY_URL
        value: "https://vodafone-agent.onrender.com"
    buildFilter:
      paths:
        - "apps/web/**"
    routes:
      - type: rewrite # SPA-Fallback NUR fuer den interaktiven App-Teil (W2+)
        source: /app/*
        destination: /app/index.html
      # Deep-Link-Hardening (Bug B, Phase 2): /auth/* existiert auf der Static Site
      # nicht (404). Die Funnel-Links zeigen zwar absolut auf den Gateway (routes.js
      # -> PUBLIC_GATEWAY_URL), aber direkt eingegebene/gebookmarkte/alt-verlinkte
      # sundartha.com/auth/*-URLs wuerden sonst 404en. Redirect leitet sie an den
      # Gateway-Auth-Origin. CSP-konform (Top-Level-Navigation, nicht connect-src);
      # :splat erhaelt den Restpfad. Disjunkt zu /app/* -> keine Reihenfolge-Kollision.
      - type: redirect
        source: /auth/*
        destination: https://vodafone-agent.onrender.com/auth/:splat
    headers: # Static-Service hat KEINE Express-securityHeaders -> selbst setzen
      - path: /*
        name: X-Frame-Options
        value: DENY
      # Strikte CSP: rein statische Marketing-Site (kein Auth/Secret/User-Input,
      # keine /api). Das Fluegel-Logo ist eine reine CSS-Keyframe-Animation (kein
      # WebGL/Pixi) -> KEIN 'unsafe-eval' noetig. default-src 'self' deckt
      # img/connect/style/frame dicht ab. Die Gateway-/App-CSP (vodafone-agent)
      # ist davon NICHT betroffen.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
      # Hero-Video (Bug: Stocken/"Reload"-Optik nach laengerer Session; Root
      # Cause Single-GOP-Encoding behoben durch Re-Encode mit kurzem GOP + JS-
      # Seamless-Loop, siehe PLAN-HERO-VIDEO.md und SPEC-HERO-VIDEO-FIX.md):
      # ohne eigene Regel greift nur der Render-Default (public, max-age=0,
      # s-maxage=300) -> jeder Frisch-Load revalidiert. Datei ist versioniert
      # (_v2-Suffix statt Content-Hash) -> bei jeder kuenftigen Video-Aenderung
      # MUSS das Suffix inkrementieren UND dieser Pfad mitziehen (sonst liefert
      # der Browser bis zu 1 Jahr die alte Datei aus dem Disk-Cache).
      - path: /assets/hermes_olymp_v2.mp4
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
