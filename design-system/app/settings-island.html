<!-- @dsCard group="App / Dashboard" name="Settings island" subtitle="The only write path: name, greeting, permissions" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Settings island — Hermes Design System</title>
<link rel="stylesheet" href="../_shared/tokens.css" />
<link rel="stylesheet" href="../_shared/preview.css" />
</head>
<body class="ds">
<div class="ds-frame ds-frame--narrow">
  <div class="card">
    <h2 class="card__title">Settings</h2>
    <div class="ds-stack">
      <div><div class="field-label">Agent name</div><input class="field-input" value="Hermes" /></div>
      <div><div class="field-label">Greeting</div><input class="field-input" value="Hi, you've reached Antonio's assistant." /></div>
      <div><div class="field-label">Language</div>
        <select class="field-input"><option>Deutsch (de-DE)</option><option>English (en-US)</option></select>
      </div>

      <fieldset style="border:0; margin: var(--space-tight) 0 0; padding:0">
        <div class="perm-row">
          <div class="perm-text"><span class="perm-title">Outbound calls</span><span class="perm-hint">Place calls on your behalf</span></div>
          <label class="switch"><input type="checkbox" checked /><span class="switch-slider"></span></label>
        </div>
        <div class="perm-row">
          <div class="perm-text"><span class="perm-title">SMS confirmations</span><span class="perm-hint">Text after a completed call</span></div>
          <label class="switch"><input type="checkbox" /><span class="switch-slider"></span></label>
        </div>
        <div class="perm-row">
          <div class="perm-text"><span class="perm-title">Calendar access</span><span class="perm-hint">Read upcoming appointments</span></div>
          <label class="switch"><input type="checkbox" checked /><span class="switch-slider"></span></label>
        </div>
      </fieldset>

      <div class="ds-row">
        <button class="btn">Save changes</button>
        <span style="font-size: var(--text-eyebrow); font-weight: var(--weight-label); color: var(--color-status-positive)">Saved.</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
