<!-- @dsCard group="MCP" name="list_calls" subtitle="Recent inbound & outbound calls — Olympus HUD, mirrors src/ui/widgets/calls.html — DESIGN ONLY" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MCP list_calls — Hermes Design System</title>
<link rel="stylesheet" href="../_shared/preview.css" />
<style>
  /* Kartenchrome + .list-Basis 1:1 aus src/ui/hud-card-css.js - siehe
     agent-status.html fuer die ausfuehrliche Begruendung. Feldspezifische
     Overrides ([data-field=...]) 1:1 aus src/ui/widgets/calls.html. */
  :root {
    --color-navy-800:#0f2d52; --color-navy-900:#0a2245; --color-navy-card:#13335c;
    --color-white:#fff;
    --radius-card:22px; --radius-pill:99px;
    --font-sans:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
    --ease:cubic-bezier(0.22,1,0.36,1);
    --wing-size:86px;
    --color-accent-light:#5ea1e0;
    --color-accent-light-strong:#8ec2ee;
    --color-accent-light-rgb:94,161,224;
    --color-accent-light-glow:rgba(var(--color-accent-light-rgb),.5);
    --wing-glow-filter:drop-shadow(0 0 16px var(--color-accent-light-glow)) drop-shadow(0 2px 8px rgba(3,10,24,.6));
  }
  .card{
    position:relative;max-width:min(480px,100%);padding:22px 24px 18px;
    border-radius:var(--radius-card);overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(var(--color-accent-light-rgb),.14) 0%, rgba(var(--color-accent-light-rgb),0) 55%),
      linear-gradient(165deg, var(--color-navy-card) 0%, var(--color-navy-800) 42%, var(--color-navy-900) 100%);
    border:1px solid rgba(var(--color-accent-light-rgb),.26);
    box-shadow:
      0 1px 0 rgba(255,255,255,.06) inset,
      0 22px 44px -20px rgba(3,10,24,.7),
      0 0 48px -18px var(--color-accent-light-glow);
    font-family:var(--font-sans);color:var(--color-white);
  }
  .card::after{
    content:"";position:absolute;inset:0 0 auto 0;height:150px;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.025) 0px, rgba(255,255,255,.025) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    mask-image:linear-gradient(to bottom, rgba(0,0,0,.8), transparent);
  }
  .eyebrow{position:relative;z-index:1;font-size:10.5px;letter-spacing:.2em;
    text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:600}
  .hero{position:relative;z-index:1;display:flex;flex-direction:column;
    align-items:center;gap:8px;padding:14px 0 18px;text-align:center}
  .wing-wrap{position:relative;width:var(--wing-size);height:var(--wing-size);
    display:grid;place-items:center;flex-shrink:0}
  .wing-mount{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .wing-mount canvas{filter:var(--wing-glow-filter)}
  .phase{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.5)}
  .hero-title{font-size:16px;font-weight:600;color:rgba(255,255,255,.94)}
  .list{position:relative;z-index:1;display:flex;flex-direction:column}
  .list .row{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;
    padding:11px 2px;border-top:1px solid rgba(255,255,255,.09)}
  .list .row:first-child{border-top:1px solid rgba(255,255,255,.16)}
  .list .cell{color:rgba(255,255,255,.85)}
  .cell[data-field="direction"]{font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.22);
    border-radius:var(--radius-pill);padding:2px 9px}
  .cell[data-field="counterparty"]{font-weight:600;color:rgba(255,255,255,.94)}
  .cell[data-field="status"]{color:var(--color-accent-light-strong);font-size:12px}
  .cell[data-field="startedAt"]{margin-left:auto;color:rgba(255,255,255,.45);
    font-size:11.5px;font-variant-numeric:tabular-nums}
  .cell[data-field="summary"]{flex-basis:100%;color:rgba(255,255,255,.55);font-size:12.5px}
  .foot{position:relative;z-index:1;display:flex;align-items:center;
    justify-content:space-between;margin-top:14px;padding-top:12px;
    border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:rgba(255,255,255,.4)}
</style>
</head>
<body class="ds">
<div class="ds-frame ds-frame--narrow">
  <p class="ds-note">Mockup. Mirrors src/ui/widgets/calls.html — same field order/colors per row.</p>
  <div class="card">
    <div class="eyebrow">Hermes · Recent calls</div>
    <div class="hero">
      <div class="wing-wrap">
        <span class="wing-mount" data-wing data-status="idle"></span>
      </div>
      <span class="phase">list_calls</span>
      <span class="hero-title">Recent calls</span>
    </div>
    <div class="list">
      <div class="row">
        <span class="cell" data-field="direction">Outbound</span>
        <span class="cell" data-field="counterparty">Salon Bella</span>
        <span class="cell" data-field="status">Completed</span>
        <span class="cell" data-field="startedAt">Thu 14:28</span>
        <span class="cell" data-field="summary">Haircut booked, Thu 14:30</span>
      </div>
      <div class="row">
        <span class="cell" data-field="direction">Inbound</span>
        <span class="cell" data-field="counterparty">+49 30 55512345</span>
        <span class="cell" data-field="status">Completed</span>
        <span class="cell" data-field="startedAt">Wed 09:14</span>
        <span class="cell" data-field="summary">Message taken for the owner</span>
      </div>
    </div>
    <div class="foot"><span>Hermes</span></div>
  </div>
</div>
<script src="../components/brand/wing-engine.js"></script>
<script>
  HermesWingEngine.mount(document.querySelector("[data-wing]"), {
    size: 86, status: "idle", textureUrl: "../assets/logos/hermes-wing.png",
  });
</script>
</body>
</html>
