<!-- @dsCard group="MCP" name="get_calendar" subtitle="The owner's next calendar entries — Olympus HUD, mirrors src/ui/widgets/calendar.html — DESIGN ONLY" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MCP get_calendar — Hermes Design System</title>
<link rel="stylesheet" href="../_shared/preview.css" />
<link rel="stylesheet" href="../_shared/hud-card.css" />
<style>
  /* Kartenchrome (Tokens/.card/.eyebrow/.hero/.wing-wrap/.phase/.hero-title/
     .foot) kommt aus ../_shared/hud-card.css (EINE Quelle statt 4x Kopie,
     G5/S2-Fix) - 1:1 aus src/ui/hud-card-css.js. Hier nur die .list-Basis +
     feldspezifischen Overrides ([data-field=...]) 1:1 aus
     src/ui/widgets/calendar.html. */
  .list{position:relative;z-index:1;display:flex;flex-direction:column}
  .list .row{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;
    padding:11px 2px;border-top:1px solid rgba(255,255,255,.09)}
  .list .row:first-child{border-top:1px solid rgba(255,255,255,.16)}
  .list .cell{color:rgba(255,255,255,.85)}
  .cell[data-field="title"]{font-weight:600;flex-basis:100%;color:rgba(255,255,255,.94)}
  .cell[data-field="start"]{color:rgba(255,255,255,.5);font-size:12px;font-variant-numeric:tabular-nums}
  .cell[data-field="end"]{margin-left:auto;color:rgba(255,255,255,.5);font-size:12px;font-variant-numeric:tabular-nums}
</style>
</head>
<body class="ds">
<div class="ds-frame ds-frame--narrow">
  <p class="ds-note">Mockup. Mirrors src/ui/widgets/calendar.html — same field order/colors per row.</p>
  <div class="card">
    <div class="eyebrow">Hermes · Calendar</div>
    <div class="hero">
      <div class="wing-wrap">
        <span class="wing-mount" data-wing data-status="idle"></span>
      </div>
      <span class="phase">get_calendar</span>
      <span class="hero-title">Calendar</span>
    </div>
    <div class="list">
      <div class="row">
        <span class="cell" data-field="title">Haircut — Salon Bella</span>
        <span class="cell" data-field="start">Thu 14:30</span>
        <span class="cell" data-field="end">Thu 15:00</span>
      </div>
      <div class="row">
        <span class="cell" data-field="title">Dentist appointment</span>
        <span class="cell" data-field="start">Fri 09:00</span>
        <span class="cell" data-field="end">Fri 09:30</span>
      </div>
    </div>
    <div class="foot"><span>Hermes</span></div>
  </div>
</div>
<script src="../components/brand/wing-engine.js"></script>
<script>
  HermesWingEngine.mount(document.querySelector("[data-wing]"), {
    size: 86, status: "idle", textureUrl: "../assets/logos/hermes-wing.png",
  });
</script>
</body>
</html>
