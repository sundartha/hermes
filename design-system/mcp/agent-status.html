<!-- @dsCard group="MCP (Mockup)" name="get_agent_status" subtitle="Number, engine, usage & budget — DESIGN ONLY" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MCP get_agent_status — Hermes Design System</title>
<link rel="stylesheet" href="../_shared/tokens.css" />
<link rel="stylesheet" href="../_shared/preview.css" />
</head>
<body class="ds">
<div class="ds-frame ds-frame--narrow">
  <p class="ds-note"><strong>Mockup.</strong> Design proposal for the agent overview card.</p>
  <div class="mcp-card">
    <div class="mcp-card__head">
      <span class="mcp-card__icon" id="wing-icon" style="width:52px;height:52px;overflow:hidden;background:radial-gradient(120% 120% at 30% 0%,#1b4f86 0%,#0f2d52 72%)"></span>
      <span class="mcp-card__head-body">
        <span class="mcp-card__title">Hermes</span>
        <span class="mcp-card__sub">get_agent_status</span>
      </span>
      <span class="ds-row" style="gap: var(--space-tight); font-size: var(--text-eyebrow); color: var(--color-status-positive)"><span class="live-dot"></span> Online</span>
    </div>
    <div class="mcp-card__body">
      <div class="mcp-line"><span class="mcp-line__key">Number</span><span class="mcp-line__val">+1 864 302 8341 · Telnyx</span></div>
      <div class="mcp-line"><span class="mcp-line__key">Engine</span><span class="mcp-line__val">Budget (Gather/STT)</span></div>
      <div class="mcp-line"><span class="mcp-line__key">Today</span><span class="mcp-line__val">3 calls · 11 min</span></div>
      <div class="mcp-line"><span class="mcp-line__key">Budget</span><span class="mcp-line__val">€2.10 / €10.00</span></div>
    </div>
    <div class="mcp-card__foot"><span>Outbound: allowed</span><span>KYC: card</span></div>
  </div>
</div>
<script src="../components/brand/wing-engine.js"></script>
<script>
  // get_agent_status · Online -> the wing hovers, quietly alive (idle)
  HermesWingEngine.mount(document.getElementById("wing-icon"), {
    size: 52, status: "idle", textureUrl: "../assets/logos/hermes-wing.png",
  });
</script>
</body>
</html>
