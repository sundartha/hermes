<!-- @dsCard group="MCP (Mockup)" name="place_call result" subtitle="Dialing confirmation card — DESIGN ONLY" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MCP place_call — Hermes Design System</title>
<link rel="stylesheet" href="../_shared/tokens.css" />
<link rel="stylesheet" href="../_shared/preview.css" />
</head>
<body class="ds">
<div class="ds-frame ds-frame--narrow">
  <p class="ds-note"><strong>Mockup.</strong> The live MCP returns plain text today; this is how a rich card could render in the chatbot.</p>
  <div class="mcp-card">
    <div class="mcp-card__head">
      <span class="mcp-card__icon">&#8599;</span>
      <span class="mcp-card__head-body">
        <span class="mcp-card__title">Call started</span>
        <span class="mcp-card__sub">place_call · Hermes</span>
      </span>
      <span class="status-badge status-badge--info">Dialing</span>
    </div>
    <div class="mcp-card__body">
      <div class="mcp-line"><span class="mcp-line__key">To</span><span class="mcp-line__val">Salon Bella · +49 30 1234567</span></div>
      <div class="mcp-line"><span class="mcp-line__key">Objective</span><span class="mcp-line__val">Book a haircut Thu afternoon</span></div>
      <div class="mcp-line"><span class="mcp-line__key">Language</span><span class="mcp-line__val">Deutsch (de-DE)</span></div>
      <div class="mcp-line"><span class="mcp-line__key">Max duration</span><span class="mcp-line__val">5 min</span></div>
    </div>
    <div class="mcp-card__foot">
      <span>call_mqmpvuzz1079</span>
      <span>Disclosure spoken first</span>
    </div>
  </div>
</div>
</body>
</html>
