<!-- @dsCard group="MCP (Mockup)" name="get_call_status" subtitle="Live status + last transcript lines — DESIGN ONLY" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MCP get_call_status — Hermes Design System</title>
<link rel="stylesheet" href="../_shared/tokens.css" />
<link rel="stylesheet" href="../_shared/preview.css" />
</head>
<body class="ds">
<div class="ds-frame ds-frame--narrow">
  <p class="ds-note"><strong>Mockup.</strong> Design proposal for a rich MCP status card.</p>
  <div class="mcp-card">
    <div class="mcp-card__head">
      <span class="mcp-card__icon"><span class="live-dot"></span></span>
      <span class="mcp-card__head-body">
        <span class="mcp-card__title">Call in progress</span>
        <span class="mcp-card__sub">get_call_status · Salon Bella</span>
      </span>
      <span class="status-badge status-badge--active">Active</span>
    </div>
    <div class="mcp-card__body">
      <div class="mcp-line"><span class="mcp-line__key">Duration</span><span class="mcp-line__val">01:24</span></div>
      <p class="ds-eyebrow" style="margin: var(--space-tight) 0 0">Last lines</p>
      <div class="turn turn--agent"><span class="turn__who">Agent</span><span class="turn__bubble">Guten Tag, ich rufe im Auftrag von Antonio an...</span></div>
      <div class="turn turn--caller"><span class="turn__who">Salon</span><span class="turn__bubble">Donnerstag 14:30 passt.</span></div>
    </div>
    <div class="mcp-card__foot"><span>call_mqmpvuzz1079</span><span>de-DE</span></div>
  </div>
</div>
</body>
</html>
