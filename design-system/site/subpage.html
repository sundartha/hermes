<!-- @dsCard group="Site / Hero" name="Subpage chrome" subtitle="Dark nav + content section for marketing pages" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Subpage — Hermes Design System</title>
<link rel="stylesheet" href="../_shared/tokens.css" />
<link rel="stylesheet" href="../_shared/preview.css" />
</head>
<body class="ds">
<div class="on-dark">
  <div style="padding: var(--space-roomy)">
    <nav class="hero__nav" style="margin-bottom: var(--space-section)">
      <span class="hero__brand"><span class="hero__brand-mark">&#9758;</span> HERMES</span>
      <span class="hero__links">
        <a class="hero__link" href="#">How it works</a>
        <a class="hero__link" href="#">Pricing</a>
        <a class="hero__link" href="#">Sign in</a>
      </span>
      <a class="pill-cta" href="#">Get started</a>
    </nav>

    <section style="max-width: 720px">
      <p class="ds-eyebrow" style="color: var(--text-on-dark-faint)">How it works</p>
      <h1 class="hero__title" style="font-size: var(--text-display)">Three steps to a phone line.</h1>
      <p class="hero__sub" style="margin-top: var(--space-stack)">Connect Hermes from Claude, get a real number, and let your agent take and place calls — disclosed, gated, and logged.</p>

      <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-gap); margin-top: var(--space-section)">
        <div class="card-dark"><div class="card-dark__price" style="font-size: var(--text-title)">1</div><p style="margin: var(--space-tight) 0 0">Connect via MCP</p></div>
        <div class="card-dark"><div class="card-dark__price" style="font-size: var(--text-title)">2</div><p style="margin: var(--space-tight) 0 0">Claim a number</p></div>
        <div class="card-dark"><div class="card-dark__price" style="font-size: var(--text-title)">3</div><p style="margin: var(--space-tight) 0 0">Make calls</p></div>
      </div>
    </section>
  </div>
</div>
</body>
</html>
