<!-- @dsCard group="Site / Hero" name="Pricing cards" subtitle="Starter & Business tiers on dark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pricing — Hermes Design System</title>
<link rel="stylesheet" href="../_shared/tokens.css" />
<link rel="stylesheet" href="../_shared/preview.css" />
</head>
<body class="ds">
<div class="on-dark">
  <div style="padding: var(--space-section) var(--space-roomy); text-align:center">
    <p class="ds-eyebrow" style="color: var(--text-on-dark-faint)">Pricing</p>
    <h1 class="hero__title" style="font-size: var(--text-display); margin-bottom: var(--space-section)">Simple monthly plans.</h1>

    <div style="display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--space-gap); max-width: 640px; margin: 0 auto; text-align:left">
      <div class="card-dark">
        <p class="ds-eyebrow" style="color: var(--text-on-dark-faint)">Starter</p>
        <div class="card-dark__price">$4.99<span style="font-size: var(--text-body); color: var(--text-on-dark-faint)">/mo</span></div>
        <p style="margin: var(--space-cozy) 0 var(--space-loose)">30 minutes · 1 number</p>
        <a class="pill-cta" href="#">Choose Starter</a>
      </div>
      <div class="card-dark" style="border-color: rgba(255,255,255,0.18)">
        <p class="ds-eyebrow" style="color: var(--text-on-dark-faint)">Business</p>
        <div class="card-dark__price">$9.99<span style="font-size: var(--text-body); color: var(--text-on-dark-faint)">/mo</span></div>
        <p style="margin: var(--space-cozy) 0 var(--space-loose)">120 minutes · 1 number</p>
        <a class="pill-cta" href="#">Choose Business</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
