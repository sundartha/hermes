<!-- @dsCard group="Foundation" name="Spacing, Radii & Shadow" subtitle="4px scale, corner radii, soft elevation" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spacing, Radii &amp; Shadow — Hermes Design System</title>
<link rel="stylesheet" href="../_shared/tokens.css" />
<link rel="stylesheet" href="../_shared/preview.css" />
</head>
<body class="ds">
<div class="ds-frame ds-frame--wide">
  <header>
    <p class="ds-eyebrow">Foundation</p>
    <h1 class="ds-title">Spacing, Radii &amp; Shadow</h1>
  </header>

  <section class="ds-stack">
    <p class="ds-eyebrow">Spacing scale (4px base)</p>
    <div class="scale-row"><span class="scale-row__tag">space-1 · 4</span><div class="scale-bar" style="width: 4px"></div></div>
    <div class="scale-row"><span class="scale-row__tag">space-2 · 8</span><div class="scale-bar" style="width: 8px"></div></div>
    <div class="scale-row"><span class="scale-row__tag">space-3 · 12</span><div class="scale-bar" style="width: 12px"></div></div>
    <div class="scale-row"><span class="scale-row__tag">space-4 · 16</span><div class="scale-bar" style="width: 16px"></div></div>
    <div class="scale-row"><span class="scale-row__tag">space-6 · 24</span><div class="scale-bar" style="width: 24px"></div></div>
    <div class="scale-row"><span class="scale-row__tag">space-8 · 32</span><div class="scale-bar" style="width: 32px"></div></div>
    <div class="scale-row"><span class="scale-row__tag">space-12 · 48</span><div class="scale-bar" style="width: 48px"></div></div>
    <div class="scale-row"><span class="scale-row__tag">space-20 · 80</span><div class="scale-bar" style="width: 80px"></div></div>
  </section>

  <section>
    <p class="ds-eyebrow">Radii</p>
    <div class="ds-row">
      <div style="text-align:center"><div class="radius-demo" style="border-radius: var(--radius-sm)"></div><div class="swatch__val">sm · 12</div></div>
      <div style="text-align:center"><div class="radius-demo" style="border-radius: var(--radius-md)"></div><div class="swatch__val">md · 16</div></div>
      <div style="text-align:center"><div class="radius-demo" style="border-radius: var(--radius-lg)"></div><div class="swatch__val">lg · 18</div></div>
      <div style="text-align:center"><div class="radius-demo" style="border-radius: var(--radius-pill)"></div><div class="swatch__val">pill · 99</div></div>
    </div>
  </section>

  <section>
    <p class="ds-eyebrow">Elevation</p>
    <div class="ds-row">
      <div class="shadow-demo"></div>
      <span class="swatch__val">shadow-soft · 0 6px 18px rgba(0,0,0,.07)</span>
    </div>
  </section>
</div>
</body>
</html>
