<!-- @dsCard group="Components" name="Badges & Status" subtitle="Call status pills, tags, live indicator" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Badges &amp; Status — Hermes Design System</title>
<link rel="stylesheet" href="../_shared/tokens.css" />
<link rel="stylesheet" href="../_shared/preview.css" />
</head>
<body class="ds">
<div class="ds-frame ds-frame--narrow">
  <header>
    <p class="ds-eyebrow">Components</p>
    <h1 class="ds-title">Badges &amp; Status</h1>
  </header>

  <section>
    <p class="ds-eyebrow">Call status (.status-badge)</p>
    <div class="ds-row">
      <span class="status-badge status-badge--active">Active</span>
      <span class="status-badge status-badge--completed">Completed</span>
      <span class="status-badge status-badge--cancelled">Cancelled</span>
      <span class="status-badge status-badge--failed">Failed</span>
      <span class="status-badge status-badge--info">Dialing</span>
    </div>
  </section>

  <section>
    <p class="ds-eyebrow">Tag (.tag)</p>
    <div class="ds-row">
      <span class="tag tag--appointment">Appointment</span>
    </div>
  </section>

  <section>
    <p class="ds-eyebrow">Live indicator (.live-dot)</p>
    <div class="ds-row">
      <span class="ds-row" style="gap: var(--space-tight)"><span class="live-dot"></span> Live</span>
      <span class="ds-row" style="gap: var(--space-tight)"><span class="live-dot live-dot--off"></span> Offline</span>
    </div>
  </section>
</div>
</body>
</html>
