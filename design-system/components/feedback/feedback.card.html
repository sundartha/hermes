<!-- @dsCard group="Components" name="Feedback — Status, LiveDot, Stat" viewport="700x300" subtitle="Status badges, live indicator, KPI tiles" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Feedback — Hermes Design System</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); color: var(--color-text); background: var(--color-surface); -webkit-font-smoothing: antialiased; }
  .wrap { padding: 28px 32px; display: flex; flex-direction: column; gap: 22px; }
  .eyebrow { margin: 0 0 10px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--color-muted); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" data-presets="react">
  const { StatusBadge, LiveDot, Stat } = window.HermesDesignSystem_738510;
  function Demo() {
    return (
      <>
        <div>
          <p className="eyebrow">StatusBadge — tones</p>
          <div className="row">
            <StatusBadge tone="active">Active</StatusBadge>
            <StatusBadge tone="completed">Completed</StatusBadge>
            <StatusBadge tone="cancelled">Cancelled</StatusBadge>
            <StatusBadge tone="failed">Failed</StatusBadge>
            <StatusBadge tone="info">Appointment</StatusBadge>
            <StatusBadge tone="neutral">Idle</StatusBadge>
          </div>
        </div>
        <div>
          <p className="eyebrow">LiveDot</p>
          <div className="row">
            <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}><LiveDot live /> Live</span>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}><LiveDot /> Idle</span>
          </div>
        </div>
        <div>
          <p className="eyebrow">Stat — KPI tiles</p>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 16 }}>
            <Stat value="128" label="Calls this week" />
            <Stat value="3" label="Active now" />
            <Stat value="12" label="Action items" />
            <Stat value="5" label="Appointments" />
          </div>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
