<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, ghost, disabled & pill CTA" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Buttons — Hermes Design System</title>
<link rel="stylesheet" href="../_shared/tokens.css" />
<link rel="stylesheet" href="../_shared/preview.css" />
</head>
<body class="ds">
<div class="ds-frame ds-frame--narrow">
  <header>
    <p class="ds-eyebrow">Components</p>
    <h1 class="ds-title">Buttons</h1>
  </header>

  <section>
    <p class="ds-eyebrow">App buttons (.btn)</p>
    <div class="ds-row">
      <button class="btn">Primary action</button>
      <button class="btn btn--ghost">Ghost</button>
      <button class="btn btn--disabled" disabled>Disabled</button>
    </div>
  </section>

  <section>
    <p class="ds-eyebrow">Nav pills (.dash-nav)</p>
    <nav class="dash-nav">
      <a class="dash-nav__link" href="#">Stats</a>
      <a class="dash-nav__link" href="#">Calls</a>
      <a class="dash-nav__link" href="#">Settings</a>
      <a class="dash-nav__link" href="#">Billing</a>
    </nav>
  </section>

  <section class="on-dark" style="border-radius: var(--radius-card); padding: var(--space-card)">
    <p class="ds-eyebrow" style="color: var(--text-on-dark-faint)">Site CTA (pill, on dark)</p>
    <a class="pill-cta" href="#">Get started</a>
  </section>
</div>
</body>
</html>
