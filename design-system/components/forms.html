<!-- @dsCard group="Components" name="Forms" subtitle="Inputs, labels, select & toggle switch" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Forms — Hermes Design System</title>
<link rel="stylesheet" href="../_shared/tokens.css" />
<link rel="stylesheet" href="../_shared/preview.css" />
</head>
<body class="ds">
<div class="ds-frame ds-frame--narrow">
  <header>
    <p class="ds-eyebrow">Components</p>
    <h1 class="ds-title">Forms</h1>
  </header>

  <div class="card ds-stack">
    <div>
      <div class="field-label">Agent name</div>
      <input class="field-input" value="Hermes" />
    </div>
    <div>
      <div class="field-label">Greeting</div>
      <input class="field-input" value="Hi, you've reached Antonio's assistant." />
    </div>
    <div>
      <div class="field-label">Language</div>
      <select class="field-input">
        <option>Deutsch (de-DE)</option>
        <option>English (en-US)</option>
        <option>Francais (fr-FR)</option>
      </select>
    </div>

    <div class="perm-row">
      <div class="perm-text">
        <span class="perm-title">Allow outbound calls</span>
        <span class="perm-hint">Agent may place calls on your behalf</span>
      </div>
      <label class="switch"><input type="checkbox" checked /><span class="switch-slider"></span></label>
    </div>
    <div class="perm-row">
      <div class="perm-text">
        <span class="perm-title">Send SMS</span>
        <span class="perm-hint">Confirmations after a call</span>
      </div>
      <label class="switch"><input type="checkbox" /><span class="switch-slider"></span></label>
    </div>

    <div class="ds-row">
      <button class="btn">Save</button>
      <span class="muted" style="font-size: var(--text-eyebrow)">Saved.</span>
    </div>
  </div>
</div>
</body>
</html>
