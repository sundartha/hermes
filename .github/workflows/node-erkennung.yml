name: node-erkennung

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows: [paket-gemeldet]
    types: [completed]
    branches: ["paket/**"]

permissions: {}

jobs:
  erkennen:
    name: Neue Node-Hauptversion erkennen
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: node-erkennung
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Geheimnis vorhanden
        env:
          HAT_TOKEN: ${{ secrets.UPDATE_WORKFLOW_TOKEN }}
        run: test -n "$HAT_TOKEN" || { echo "::error::UPDATE_WORKFLOW_TOKEN fehlt, kein PR möglich"; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.UPDATE_WORKFLOW_TOKEN }}
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Node-Erkennung
        env:
          GH_TOKEN: ${{ secrets.UPDATE_WORKFLOW_TOKEN }}
        run: node tools/mutation-laeufe.mjs node-erkennung

  paket-pr:
    name: Paket-PR
    if: >-
      github.event_name == 'workflow_run' &&
      github.ref == 'refs/heads/master' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'paket/') &&
      github.event.workflow_run.actor.login != 'sundartha-agent[bot]'
    runs-on: ubuntu-latest
    environment: paket-pr
    concurrency:
      group: paket-pr-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: PR für den Branch öffnen, wenn keiner offen ist
        env:
          APP_ID: ${{ secrets.SUNDARTHA_AGENT_APP_ID }}
          APP_SCHLUESSEL: ${{ secrets.SUNDARTHA_AGENT_PRIVATE_KEY }}
          ZWEIG: ${{ github.event.workflow_run.head_branch }}
        run: printf '%s' "$APP_SCHLUESSEL" | node tools/mutation-laeufe.mjs paket-pr --app-id "$APP_ID" --repo "$GITHUB_REPOSITORY" --zweig "$ZWEIG"
