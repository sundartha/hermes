name: Beleg 06b

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ungeteilt:
    name: Ungeteilt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm test -- -- --test-concurrency=4

  drei-teile:
    name: Drei Teile ${{ matrix.teil }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Tests
        env:
          TEIL: ${{ matrix.teil }}
          TEILE: ${{ strategy.job-total }}
        run: npm test -- -- --test-concurrency=4 --test-shard="$TEIL/$TEILE"
