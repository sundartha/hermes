name: Statische Prüfung

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: statische-pruefung-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  statische-pruefung:
    name: Statische Prüfung
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Semgrep bereitstellen
        uses: ./.github/actions/semgrep-bereitstellen

      - name: Kopien (jscpd)
        env:
          BASIS: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node tools/basis-vergleich.mjs jscpd --basis "$BASIS"

      - name: Toter Code (knip)
        if: ${{ !cancelled() }}
        env:
          BASIS: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node tools/basis-vergleich.mjs knip --basis "$BASIS"

      - name: Injection-Muster (Semgrep)
        if: ${{ !cancelled() }}
        env:
          BASIS: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node tools/basis-vergleich.mjs semgrep --basis "$BASIS"

      - name: Kommentare in YAML und Shell
        if: ${{ !cancelled() }}
        run: node tools/kommentare-yaml-shell.mjs

      - name: Lehren nur streichen
        if: ${{ !cancelled() }}
        run: node tools/basis-vergleich.mjs lessons

      - name: Anweisungen nur streichen
        if: ${{ !cancelled() }}
        run: node tools/basis-vergleich.mjs anweisungen

      - name: Wurzelordner
        if: ${{ !cancelled() }}
        run: node tools/basis-vergleich.mjs wurzel

      - name: Bedrohungskatalog
        if: ${{ !cancelled() }}
        env:
          BASIS: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node tools/katalog-pruefen.mjs --basis "$BASIS"

      - name: Funktionskarte
        if: ${{ !cancelled() }}
        env:
          BASIS: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node tools/funktionskarte.mjs pruefen --basis "$BASIS"

      - name: Antwortzeiten messen
        if: ${{ !cancelled() }}
        env:
          BASIS: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: git diff --quiet "$BASIS" -- .github/antwortzeiten.json || node tools/funktionskarte.mjs messen
