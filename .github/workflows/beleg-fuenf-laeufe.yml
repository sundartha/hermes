name: Beleg fünf Läufe

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  suite:
    name: Suite ${{ matrix.lauf }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lauf: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Tests
        env:
          NODE_ENV: test
        run: node test/testbaenke-run.mjs regression -- --test-concurrency=4
