name: Prüfleiter

on:
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pruefleiter-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vorpruefung:
    name: Prüfleiter Lint und betroffene Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Node 22, npm ci und Install-Skripte
        uses: ./.github/actions/node-npm-ci

      - name: Lint und betroffene Tests
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: npm run --silent pruefleiter -- --basis "$PR_BASE_SHA" --ohne-werkzeugtests

  werkzeugtests:
    name: Prüfleiter Werkzeugtests ${{ matrix.teil }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Node 22, npm ci und Install-Skripte
        uses: ./.github/actions/node-npm-ci

      - name: Werkzeugtests
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          TEIL: ${{ matrix.teil }}
          TEILE: ${{ strategy.job-total }}
          TESTKOSTEN_DATEI: ${{ github.workspace }}/.pruefung/testkosten-werkzeugteil-${{ matrix.teil }}.jsonl
        run: |
          auswahl=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            auswahl=(--alle-werkzeugtests)
          fi
          npm run --silent pruefleiter -- --basis "$PR_BASE_SHA" --werkzeugteil "$TEIL/$TEILE" "${auswahl[@]}"

      - name: Testlaufzeit
        if: always()
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          TEIL: ${{ matrix.teil }}
        run: |
          set -o pipefail
          node tools/testlaufzeit-pruefen.mjs --laufzeiten ".pruefung/werkzeugteil-$TEIL.jsonl" --kosten ".pruefung/testkosten-werkzeugteil-$TEIL.jsonl" --teil "werkzeuge-$TEIL" ${PR_BASE_SHA:+--basis "$PR_BASE_SHA"} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Bericht des Teils hochladen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: werkzeugteil-${{ matrix.teil }}
          path: |
            .pruefung/werkzeugteil-${{ matrix.teil }}.jsonl
            .pruefung/testkosten-werkzeugteil-${{ matrix.teil }}.jsonl
          if-no-files-found: ignore

  pruefleiter:
    name: Prüfleiter
    if: always()
    needs: [vorpruefung, werkzeugtests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Node 22 und npm ci
        uses: ./.github/actions/node-npm-ci
        with:
          web: "false"
          install-skripte: "false"

      - name: Berichte der Teile laden
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: werkzeugteil-*
          path: ${{ runner.temp }}/werkzeugteile
          merge-multiple: true

      - name: Alle Teile erfolgreich und vollständig
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          JOBS: ${{ toJSON(needs) }}
        run: |
          auswahl=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            auswahl=(--alle-werkzeugtests)
          fi
          npm run --silent pruefleiter -- --basis "$PR_BASE_SHA" --teile-pruefen "$RUNNER_TEMP/werkzeugteile" --jobs "$JOBS" "${auswahl[@]}"
