name: Prüfleiter

on:
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

env:
  UEBERNAHME: ${{ github.event_name == 'schedule' && 'aus' || (github.event_name == 'push' || github.event_name == 'merge_group') && 'an' || 'schatten' }}

concurrency:
  group: pruefleiter-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vorpruefung:
    name: Prüfleiter Lint und betroffene Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Node 22, npm ci und Install-Skripte
        uses: ./.github/actions/node-npm-ci

      - name: Lint und betroffene Tests
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
        run: npm run --silent pruefleiter -- --basis "$PR_BASE_SHA" --ohne-werkzeugtests

  teile:
    name: Prüfleiter Teile planen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      teile: ${{ steps.planen.outputs.teile }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Node 22 und npm ci
        uses: ./.github/actions/node-npm-ci-werkzeuge

      - name: Teile nach Laufzeit planen
        id: planen
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
        run: |
          teile=$(node tools/pruefleiter.mjs --basis "$PR_BASE_SHA" --fuer-ereignis "$EVENT_NAME" --teile-planen)
          echo "Prüfleiter-Teile: $teile" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "teile=$teile" >> "$GITHUB_OUTPUT"

  werkzeugtests:
    name: Prüfleiter Werkzeugtests ${{ matrix.teil }}/${{ strategy.job-total }}
    needs: teile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        teil: ${{ fromJSON(needs.teile.outputs.teile) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Node 22, npm ci und Install-Skripte
        uses: ./.github/actions/node-npm-ci

      - name: Werkzeugtests im Prüfleiter gewollt
        id: gewollt
        if: github.event_name == 'merge_group'
        env:
          PR_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: echo "gewollt=$(node tools/pruefleiter.mjs --basis "$PR_BASE_SHA" --werkzeugtests-gewollt)" >> "$GITHUB_OUTPUT"

      - name: Übernahme im Schatten
        id: uebernahme
        uses: ./.github/actions/uebernahme-im-schatten
        with:
          art: pruefleiter
          teil: ${{ matrix.teil }}
          teile: ${{ strategy.job-total }}
          rest: ${{ runner.temp }}/rest-werkzeugtests.txt
          gewollt: ${{ steps.gewollt.outputs.gewollt }}

      - name: Werkzeugtests
        if: steps.uebernahme.outputs.uebrig != '0'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          TEIL: ${{ matrix.teil }}
          TEILE: ${{ strategy.job-total }}
          TESTKOSTEN_DATEI: ${{ github.workspace }}/.pruefung/testkosten-werkzeugteil-${{ matrix.teil }}.jsonl
        run: |
          auswahl=()
          if [ -f "$RUNNER_TEMP/rest-werkzeugtests.txt" ]; then
            auswahl=(--werkzeugdateien "$RUNNER_TEMP/rest-werkzeugtests.txt")
          fi
          npm run --silent pruefleiter -- --basis "$PR_BASE_SHA" --werkzeugteil "$TEIL/$TEILE" --fuer-ereignis "$EVENT_NAME" "${auswahl[@]}"

      - name: Testlaufzeit
        if: always()
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          TEIL: ${{ matrix.teil }}
        run: |
          set -o pipefail
          node tools/testlaufzeit-pruefen.mjs --laufzeiten ".pruefung/werkzeugteil-$TEIL.jsonl" --kosten ".pruefung/testkosten-werkzeugteil-$TEIL.jsonl" --teil "werkzeuge-$TEIL" ${PR_BASE_SHA:+--basis "$PR_BASE_SHA"} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Ergebnis festhalten
        env:
          TEIL: ${{ matrix.teil }}
        run: node tools/uebernahme/baum.mjs festhalten --bericht ".pruefung/werkzeugteil-$TEIL.jsonl" --name "werkzeugteil-$TEIL" --mit-werkzeugbaum

      - name: Bericht des Teils hochladen
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: werkzeugteil-${{ matrix.teil }}
          path: |
            .pruefung/werkzeugteil-${{ matrix.teil }}.jsonl
            .pruefung/testkosten-werkzeugteil-${{ matrix.teil }}.jsonl
          if-no-files-found: ignore

  pruefleiter:
    name: Prüfleiter
    if: always()
    needs: [vorpruefung, teile, werkzeugtests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Node 22 und npm ci
        uses: ./.github/actions/node-npm-ci-werkzeuge

      - name: Berichte der Teile laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: werkzeugteil-*
          path: ${{ runner.temp }}/werkzeugteile
          merge-multiple: true

      - name: Alle Teile erfolgreich und vollständig
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          JOBS: ${{ toJSON(needs) }}
        run: |
          npm run --silent pruefleiter -- --basis "$PR_BASE_SHA" --teile-pruefen "$RUNNER_TEMP/werkzeugteile" --jobs "$JOBS" --fuer-ereignis "$EVENT_NAME"
