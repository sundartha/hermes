name: Prüfleiter

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pruefleiter-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pruefleiter:
    name: Prüfleiter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: npm ci
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix apps/web

      - name: Install-Skripte
        run: |
          set -euo pipefail
          jq -r '.[]' tools/basis/install-skripte.json | xargs -r npm rebuild

      - name: Prüfleiter
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run --silent pruefleiter -- --basis "$PR_BASE_SHA"
