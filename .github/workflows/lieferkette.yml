name: Lieferkette

on:
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: lieferkette-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lieferkette:
    name: Lieferkette
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Mindestalter neuer Paketversionen prüfen
        env:
          PR_BASIS: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node tools/lockfile-alter.mjs --basis "$PR_BASIS"
