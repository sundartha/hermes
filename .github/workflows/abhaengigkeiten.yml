name: Abhängigkeiten

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: abhaengigkeiten-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  abhaengigkeiten:
    name: Abhängigkeiten
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Abhängigkeitsregeln
        env:
          BASIS: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node tools/abhaengigkeiten.mjs --basis "$BASIS"

      - name: Dateilänge (Bericht)
        if: ${{ !cancelled() }}
        env:
          BASIS: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -o pipefail
          node tools/dateilaenge.mjs --basis "$BASIS" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Testverhältnis (Anzeige)
        if: ${{ !cancelled() }}
        env:
          BASIS: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node tools/testverhaeltnis.mjs --basis "$BASIS"
