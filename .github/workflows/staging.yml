name: staging

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      lastlauf:
        description: Lastlauf gegen Staging statt der Prüfung (das Ziel ist fest, es gibt keine Adresse)
        type: boolean
        default: false
      art:
        description: Art des Lastlaufs, gilt nur mit Lastlauf (kurz, last 20 Anrufe 10 Minuten, spitze bis 40 Anrufe, dauer 20 Anrufe 60 Minuten, stress in Stufen ab 20 mit Kapazitätskurve)
        type: choice
        default: kurz
        options:
          - kurz
          - last
          - spitze
          - dauer
          - stress
      alarmprobe:
        description: Nur eine Probemeldung nach Slack senden, ohne Staging-Deploy, Probe und Lastlauf (kein echter Fehler)
        type: boolean
        default: false
      absichtlich_rot:
        description: Prüfschritt absichtlich scheitern lassen (Probe-Lauf)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  staging:
    name: Staging abwarten und prüfen
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (!inputs.lastlauf || inputs.alarmprobe))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Staging abwarten und prüfen (Proben in tools/deploy-weg/staging.mjs)
        if: github.event_name != 'workflow_dispatch' || !inputs.alarmprobe
        id: pruefung
        env:
          STAGING_URL: https://hermes-staging-erpv.onrender.com
          GITHUB_TOKEN: ${{ github.token }}
          ABSICHTLICH_ROT: ${{ inputs.absichtlich_rot }}
          STAGING_STATUS_TOKEN: ${{ secrets.STAGING_STATUS_TOKEN }}
          STAGING_TELNYX_PRIVATE_KEY: ${{ secrets.STAGING_TELNYX_PRIVATE_KEY }}
        run: node tools/deploy-weg.mjs staging --commit "$GITHUB_SHA"

      - name: Alarmweg-Probe nach Slack
        if: github.event_name == 'workflow_dispatch' && inputs.alarmprobe
        env:
          SLACK_ALERT_URL: ${{ secrets.SLACK_ALERT_URL }}
        run: node tools/deploy-weg.mjs alarmprobe

      - name: Roten Nachtlauf melden
        if: failure() && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BETTER_STACK_ALERT_URL: ${{ secrets.BETTER_STACK_ALERT_URL }}
          SLACK_ALERT_URL: ${{ secrets.SLACK_ALERT_URL }}
        run: node tools/deploy-weg.mjs hoertest --anlass nachtlauf --commit "$GITHUB_SHA" --teile ""

      - name: Roten Staging-Deploy melden
        if: failure() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BETTER_STACK_ALERT_URL: ${{ secrets.BETTER_STACK_ALERT_URL }}
          SLACK_ALERT_URL: ${{ secrets.SLACK_ALERT_URL }}
        run: node tools/deploy-weg.mjs hoertest --anlass staginglauf --commit "$GITHUB_SHA" --teile ""

      - name: Anrufprobe (Kern in scripts/anruf-probe)
        if: ${{ (success() || inputs.absichtlich_rot) && (github.event_name != 'workflow_dispatch' || !inputs.alarmprobe) }}
        id: probe
        env:
          STAGING_URL: https://hermes-staging-erpv.onrender.com
          PROBE_ANRUFER_MODUL: ${{ github.workspace }}/scripts/anruf-probe/anrufer.mjs
          ABSICHTLICH_ROT: ${{ inputs.absichtlich_rot }}
          STAGING_TEST_TOKEN: ${{ secrets.STAGING_TEST_TOKEN }}
          STAGING_PROBE_ZIEL: ${{ vars.STAGING_PROBE_ZIEL }}
          STAGING_PROBE_AUFTRAGGEBER: ${{ vars.STAGING_PROBE_AUFTRAGGEBER }}
          STAGING_PROBE_VORNAME: ${{ vars.STAGING_PROBE_VORNAME }}
          GITHUB_TOKEN: ${{ github.token }}
          BETTER_STACK_ALERT_URL: ${{ secrets.BETTER_STACK_ALERT_URL }}
          SLACK_ALERT_URL: ${{ secrets.SLACK_ALERT_URL }}
        run: node scripts/anruf-probe/probe.mjs

      - name: Lebenszeichen Anrufprobe
        if: success() && github.event_name == 'schedule' && steps.probe.outputs.gewaehlt == 'true'
        env:
          BETTER_STACK_HEARTBEAT_PROBE: ${{ secrets.BETTER_STACK_HEARTBEAT_PROBE }}
        run: node tools/deploy-weg.mjs heartbeat --name probe

      - name: Prüfung der Prüfung (monatlich)
        id: monatspruefung
        if: success() && github.event_name == 'schedule'
        env:
          SLACK_ALERT_URL: ${{ secrets.SLACK_ALERT_URL }}
        run: node tools/deploy-weg.mjs pruefung

      - name: Heartbeat Nachtlauf
        if: always() && github.event_name == 'schedule' && steps.pruefung.outcome == 'success' && steps.monatspruefung.outcome != 'failure'
        env:
          BETTER_STACK_HEARTBEAT_NACHTLAUF: ${{ secrets.BETTER_STACK_HEARTBEAT_NACHTLAUF }}
        run: node tools/deploy-weg.mjs heartbeat --name nachtlauf

      - name: Offene Probe-Anrufe beenden
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.alarmprobe)
        env:
          STAGING_URL: https://hermes-staging-erpv.onrender.com
          PROBE_ANRUFER_MODUL: ${{ github.workspace }}/scripts/anruf-probe/anrufer.mjs
          STAGING_TEST_TOKEN: ${{ secrets.STAGING_TEST_TOKEN }}
          STAGING_PROBE_ZIEL: ${{ vars.STAGING_PROBE_ZIEL }}
        run: node scripts/anruf-probe/probe.mjs auflegen

  lastlauf:
    name: Lastlauf gegen Staging
    if: github.event_name == 'workflow_dispatch' && inputs.lastlauf && !inputs.alarmprobe
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.art == 'dauer' && 80 || inputs.art == 'stress' && 60 || inputs.art == 'last' && 25 || 15 }}
    concurrency:
      group: staging-push
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Node 22 und npm ci
        uses: ./.github/actions/node-npm-ci
        with:
          web: "false"

      - name: k6 installieren
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece
        with:
          k6-version: "1.8.2"

      - name: Lastlauf gegen Staging, Abbruch ohne Last bei jedem Zweifel
        env:
          ART: ${{ inputs.art }}
          STAGING_STATUS_TOKEN: ${{ secrets.STAGING_STATUS_TOKEN }}
          STAGING_TEST_TOKEN: ${{ secrets.STAGING_TEST_TOKEN }}
          STAGING_TELNYX_PRIVATE_KEY: ${{ secrets.STAGING_TELNYX_PRIVATE_KEY }}
          STAGING_METRIK_URL: ${{ secrets.STAGING_METRIK_URL }}
          STAGING_METRIK_TOKEN: ${{ secrets.STAGING_METRIK_TOKEN }}
        run: node scripts/last/staging.mjs k6

      - name: Kapazitätskurve ablegen
        if: ${{ always() && inputs.art == 'stress' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kapazitaetskurve
          path: kapazitaetskurve.json
          if-no-files-found: ignore
