name: staging

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      absichtlich_rot:
        description: Prüfschritt absichtlich scheitern lassen (Probe-Lauf)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  staging:
    name: Staging abwarten und prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Staging abwarten, Negativproben und tools/list ohne Anmeldung
        env:
          STAGING_URL: https://hermes-staging-erpv.onrender.com
          GITHUB_TOKEN: ${{ github.token }}
          ABSICHTLICH_ROT: ${{ inputs.absichtlich_rot }}
        run: node tools/deploy-weg.mjs staging --commit "$GITHUB_SHA"
