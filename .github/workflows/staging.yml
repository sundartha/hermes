name: staging

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      lastlauf:
        description: Lastlauf gegen Staging statt der Deploy-Prüfung (das Ziel ist fest, es gibt keine Adresse)
        type: boolean
        default: false
      art:
        description: Art des Lastlaufs, gilt nur mit Lastlauf (kurz, last 20 Anrufe 10 Minuten, spitze bis 40 Anrufe, dauer 20 Anrufe 60 Minuten, stress in Stufen ab 20 mit Kapazitätskurve)
        type: choice
        default: kurz
        options:
          - kurz
          - last
          - spitze
          - dauer
          - stress
      absichtlich_rot:
        description: Prüfschritt absichtlich scheitern lassen (Probe-Lauf)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  staging:
    name: Staging abwarten und prüfen
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.lastlauf)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Staging abwarten, Negativproben und tools/list ohne Anmeldung
        env:
          STAGING_URL: https://hermes-staging-erpv.onrender.com
          GITHUB_TOKEN: ${{ github.token }}
          ABSICHTLICH_ROT: ${{ inputs.absichtlich_rot }}
        run: node tools/deploy-weg.mjs staging --commit "$GITHUB_SHA"

  lastlauf:
    name: Lastlauf gegen Staging
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lastlauf)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.art == 'dauer' && 80 || inputs.art == 'stress' && 60 || 15 }}
    concurrency:
      group: staging-push
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Node 22 und npm ci
        uses: ./.github/actions/node-npm-ci
        with:
          web: "false"

      - name: k6 installieren
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece
        with:
          k6-version: "1.8.2"

      - name: Lastlauf gegen Staging, Abbruch ohne Last bei jedem Zweifel
        env:
          ART: ${{ inputs.art }}
          STAGING_STATUS_TOKEN: ${{ secrets.STAGING_STATUS_TOKEN }}
          STAGING_TEST_TOKEN: ${{ secrets.STAGING_TEST_TOKEN }}
          STAGING_TELNYX_PRIVATE_KEY: ${{ secrets.STAGING_TELNYX_PRIVATE_KEY }}
          STAGING_METRIK_URL: ${{ secrets.STAGING_METRIK_URL }}
          STAGING_METRIK_TOKEN: ${{ secrets.STAGING_METRIK_TOKEN }}
        run: node scripts/last/staging.mjs k6

      - name: Kapazitätskurve ablegen
        if: ${{ always() && inputs.art == 'stress' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kapazitaetskurve
          path: kapazitaetskurve.json
          if-no-files-found: ignore
