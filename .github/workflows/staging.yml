name: staging

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      absichtlich_rot:
        description: Prüfschritt absichtlich scheitern lassen (Probe-Lauf)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  staging:
    name: Staging abwarten und prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Staging abwarten, Negativproben und tools/list ohne Anmeldung
        env:
          STAGING_URL: https://hermes-staging-erpv.onrender.com
          GITHUB_TOKEN: ${{ github.token }}
          ABSICHTLICH_ROT: ${{ inputs.absichtlich_rot }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node tools/deploy-weg.mjs staging --commit "$GITHUB_SHA"
