name: Systemstand

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: {}

env:
  STAGING_URL: https://hermes-staging-erpv.onrender.com

concurrency:
  group: systemstand-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  systemstand:
    name: Systemstand
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Systemstand im PR prüfen
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASIS: ${{ github.event.pull_request.base.sha }}
        run: node tools/systemstand.mjs --pruefen --pr-basis "$PR_BASIS"

      - name: Systemstand auf master prüfen
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/systemstand.mjs --pruefen

  schritt-issues:
    name: Schritt-Issues
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: systemstand-schritt-issues
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Schritt-Issues aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/systemstand.mjs --issues
