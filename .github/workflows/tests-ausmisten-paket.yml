name: Tests ausmisten Paket

on:
  workflow_call:
    inputs:
      paket:
        type: number
        required: true
      plan-pruefsumme:
        type: string
        required: true

permissions: {}

jobs:
  basis:
    name: Basis messen
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    outputs:
      pruefsumme: ${{ steps.basis.outputs.pruefsumme }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Branch als Daten holen
        env:
          KOPF: ${{ github.event.workflow_run.head_sha }}
        run: git fetch --no-tags origin "$KOPF"

      - name: Plan laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: plan
          path: /tmp/ausmisten/plan-daten/plan

      - name: Basis messen
        id: basis
        env:
          NODE_ENV: test
          PLAN_PRUEFSUMME: ${{ inputs.plan-pruefsumme }}
          PAKET: ${{ inputs.paket }}
        run: node tools/tests-ausmisten.mjs basis --plan-daten /tmp/ausmisten/plan-daten --paket "$PAKET" --aus /tmp/ausmisten/basis

      - name: Basis hochladen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: basis-${{ inputs.paket }}
          path: /tmp/ausmisten/basis
          retention-days: 30
          if-no-files-found: error

  branch:
    name: Branch messen
    needs: basis
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Branch als Daten holen
        env:
          KOPF: ${{ github.event.workflow_run.head_sha }}
        run: git fetch --no-tags origin "$KOPF"

      - name: Plan laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: plan
          path: /tmp/ausmisten/plan-daten/plan

      - name: Basis laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: basis-${{ inputs.paket }}
          path: /tmp/ausmisten/basis-daten/basis-${{ inputs.paket }}

      - name: Branch messen
        env:
          NODE_ENV: test
          PLAN_PRUEFSUMME: ${{ inputs.plan-pruefsumme }}
          BASIS_PRUEFSUMME: ${{ needs.basis.outputs.pruefsumme }}
          PAKET: ${{ inputs.paket }}
        run: node tools/tests-ausmisten.mjs branch --plan-daten /tmp/ausmisten/plan-daten --basis-daten /tmp/ausmisten/basis-daten --paket "$PAKET" --aus /tmp/ausmisten/branch

      - name: Branch hochladen
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: branch-${{ inputs.paket }}
          path: /tmp/ausmisten/branch
          retention-days: 30
          if-no-files-found: error
