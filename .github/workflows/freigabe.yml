name: Freigabe

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: freigabe-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  freigabe:
    name: Freigabe-Prüfung
    if: github.event_name == 'merge_group' || github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: KI-Urteil auf dem aktuellen Stand und src/ nur vom Bau-Agenten
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/freigabe.mjs
