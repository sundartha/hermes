name: Freigabe

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize]
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: freigabe-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  freigabe:
    name: Freigabe-Prüfung
    if: github.event_name == 'merge_group' || github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: gitleaks bereitstellen
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Semgrep bereitstellen
        env:
          SEMGREP_IMAGE: semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
        run: |
          set -euo pipefail
          docker pull --quiet "$SEMGREP_IMAGE"
          mkdir -p "$RUNNER_TEMP/semgrep-bin"
          cat > "$RUNNER_TEMP/semgrep-bin/semgrep" <<EOF
          #!/bin/sh
          exec docker run --rm --volume "\$PWD:\$PWD:ro" --workdir "\$PWD" --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0='*' "$SEMGREP_IMAGE" semgrep "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/semgrep-bin/semgrep"
          echo "$RUNNER_TEMP/semgrep-bin" >> "$GITHUB_PATH"

      - name: Freigabe-Prüfung
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASIS: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PR_NUMMER: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "merge_group" ]; then
            node tools/freigabe-pruefung.mjs --basis "$PR_BASIS" --warteschlange "$QUEUE_REF"
          else
            node tools/freigabe-pruefung.mjs --basis "$PR_BASIS" --pr "$PR_NUMMER"
          fi
