name: Freigabe

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, edited]
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: freigabe-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  freigabe:
    name: Freigabe-Prüfung
    if: github.event_name == 'merge_group' || github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: gitleaks bereitstellen
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Semgrep bereitstellen
        uses: ./.github/actions/semgrep-bereitstellen

      - name: Freigabe-Prüfung
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASIS: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PR_NUMMER: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "merge_group" ]; then
            node tools/freigabe-pruefung.mjs --basis "$PR_BASIS" --warteschlange "$QUEUE_REF"
          else
            node tools/freigabe-pruefung.mjs --basis "$PR_BASIS" --pr "$PR_NUMMER"
          fi

  approve-inhalt:
    name: Approve gleicher Inhalt
    if: github.event_name == 'merge_group' || github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22 und npm ci
        uses: ./.github/actions/node-npm-ci
        with:
          web: "false"
          install-skripte: "false"

      - name: Approve gleicher Inhalt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/approve-inhalt.mjs
