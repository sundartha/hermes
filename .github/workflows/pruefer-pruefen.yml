name: Prüfer prüfen

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

concurrency:
  group: pruefer-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  pruefen:
    name: Commits prüfen
    if: (github.event.workflow_run.path == '.github/workflows/ci.yml' || startsWith(github.event.workflow_run.path, '.github/workflows/ci.yml@')) && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: pruefer
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Artefakt-Namen bestimmen
        id: artefakt
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node tools/auftrag.mjs pruefer artefakt --head "$HEAD_SHA"

      - name: Prüfer-Programm installieren
        run: npm ci --ignore-scripts --prefix tools/pruefer

      - name: Commits des Pull Requests holen
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: git fetch --no-tags origin "$HEAD_SHA" master

      - name: Commits prüfen
        id: pruefen
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: node tools/auftrag.mjs pruefer pruefen --head "$HEAD_SHA" --pr-branch "$PR_BRANCH" --pr-repo "$PR_REPO" --aus /tmp/pruefer-ergebnis --ablage /tmp/pruefer-ablage

      - name: App-Token für die Ablage
        id: ablage-token
        if: vars.ABLAGE_APP_ID != '' && steps.pruefen.outputs.hinweise != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.ABLAGE_APP_ID }}
          private-key: ${{ secrets.ABLAGE_APP_PRIVATE_KEY }}
          repositories: hermes-sicherheit
          permission-issues: write

      - name: Sicherheitshinweise nicht öffentlich ablegen
        if: steps.ablage-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.ablage-token.outputs.token }}
        run: node tools/auftrag.mjs pruefer ablegen --ablage /tmp/pruefer-ablage --repo sundartha/hermes-sicherheit

      - name: Ergebnis hochladen
        if: always() && steps.artefakt.outputs.artefakt != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.artefakt.outputs.artefakt }}
          path: /tmp/pruefer-ergebnis
          retention-days: 90
          overwrite: true

  melden:
    name: Status melden
    needs: pruefen
    if: always() && (github.event.workflow_run.path == '.github/workflows/ci.yml' || startsWith(github.event.workflow_run.path, '.github/workflows/ci.yml@')) && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      statuses: write
      issues: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Ergebnis laden
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: pruefer-ergebnis-pr*
          merge-multiple: true
          path: /tmp/pruefer-ergebnis

      - name: Status setzen
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node tools/auftrag.mjs pruefer entscheiden --ergebnis /tmp/pruefer-ergebnis --head "$HEAD_SHA"
