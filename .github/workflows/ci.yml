name: CI

on:
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BASIS: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  OBERGRENZE_BAUSYSTEM_DATEIEN: 63
  HERMES_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/postgres

jobs:
  pruefungen:
    name: Prüfungen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22 und npm ci
        uses: ./.github/actions/node-npm-ci
        with:
          web: "false"

      - name: Wachstumsbremse
        run: |
          set -euo pipefail
          anzahl=$(git ls-files tools .github/workflows .claude/hooks | wc -l)
          vorher=$(git show "$BASIS:.github/workflows/ci.yml" | sed -nE 's/^  OBERGRENZE_BAUSYSTEM_DATEIEN: ([0-9]+)$/\1/p')
          echo "Dateien unter tools/, .github/workflows/ und .claude/hooks/: $anzahl, Obergrenze $OBERGRENZE_BAUSYSTEM_DATEIEN, auf der Basis ${vorher:-keine}"
          if [ -n "$vorher" ] && [ "$OBERGRENZE_BAUSYSTEM_DATEIEN" -gt "$vorher" ]; then
            echo "Die Obergrenze darf nur sinken."
            exit 1
          fi
          if [ "$anzahl" -gt "$OBERGRENZE_BAUSYSTEM_DATEIEN" ]; then
            echo "Das Bausystem hat mehr Dateien als erlaubt. Für jede neue Datei muss eine alte weg."
            exit 1
          fi

      - name: Secret-Scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archiv="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archiv" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archiv"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archiv" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archiv" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="$BASIS..HEAD" .

      - name: Lint (ESLint mit den Hermes-Regeln)
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Eingefrorene Bestände wachsen nicht
        if: ${{ !cancelled() }}
        run: node tools/pruefen.mjs bestaende --basis "$BASIS"

      - name: Typprüfung
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Syntax
        if: ${{ !cancelled() }}
        run: find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Architektur (dependency-cruiser)
        if: ${{ !cancelled() }}
        run: node tools/pruefen.mjs architektur --basis "$BASIS"

      - name: npm audit
        if: ${{ !cancelled() }}
        run: node tools/audit-vergleich.mjs --basis "$BASIS"

      - name: Lieferkette (Mindestalter neuer Paketversionen)
        if: ${{ !cancelled() }}
        run: node tools/lockfile-alter.mjs --basis "$BASIS"

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Semgrep installieren
        run: python3 -m pip install --quiet semgrep==1.177.0

      - name: Semgrep auf den geänderten Dateien
        run: node tools/pruefen.mjs semgrep --basis "$BASIS"

  tests:
    name: Tests ${{ matrix.teil }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Postgres starten
        uses: ./.github/actions/postgres

      - name: Node 22 und npm ci
        uses: ./.github/actions/node-npm-ci
        with:
          web: "false"

      - name: Tests
        env:
          TEIL: ${{ matrix.teil }}
        run: |
          set -euo pipefail
          mapfile -t dateien < <(git ls-files test | grep -E '\.test\.[jt]s$' | sort | awk -v teil="$TEIL" 'NR % 6 == teil % 6')
          npm test -- "${dateien[@]}" -- --test-concurrency=4

  rotprobe:
    name: Rotprobe
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Postgres starten
        uses: ./.github/actions/postgres

      - name: Node 22 und npm ci
        uses: ./.github/actions/node-npm-ci
        with:
          web: "false"

      - name: Neue Tests scheitern ohne die Änderung unter src/
        run: |
          set -euo pipefail
          mapfile -t neu < <(git diff --name-only --diff-filter=A "$BASIS" -- test | grep -E '\.test\.[cm]?[jt]s$' || true)
          if [ "${#neu[@]}" -eq 0 ] || git diff --quiet "$BASIS" -- src; then
            echo "Keine neue Testdatei zusammen mit einer Änderung unter src/: nichts zu prüfen."
            exit 0
          fi
          basis="$RUNNER_TEMP/basis"
          git worktree add --detach "$basis" "$BASIS"
          git diff --name-only --diff-filter=A "$BASIS" -- test | while read -r datei; do
            mkdir -p "$basis/$(dirname "$datei")"
            cp "$datei" "$basis/$datei"
          done
          ln -s "$PWD/node_modules" "$basis/node_modules"
          cd "$basis"
          if npm test -- "${neu[@]}"; then
            echo "Rotprobe: Die neuen Tests sind schon ohne die Änderung unter src/ grün. Test zuerst heißt: Der Abnahmetest scheitert vor dem Bau."
            exit 1
          fi
          echo "Rotprobe: Die neuen Tests scheitern ohne die Änderung unter src/, wie erwartet."

  mutation:
    name: Mutation (Hinweis)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Postgres starten
        uses: ./.github/actions/postgres

      - name: Node 22 und npm ci
        uses: ./.github/actions/node-npm-ci
        with:
          web: "false"

      - name: Stryker auf den geänderten Zeilen unter src/
        env:
          NODE_ENV: test
        run: |
          set -euo pipefail
          mapfile -t zeilen < <(git diff -U0 "$BASIS" -- src | awk '/^\+\+\+ b\//{f=substr($0,7)} /^@@/{split($3,a,","); s=substr(a[1],2); n=(a[2]==""?1:a[2]); if (n>0 && f ~ /\.(m?js|ts)$/) print f ":" s "-" (s+n-1)}')
          if [ "${#zeilen[@]}" -eq 0 ]; then
            echo "Keine geänderten Codezeilen unter src/." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mapfile -t dateien < <(printf '%s\n' "${zeilen[@]}" | cut -d: -f1 | sort -u)
          mapfile -t tests < <(node tools/pruefen.mjs betroffen "${dateien[@]}" | jq -r '.direkt[]' | head -20)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "Kein Test importiert die geänderten Dateien direkt; Mutation übersprungen." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq --argjson m "$(printf '%s\n' "${zeilen[@]}" | jq -R . | jq -s .)" --argjson t "$(printf '%s\n' "${tests[@]}" | jq -R . | jq -s .)" \
            '.mutate = $m | .tap.testFiles = $t | .reporters = ["json"] | .jsonReporter = {fileName: ".pruefung/mutation.json"}' \
            stryker.config.json > .stryker-pr.json
          if ! npx stryker run .stryker-pr.json; then
            echo "Stryker brach ab; Einzelheiten im Log dieses Jobs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Mutation auf den geänderten Zeilen (nicht blockierend)"
            jq -r '[.files[].mutants[]] | "\(map(select(.status == "Killed")) | length) von \(length) Mutanten getötet; Timeout zählt als überlebt."' .pruefung/mutation.json
            jq -r '.files | to_entries[] | .key as $datei | .value.mutants[] | select(.status == "Survived" or .status == "Timeout" or .status == "NoCoverage") | "- `\($datei):\(.location.start.line)` \(.mutatorName): `\(.replacement // "")` (\(.status))"' .pruefung/mutation.json
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    if: always()
    needs: [pruefungen, semgrep, tests, rotprobe]
    runs-on: ubuntu-latest
    steps:
      - name: Alle Pflicht-Jobs erfolgreich
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          rot=$(jq -r 'to_entries[] | select(.value.result != "success" and (.key != "rotprobe" or .value.result != "skipped")) | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$rot" ]; then
            echo "Nicht erfolgreich: $rot"
            exit 1
          fi
