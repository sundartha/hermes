name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pruefungen:
    name: Prüfungen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Workflows prüfen
        run: node tools/workflows-pruefen.mjs

      - name: Abgleich CODEOWNERS
        run: node tools/codeowners-abgleich.mjs

      - name: Secret-Scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          else
            range="$PUSH_BEFORE_SHA..$PUSH_SHA"
          fi
          echo "gitleaks $GITLEAKS_VERSION scannt $range"
          "$RUNNER_TEMP/gitleaks" git --config gitleaks.toml --redact --verbose --no-banner \
            --exit-code 1 --log-opts="$range" .

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Install-Skripte
        run: |
          set -euo pipefail
          jq -r '.[]' tools/basis/install-skripte.json | xargs -r npm rebuild

      - name: Commit-Prüfung
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$PR_BASE_SHA" --to "$PR_HEAD_SHA" --verbose

      - name: Lint
        run: npm run lint

      - name: Syntax
        run: |
          find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check

      - name: Audit
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            basis="$PR_BASE_SHA"
          else
            basis="$PUSH_BEFORE_SHA"
          fi
          node tools/audit-vergleich.mjs --basis "$basis"

      - name: Mutationsprüfung
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run test:mutation -- --basis "$PR_BASE_SHA"

      - name: Testwirkung
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run test:wirkung -- --basis "$PR_BASE_SHA"

  tests:
    name: Tests ${{ matrix.teil }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3, 4]
    outputs:
      teil-1: ${{ steps.bestanden.outputs.teil-1 }}
      teil-2: ${{ steps.bestanden.outputs.teil-2 }}
      teil-3: ${{ steps.bestanden.outputs.teil-3 }}
      teil-4: ${{ steps.bestanden.outputs.teil-4 }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Install-Skripte
        run: |
          set -euo pipefail
          jq -r '.[]' tools/basis/install-skripte.json | xargs -r npm rebuild

      - name: Tests
        env:
          TEIL: ${{ matrix.teil }}
          TEILE: ${{ strategy.job-total }}
        run: npm test -- -- --test-concurrency=4 --test-shard="$TEIL/$TEILE"

      - name: Bestandene Tests melden
        id: bestanden
        if: always()
        env:
          TEIL: ${{ matrix.teil }}
        run: echo "teil-$TEIL=$(jq .bestanden .pruefung/regression.json)" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    if: always()
    needs: [pruefungen, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Bestandene Tests aller Teile
        env:
          BESTANDEN: ${{ toJSON(needs.tests.outputs) }}
        run: jq -r '[.[] | select(. != "") | tonumber] | "\(add // 0) Tests bestanden über alle Teile"' <<< "$BESTANDEN"

      - name: Alle Jobs erfolgreich
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          nicht_erfolgreich=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$nicht_erfolgreich" ]; then
            echo "Nicht erfolgreich: $nicht_erfolgreich"
            exit 1
          fi
