name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BASIS: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  OBERGRENZE_BAUSYSTEM_DATEIEN: 65
  HERMES_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/postgres

jobs:
  pruefungen:
    name: Prüfungen
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22 und npm ci
        uses: ./.github/actions/node-npm-ci
        with:
          web: "false"

      - name: Wachstumsbremse
        run: |
          set -euo pipefail
          anzahl=$(git ls-files tools .github/workflows .claude/hooks | wc -l)
          vorher=$(git show "$BASIS:.github/workflows/ci.yml" | sed -nE 's/^  OBERGRENZE_BAUSYSTEM_DATEIEN: ([0-9]+)$/\1/p')
          echo "Dateien unter tools/, .github/workflows/ und .claude/hooks/: $anzahl, Obergrenze $OBERGRENZE_BAUSYSTEM_DATEIEN, auf der Basis ${vorher:-keine}"
          if [ -z "$vorher" ] && git show "$BASIS:.github/workflows/ci.yml" | grep -q OBERGRENZE_BAUSYSTEM_DATEIEN; then
            echo "Die Obergrenze auf der Basis ist nicht lesbar; sie steht als Zahl in der Zeile OBERGRENZE_BAUSYSTEM_DATEIEN."
            exit 1
          fi
          if [ -n "$vorher" ] && [ "$OBERGRENZE_BAUSYSTEM_DATEIEN" -gt "$vorher" ]; then
            echo "Die Obergrenze darf nur sinken."
            exit 1
          fi
          if [ "$anzahl" -gt "$OBERGRENZE_BAUSYSTEM_DATEIEN" ]; then
            echo "Das Bausystem hat mehr Dateien als erlaubt. Für jede neue Datei muss eine alte weg."
            exit 1
          fi

      - name: Secret-Scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archiv="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/$archiv" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archiv"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archiv" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archiv" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="$BASIS..HEAD" .

      - name: Lint (ESLint mit den Hermes-Regeln)
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Eingefrorene Bestände wachsen nicht
        if: ${{ !cancelled() }}
        run: node tools/pruefen.mjs bestaende --basis "$BASIS"

      - name: Typprüfung
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Syntax
        if: ${{ !cancelled() }}
        run: find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Architektur (dependency-cruiser)
        if: ${{ !cancelled() }}
        run: node tools/pruefen.mjs architektur --basis "$BASIS"

      - name: Bedrohungskatalog (docs/sicherheitsgrenzen.md)
        if: ${{ !cancelled() }}
        run: node tools/katalog-pruefen.mjs --basis "$BASIS"

      - name: Alarmregeln und Anleitungen
        if: ${{ !cancelled() }}
        run: npm run betrieb-pruefen

      - name: npm audit
        if: ${{ !cancelled() }}
        run: node tools/audit-vergleich.mjs --basis "$BASIS"

      - name: Lieferkette (Mindestalter neuer Paketversionen)
        if: ${{ !cancelled() }}
        run: node tools/lockfile-alter.mjs --basis "$BASIS"

      - name: Migrationen (Squawk)
        if: ${{ !cancelled() }}
        run: node tools/pruefen.mjs migrationen --basis "$BASIS"

  semgrep:
    name: Semgrep
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Semgrep installieren
        run: python3 -m pip install --quiet semgrep==1.177.0

      - name: Semgrep auf den geänderten Dateien
        run: node tools/pruefen.mjs semgrep --basis "$BASIS"

  tests:
    name: Tests ${{ matrix.teil }}/6
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Postgres starten
        uses: ./.github/actions/postgres

      - name: Node 22 und npm ci
        uses: ./.github/actions/node-npm-ci
        with:
          web: "false"

      - name: Tests
        env:
          TEIL: ${{ matrix.teil }}
        run: |
          set -euo pipefail
          mapfile -t dateien < <(git ls-files test | grep -E '\.test\.[cm]?[jt]s$' | sort | awk -v teil="$TEIL" 'NR % 6 == teil % 6')
          npm test -- "${dateien[@]}" -- --test-concurrency=4

  webtests:
    name: Web-Tests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Node 22 und npm ci (mit apps/web)
        uses: ./.github/actions/node-npm-ci

      - name: Web-Tests
        env:
          NODE_ENV: test
          PUBLIC_GATEWAY_URL: https://gateway.example
        run: npm test -- "apps/web/test/**/*.test.js" -- --test-concurrency=4

  rotprobe:
    name: Rotprobe
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      gruen: ${{ steps.probe.outputs.gruen }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Postgres starten
        uses: ./.github/actions/postgres

      - name: Node 22 und npm ci
        uses: ./.github/actions/node-npm-ci
        with:
          web: "false"

      - name: Neue Tests scheitern ohne die Änderung unter src/
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PR_TEXT=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json body -q .body)
          export PR_TEXT
          mapfile -t ausnahmen < <(node tools/pruefen.mjs rotprobe-ausnahmen)
          mapfile -t neu < <(git diff --name-only --diff-filter=A "$BASIS" -- test | grep -E '\.test\.[cm]?[jt]s$' || true)
          if [ "${#neu[@]}" -eq 0 ] || git diff --quiet "$BASIS" -- src; then
            echo "Keine neue Testdatei zusammen mit einer Änderung unter src/: nichts zu prüfen."
            exit 0
          fi
          basis="$RUNNER_TEMP/basis"
          git worktree add --detach "$basis" "$BASIS"
          git diff --name-only --diff-filter=A "$BASIS" -- test | while read -r datei; do
            mkdir -p "$basis/$(dirname "$datei")"
            cp "$datei" "$basis/$datei"
          done
          ln -s "$PWD/node_modules" "$basis/node_modules"
          cd "$basis"
          gruen=()
          for datei in "${neu[@]}"; do
            if npm test -- "$datei"; then gruen+=("$datei"); fi
          done
          echo "gruen=${gruen[*]}" >> "$GITHUB_OUTPUT"
          unerlaubt=()
          for datei in "${gruen[@]}"; do
            if ! printf '%s\n' "${ausnahmen[@]}" | grep -qxF "$datei"; then unerlaubt+=("$datei"); fi
          done
          if [ "${#unerlaubt[@]}" -gt 0 ]; then
            echo "Rotprobe: Schon ohne die Änderung unter src/ grün: ${unerlaubt[*]}. Test zuerst heißt: Jeder neue Abnahmetest scheitert vor dem Bau."
            exit 1
          fi
          echo "Rotprobe: Alle ${#neu[@]} neuen Testdateien scheitern ohne die Änderung unter src/, wie erwartet."

  abdeckung:
    name: Abdeckung ${{ matrix.teil }}/${{ strategy.job-total }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      teile: ${{ steps.zaehlen.outputs.teile }}
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Postgres starten
        uses: ./.github/actions/postgres

      - name: Node 22 und npm ci
        uses: ./.github/actions/node-npm-ci
        with:
          web: "false"

      - name: Mutanten zählen, höchstens 4 je Teil, und messen, welche Mutanten ein Sechstel aller Testdateien ausführt
        id: zaehlen
        env:
          TEIL: ${{ strategy.job-index }}
          TEILE: ${{ strategy.job-total }}
          MUTATION_ABDECKUNG: abdeckung
        run: node tools/pruefen.mjs mutation --zaehlen --basis HEAD^1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: abdeckung-${{ matrix.teil }}
          path: abdeckung

  mutation:
    name: Mutation ${{ matrix.teil }}/${{ strategy.job-total }}
    needs: [abdeckung, rotprobe]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        teil: ${{ fromJSON(needs.abdeckung.outputs.teile) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Code unter src/ geändert?
        id: src
        run: git diff --quiet HEAD^1 -- src || echo "geaendert=ja" >> "$GITHUB_OUTPUT"

      - name: Postgres starten
        if: steps.src.outputs.geaendert
        uses: ./.github/actions/postgres

      - name: Node 22 und npm ci
        if: steps.src.outputs.geaendert
        uses: ./.github/actions/node-npm-ci
        with:
          web: "false"

      - name: Abdeckung laden
        if: steps.src.outputs.geaendert
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: abdeckung-*
          merge-multiple: true
          path: abdeckung

      - name: Jeder Mutant dieses Teils gegen alle Tests, die seine Datei erreichen; nicht getötete brauchen eine Begründung im PR-Text
        if: steps.src.outputs.geaendert
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TEIL: ${{ strategy.job-index }}
          TEILE: ${{ strategy.job-total }}
          MUTATION_ABDECKUNG: abdeckung
          ROTPROBE_GRUEN: ${{ needs.rotprobe.outputs.gruen }}
        run: |
          set -euo pipefail
          PR_TEXT=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json body -q .body)
          export PR_TEXT
          node tools/pruefen.mjs mutation --basis HEAD^1

  lastlauf:
    name: Lastlauf
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Postgres starten
        uses: ./.github/actions/postgres

      - name: Node 22 und npm ci
        uses: ./.github/actions/node-npm-ci
        with:
          web: "false"

      - name: k6 installieren
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece
        with:
          k6-version: "1.8.2"

      - name: Lastlauf gegen zwei lokale Prozesse mit Postgres und Attrappen
        run: node scripts/last/lauf.mjs k6

      - name: Rotprobe, erzwungene Fehlerquote und verworfener Anruf machen den Lauf rot
        run: |
          set -euo pipefail
          for probe in fehler:fehlerquote verwerfen:verlorene_anrufe; do
            art="${probe%%:*}"
            grund="${probe##*:}"
            ausgabe=$(node scripts/last/lauf.mjs "--rotprobe=$art" k6 || true)
            if ! tail -n 1 <<< "$ausgabe" | jq -e --arg grund "$grund" '.urteil.gruen == false and (.urteil.gruende | index($grund) != null)' > /dev/null; then
              echo "Rotprobe $art: der Lauf wurde nicht aus dem Grund $grund rot"
              exit 1
            fi
            echo "Rotprobe $art: rot aus dem Grund $grund, wie erwartet."
          done

  ci:
    name: CI
    if: always() && github.event_name != 'push'
    needs: [pruefungen, semgrep, tests, webtests, rotprobe, abdeckung, mutation, lastlauf]
    runs-on: ubuntu-latest
    steps:
      - name: Alle Pflicht-Jobs erfolgreich
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          rot=$(jq -r 'to_entries[] | select(.value.result != "success" and ((.key != "rotprobe" and .key != "mutation" and .key != "abdeckung" and .key != "lastlauf") or .value.result != "skipped")) | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$rot" ]; then
            echo "Nicht erfolgreich: $rot"
            exit 1
          fi
