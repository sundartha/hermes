name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      basis:
        description: Basis-Commit (40 Zeichen); nur die Mutationsjobs laufen, gemessen werden die Zeilen seit dieser Basis
        type: string
        required: true
      alter_stand:
        description: Statt der neuen Seite den alten Stand prüfen wie mit --alter-stand
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pruefungen:
    name: Prüfungen
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    services:
      postgres:
        image: postgres:16.15@sha256:a902560563d3a5661228585f53474c5065e7f273b21ffd77e555a8b5682c5690
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Workflows prüfen
        run: node tools/workflows-pruefen.mjs

      - name: Abgleich CODEOWNERS
        run: node tools/codeowners-abgleich.mjs

      - name: Secret-Scan
        id: secretscan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            range="$QUEUE_BASE_SHA..$QUEUE_HEAD_SHA"
          else
            range="$PUSH_BEFORE_SHA..$PUSH_SHA"
          fi
          if [ -z "${range%%..*}" ]; then
            echo "Secret-Scan: der Anfang des Bereichs fehlt ($range)"
            exit 1
          fi
          if ! anzahl="$(git rev-list --count "$range")"; then
            echo "Secret-Scan: git kann den Bereich $range nicht lesen"
            exit 1
          fi
          if [ "$anzahl" -eq 0 ]; then
            echo "Secret-Scan: der Bereich $range enthält keinen Commit"
            exit 1
          fi
          erwartet="$(git log --numstat --format=@%H "$range" \
            | awk '/^@/ { c = $0; next } $1 ~ /^[0-9]+$/ && $1 > 0 && !(c in g) { g[c]; n++ } END { print n + 0 }')"
          echo "gitleaks $GITLEAKS_VERSION scannt $range ($anzahl Commits, $erwartet mit neuen Zeilen)"
          ohne_ausnahmen="$(mktemp -d "$RUNNER_TEMP/gitleaks-ohne-ausnahmen.XXXXXX")"
          git_verzeichnis="$(git rev-parse --absolute-git-dir)"
          protokoll="$(mktemp "$RUNNER_TEMP/gitleaks-protokoll.XXXXXX")"
          {
            "$RUNNER_TEMP/gitleaks" git --config gitleaks.toml --redact --verbose --no-banner --no-color \
              --exit-code 1 --ignore-gitleaks-allow --gitleaks-ignore-path "$ohne_ausnahmen" \
              --log-opts="$range" "$git_verzeichnis"
          } 2>&1 | tee "$protokoll"
          if grep -q ' ERR ' "$protokoll"; then
            echo "Secret-Scan: gitleaks meldet einen Fehler, der Bereich $range gilt als nicht gelesen"
            exit 1
          fi
          gelesen="$(sed -nE 's/.* ([0-9]+) commits scanned\.$/\1/p' "$protokoll")"
          if ! [[ "$gelesen" =~ ^[0-9]+$ ]] || [ "$gelesen" -lt "$erwartet" ]; then
            echo "Secret-Scan: gitleaks hat ${gelesen:-keine} von $erwartet Commits mit neuen Zeilen gelesen"
            exit 1
          fi
          if [ "$erwartet" -eq 0 ]; then
            echo "Secret-Scan: nichts zu prüfen, kein Commit in $range fügt Zeilen hinzu"
          fi

      - name: Zweck des Secret-Scans
        if: failure() && steps.secretscan.outcome == 'failure'
        run: node tools/zweck-zeigen.mjs uebrige/secret-scan

      - name: npm ci
        id: installation
        run: npm ci --ignore-scripts

      - name: Install-Skripte
        id: installskripte
        run: |
          set -euo pipefail
          jq -r '.[]' tools/basis/install-skripte.json | xargs -r npm rebuild

      - name: Zweck der Install-Skripte
        if: failure() && steps.installskripte.outcome == 'failure'
        run: node tools/zweck-zeigen.mjs github/install-skripte

      - name: Commit-Prüfung
        id: commitpruefung
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: npx --no-install commitlint --from "$PR_BASE_SHA" --to "$PR_HEAD_SHA" --verbose

      - name: Zweck der Commit-Prüfung
        if: failure() && steps.commitpruefung.outcome == 'failure'
        run: node tools/zweck-zeigen.mjs uebrige/commit-pruefung

      - name: Lint
        run: npm run lint -- --format ./tools/lint-format.mjs

      - name: Typprüfung
        id: typpruefung
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        run: npx --no-install tsc --noEmit

      - name: Zweck der Typprüfung
        if: ${{ failure() && steps.typpruefung.outcome == 'failure' }}
        run: node tools/zweck-zeigen.mjs typprüfung

      - name: Typabdeckung
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        run: node tools/typabdeckung.mjs

      - name: Typabdeckung sinkt nicht
        if: ${{ !cancelled() && steps.installation.outcome == 'success' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node tools/typabdeckung.mjs --basis "$PR_BASE_SHA"

      - name: TypeScript nur, wo ESLint und tsc es sehen
        if: ${{ !cancelled() }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node tools/ts-sperre.mjs ${PR_BASE_SHA:+--basis "$PR_BASE_SHA"}

      - name: Migrationen prüfen
        if: ${{ !cancelled() }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node tools/migrationen-pruefen.mjs ${PR_BASE_SHA:+--basis "$PR_BASE_SHA"}

      - name: Unterdrückungen steigen nicht
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/check-staged-suppressions.js --basis "$PR_BASE_SHA"

      - name: Lint neuer Funktionen
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node tools/lint-neue-funktionen.mjs --basis "$PR_BASE_SHA"

      - name: Kommentar-Wanderung
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node tools/kommentar-wanderung.mjs --basis "$PR_BASE_SHA"

      - name: Keine neuen Kommentare
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node tools/neue-kommentare.mjs --basis "$PR_BASE_SHA"

      - name: Syntax (.js und .mjs; .ts prüft die Typprüfung)
        id: syntax
        run: |
          find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check

      - name: Zweck der Syntaxprüfung
        if: ${{ failure() && steps.syntax.outcome == 'failure' }}
        run: node tools/zweck-zeigen.mjs lint/syntax

      - name: OpenAI-Doku
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        run: node tools/openai-doku-pruefen.mjs

      - name: Anbieter im Datenschutz
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        run: node tools/anbieter-datenschutz-pruefen.mjs

      - name: Geheimnisse in Logs
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        run: node tools/log-geheimnisse-pruefen.mjs

      - name: Rückkehr-Parameter
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        run: node tools/rueckkehr-parameter-pruefen.mjs

      - name: Feste Pfade
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node tools/feste-pfade.mjs ${PR_BASE_SHA:+--basis "$PR_BASE_SHA"}

      - name: Audit
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            basis="$PUSH_BEFORE_SHA"
          else
            basis="$PR_BASE_SHA"
          fi
          node tools/audit-vergleich.mjs --basis "$basis"

      - name: Gleicher Stand
        id: gleich
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: node tools/warteschlange.mjs gleicher-stand --ref "$QUEUE_REF" --basis "$QUEUE_BASE_SHA"

      - name: Testwirkung
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || (github.event_name == 'merge_group' && steps.gleich.outputs.gleich == 'false')) }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HERMES_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/postgres
        run: npm run test:wirkung -- --basis "$PR_BASE_SHA"

  tests:
    name: Tests ${{ matrix.teil }}/${{ strategy.job-total }}
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15@sha256:a902560563d3a5661228585f53474c5065e7f273b21ffd77e555a8b5682c5690
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3, 4, 5, 6]
    outputs:
      teil-1: ${{ steps.bestanden.outputs.teil-1 }}
      teil-2: ${{ steps.bestanden.outputs.teil-2 }}
      teil-3: ${{ steps.bestanden.outputs.teil-3 }}
      teil-4: ${{ steps.bestanden.outputs.teil-4 }}
      teil-5: ${{ steps.bestanden.outputs.teil-5 }}
      teil-6: ${{ steps.bestanden.outputs.teil-6 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Node 22, npm ci und Install-Skripte
        uses: ./.github/actions/node-npm-ci
        with:
          web: "false"

      - name: Tests
        id: tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          TEIL: ${{ matrix.teil }}
          TEILE: ${{ strategy.job-total }}
          TESTKOSTEN_DATEI: ${{ github.workspace }}/.pruefung/testkosten.jsonl
          TESTS_ZWEITER_LAUF: ja
          HERMES_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/postgres
        run: |
          auswahl=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            auswahl=(--ohne-werkzeugtests)
          fi
          npm test -- "${auswahl[@]}" -- --test-concurrency=4 --test-shard="$TEIL/$TEILE" \
            --test-reporter-destination=stdout \
            --test-reporter=./tools/testlaufzeit-reporter.mjs \
            --test-reporter-destination=.pruefung/dateien.jsonl

      - name: Zweck der Tests
        if: failure() && steps.tests.outcome == 'failure'
        run: node tools/zweck-zeigen.mjs tests/regression

      - name: Wackelige Tests hochladen
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wackelig-teil-${{ matrix.teil }}
          path: .pruefung/wackelig.json
          if-no-files-found: ignore

      - name: Testlaufzeit
        if: always()
        env:
          TEIL: ${{ matrix.teil }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -o pipefail
          node tools/testlaufzeit-pruefen.mjs --teil "$TEIL" --kosten .pruefung/testkosten.jsonl ${PR_BASE_SHA:+--basis "$PR_BASE_SHA"} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Testlaufzeit hochladen
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: testlaufzeit-teil-${{ matrix.teil }}
          path: |
            .pruefung/dateien.jsonl
            .pruefung/testkosten.jsonl
          if-no-files-found: ignore

      - name: Bestandene Tests melden
        id: bestanden
        if: always()
        env:
          TEIL: ${{ matrix.teil }}
        run: echo "teil-$TEIL=$(jq .bestanden .pruefung/regression.json)" >> "$GITHUB_OUTPUT"

  mutationsplan:
    name: Mutationsplan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      messen: ${{ steps.plan.outputs.messen }}
      teile: ${{ steps.plan.outputs.teile }}
      anzahl: ${{ steps.plan.outputs.anzahl }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: Gleicher Stand
        id: gleich
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: node tools/warteschlange.mjs gleicher-stand --ref "$QUEUE_REF" --basis "$QUEUE_BASE_SHA"

      - name: Mutationsplan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          GLEICH: ${{ steps.gleich.outputs.gleich }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.basis }}
          ALTER_STAND: ${{ inputs.alter_stand }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && ! [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "basis muss eine Commit-SHA aus 40 Zeichen 0-9a-f sein"
            exit 1
          fi
          zusatz=""
          if [ "$ALTER_STAND" = "true" ]; then zusatz="--alter-stand"; fi
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "workflow_dispatch" ] || { [ "$EVENT_NAME" = "merge_group" ] && [ "$GLEICH" = "false" ]; }; then
            npm run test:mutation -- --basis "$PR_BASE_SHA" --plan "$RUNNER_TEMP/mutationsplan.json" ${zusatz:+"$zusatz"}
            teile=$(jq -c -e .teile "$RUNNER_TEMP/mutationsplan.json")
            anzahl=$(jq -e .anzahl "$RUNNER_TEMP/mutationsplan.json")
            printf 'messen=ja\nteile=%s\nanzahl=%s\n' "$teile" "$anzahl" >> "$GITHUB_OUTPUT"
          else
            echo "Mutationsprüfung nicht nötig: Ereignis $EVENT_NAME, gleicher Stand ${GLEICH:-ohne Angabe}"
            printf 'messen=nein\nteile=[0]\nanzahl=0\n' >> "$GITHUB_OUTPUT"
          fi

  mutationspruefung:
    name: Mutationsprüfung ${{ matrix.teil }}
    needs: mutationsplan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        teil: ${{ fromJSON(needs.mutationsplan.outputs.teile) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Node 22, npm ci und Install-Skripte
        if: needs.mutationsplan.outputs.messen == 'ja'
        uses: ./.github/actions/node-npm-ci
        with:
          web: "false"

      - name: Mutationsprüfung
        if: needs.mutationsplan.outputs.messen == 'ja'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.basis }}
          TEIL: ${{ matrix.teil }}
          TEILE: ${{ needs.mutationsplan.outputs.anzahl }}
          ALTER_STAND: ${{ inputs.alter_stand }}
        run: |
          set -euo pipefail
          zusatz=""
          if [ "$ALTER_STAND" = "true" ]; then zusatz="--alter-stand"; fi
          npm run test:mutation -- --basis "$PR_BASE_SHA" --teil "$TEIL" --teile "$TEILE" --ergebnis "$RUNNER_TEMP/mutation-teil-$TEIL.json" ${zusatz:+"$zusatz"}

      - name: Zeit-Log hochladen
        if: always() && needs.mutationsplan.outputs.messen == 'ja'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutation-zeitlog-${{ matrix.teil }}
          path: .mutationspruefung/log/*.jsonl
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Teilergebnis hochladen
        if: needs.mutationsplan.outputs.messen == 'ja'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutation-teil-${{ matrix.teil }}
          path: ${{ runner.temp }}/mutation-teil-${{ matrix.teil }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  mutationsurteil:
    name: Mutationsurteil
    needs: [mutationsplan, mutationspruefung]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Node 22, npm ci und Install-Skripte
        if: needs.mutationsplan.outputs.messen == 'ja'
        uses: ./.github/actions/node-npm-ci
        with:
          web: "false"

      - name: Teilergebnisse laden
        if: needs.mutationsplan.outputs.messen == 'ja'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: mutation-teil-*
          path: ${{ runner.temp }}/mutation
          merge-multiple: true

      - name: Mutationsurteil
        if: needs.mutationsplan.outputs.messen == 'ja'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.basis }}
          ALTER_STAND: ${{ inputs.alter_stand }}
        run: |
          set -uo pipefail
          set +e
          zusatz=""
          if [ "$ALTER_STAND" = "true" ]; then zusatz="--alter-stand"; fi
          mkdir -p "$RUNNER_TEMP/urteil"
          npm run test:mutation -- --basis "$PR_BASE_SHA" --urteil "$RUNNER_TEMP/mutation" ${zusatz:+"$zusatz"} 2>&1 | tee "$RUNNER_TEMP/urteil/ausgabe.txt"
          code=${PIPESTATUS[0]}
          echo "$code" > "$RUNNER_TEMP/urteil/exit-code"
          exit "$code"

      - name: Mutationsurteil hochladen
        if: always() && needs.mutationsplan.outputs.messen == 'ja'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutationsurteil
          path: ${{ runner.temp }}/urteil/
          if-no-files-found: ignore
          retention-days: 7

  ci:
    name: CI
    if: always()
    needs: [pruefungen, tests, mutationsplan, mutationspruefung, mutationsurteil]
    runs-on: ubuntu-latest
    steps:
      - name: Bestandene Tests aller Teile
        env:
          BESTANDEN: ${{ toJSON(needs.tests.outputs) }}
        run: jq -r '[.[] | select(. != "") | tonumber] | "\(add // 0) Tests bestanden über alle Teile"' <<< "$BESTANDEN"

      - name: Alle Jobs erfolgreich
        id: alle
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          nicht_erfolgreich=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$nicht_erfolgreich" ]; then
            echo "Nicht erfolgreich: $nicht_erfolgreich"
            exit 1
          fi

      - name: Checkout für Zweck und Ausweg
        if: failure() && steps.alle.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: tools

      - name: Node 22 für Zweck und Ausweg
        if: failure() && steps.alle.outcome == 'failure'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Zweck und Ausweg des Sammeljobs
        if: failure() && steps.alle.outcome == 'failure'
        run: node tools/zweck-zeigen.mjs github/ci-sammeljob
