# OUTBOUND-E4 (Owner-Entscheidung F-4): der EINZIGE Takt ausserhalb von Render und
# ausserhalb unserer Telefonie. Render schlaeft auf plan:free; ein Waechter, der nur
# im wachen Dienst laeuft, faellt mit dem Dienst zusammen aus (PM-5).
#
# BEWUSSTER UNTERSCHIED ZU ci.yml (ElevenLabs-Konfigurationsdrift-Schritt): dort wird ein
# fehlendes ELEVENLABS_API_KEY-Secret zu "::warning:: + exit 0" degradiert. HIER NICHT.
# Ein uebersprungener Waechter ist genau die stille Untaetigkeit, gegen die diese Etappe
# gebaut ist - er MUSS rot werden. Die Secrets sind eine OWNER-AKTION; bis sie hinterlegt
# sind, ist dieser Workflow rot, und das ist die richtige Farbe.
#
# Dieser Workflow gehoert AUCH ins Upstream-Repo (Lehre deploy-repo-split: Render deployt
# aus dem Upstream, nicht aus diesem Fork) - sonst laeuft er dort nicht, obwohl er hier
# gruen aussieht.
name: Outbound-Drift-Waechter
on:
  schedule:
    - cron: "17 * * * *" # stuendlich, versetzt (nicht auf :00, wo GitHub Last hat)
  workflow_dispatch: # manueller Beweislauf (Abnahmepunkt D7)
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secrets vorhanden (fail-closed, KEIN Ueberspringen)
        env:
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_AGENT_ID: ${{ secrets.ELEVENLABS_AGENT_ID }}
          PLATFORM_ANI_E164: ${{ secrets.PLATFORM_ANI_E164 }}
        run: |
          # Blocker 1 (Review Runde 2): ohne ELEVENLABS_AGENT_ID wertet Pruefung 1 die
          # Agent-Zuweisung NIE aus (unbekannt:pruefung1_agent) - der stuendliche externe
          # Waechter meldete das bisher als "9 von 9 gefahren", obwohl die Haelfte von
          # Pruefung 1 nie beurteilt wurde. Deshalb hier Pflicht-Secret, nicht optional.
          fehlend=""
          if [ -z "$TELNYX_API_KEY" ];     then fehlend="$fehlend TELNYX_API_KEY"; fi
          if [ -z "$ELEVENLABS_API_KEY" ]; then fehlend="$fehlend ELEVENLABS_API_KEY"; fi
          if [ -z "$ELEVENLABS_AGENT_ID" ]; then fehlend="$fehlend ELEVENLABS_AGENT_ID"; fi
          if [ -z "$PLATFORM_ANI_E164" ];  then fehlend="$fehlend PLATFORM_ANI_E164"; fi
          if [ -n "$fehlend" ]; then
            echo "::error::[outbound:drift] KEIN Lauf moeglich - diese Secrets fehlen im Repo:$fehlend. Dieser Schritt wird ABSICHTLICH rot (anders als der ElevenLabs-Konfigurationsdrift-Schritt in ci.yml): ein uebersprungener Waechter sieht im Log aus wie ein bestandener."
            exit 1
          fi
      - name: Drift-Pruefung gegen die Anbieter-Wirklichkeit (nur GET)
        env:
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
          TELNYX_FQDN_CONNECTION_ID: ${{ secrets.TELNYX_FQDN_CONNECTION_ID }}
          TELNYX_OUTBOUND_VOICE_PROFILE_ID: ${{ secrets.TELNYX_OUTBOUND_VOICE_PROFILE_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_AGENT_ID: ${{ secrets.ELEVENLABS_AGENT_ID }}
          ELEVENLABS_AGENT_PHONE_NUMBER_ID: ${{ secrets.ELEVENLABS_AGENT_PHONE_NUMBER_ID }}
          PLATFORM_ANI_E164: ${{ secrets.PLATFORM_ANI_E164 }}
          ALLOWED_COUNTRY_CODES: "+49,+33,+44"
        run: npm run outbound:drift
