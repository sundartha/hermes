name: Vorprüfung

run-name: Vorprüfung ${{ inputs.branch }} am Stand ${{ inputs.stand }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Paket-Branch (paket/<name>), dessen Stand vor dem PR-Update geprüft wird
        type: string
        required: true
      stand:
        description: Commit (40 Zeichen), der geprüft wird; der Ref des Laufs muss genau auf ihm stehen
        type: string
        required: true
      pr:
        description: Nummer des offenen PR, wenn es ihn schon gibt; dann fährt ci-lokal mit --pr auch den Testschutz-Abgleich am PR
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: vorpruefung-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  basis:
    name: Vorprüfung Stand und Basis
    runs-on: ubuntu-latest
    outputs:
      basis: ${{ steps.basis.outputs.basis }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Stand und Basis
        id: basis
        env:
          STAND: ${{ inputs.stand }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          kopf="$(git rev-parse HEAD)"
          if ! [[ "$STAND" =~ ^[0-9a-f]{40}$ ]] || [ "$kopf" != "$STAND" ]; then
            echo "Der Ref steht auf $kopf, geprüft werden soll aber ${STAND:-kein Stand}"
            exit 1
          fi
          if ! [[ "$PR" =~ ^([1-9][0-9]*)?$ ]]; then
            echo "pr muss leer oder eine PR-Nummer sein, nicht $PR"
            exit 1
          fi
          echo "basis=$(git rev-parse --verify refs/remotes/origin/master)" >> "$GITHUB_OUTPUT"

  ci-lokal:
    name: Vorprüfung ci-lokal mit teuren Schritten
    needs: basis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Postgres starten
        uses: ./.github/actions/postgres

      - name: Node 22, npm ci und Install-Skripte
        uses: ./.github/actions/node-npm-ci

      - name: Semgrep bereitstellen
        uses: ./.github/actions/semgrep-bereitstellen

      - name: ci-lokal mit teuren Schritten
        env:
          BASIS: ${{ needs.basis.outputs.basis }}
          PR: ${{ inputs.pr }}
          GITHUB_TOKEN: ${{ github.token }}
          HERMES_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/postgres
        run: node tools/ci-lokal.mjs --basis "$BASIS" --mit-teuren ${PR:+--pr "$PR"}

  pruefleiter:
    name: Vorprüfung Prüfleiter
    needs: basis
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/pruefleiter.yml
    with:
      basis: ${{ needs.basis.outputs.basis }}
      ereignis: pull_request

  mutation:
    name: Vorprüfung Mutation
    needs: basis
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: read
    uses: ./.github/workflows/ci.yml
    with:
      basis: ${{ needs.basis.outputs.basis }}
