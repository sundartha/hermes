name: wegwerf-haenger
on:
  push:
    branches: ['wegwerf/**']
permissions:
  contents: read
env:
  BASIS: a775666d7641622ccebae214d90f0a3ee3cf24a8
  OBERGRENZE_BAUSYSTEM_DATEIEN: 65
  HERMES_TEST_POSTGRES_URL: postgres://postgres@localhost:5432/postgres
jobs:
  verdacht:
    name: Verdacht ${{ matrix.stand }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stand: [pr, master]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Stand wählen
        run: |
          if [ "${{ matrix.stand }}" = pr ]; then git checkout -q --detach 029a67b2962013d789fb47dceab8a4a2d388c3d3; else git checkout -q --detach a775666d7641622ccebae214d90f0a3ee3cf24a8; fi
          git log -1 --format='STAND %h %s'
      - uses: ./.github/actions/postgres
      - uses: ./.github/actions/node-npm-ci
        with:
          web: "false"
      - name: Drei Verdächtige je sechsmal
        run: |
          for d in test/anrufe/webhook-zustellung-nachlauf-zweifach.test.js test/ausfallproben/ausfallprobe-deploy-bei-anruf-bewertung.test.js test/ausfallproben/speicher-bereiche-ausfall.test.js; do
            for i in 1 2 3 4 5 6; do
              s=$(date +%s)
              NODE_ENV=test timeout -k 5 150 node --test --test-concurrency=1 "$d" > /tmp/out.txt 2>&1 && rc=0 || rc=$?
              echo "VERDACHT stand=${{ matrix.stand }} lauf=$i rc=$rc sek=$(( $(date +%s) - s )) $d"
              if [ $rc -ne 0 ]; then echo "::group::ROT $d"; grep -nE "^\s*(not ok|# Subtest)|error:|expected|actual|Error" /tmp/out.txt | head -30 | cut -c1-240; tail -25 /tmp/out.txt | cut -c1-240; echo "::endgroup::"; fi
            done
          done
          exit 0
