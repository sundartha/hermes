name: Node und npm ci
description: Richtet die gewünschte Node-Version ein (Standard 22) und installiert die Pakete ohne Paket-Skripte, auf Wunsch zusätzlich unter apps/web.
inputs:
  node-version:
    description: Hauptversion von Node, die eingerichtet wird.
    required: false
    default: "22"
  web:
    description: Installiert zusätzlich die Pakete unter apps/web.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Node einrichten
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ inputs.node-version }}

    - name: npm ci
      shell: bash
      run: npm ci --ignore-scripts

    - name: npm ci für apps/web
      if: inputs.web == 'true'
      shell: bash
      run: npm ci --ignore-scripts --prefix apps/web
