<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes — Mein Bereich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Sundartha-Navy - 1:1 aus apps/web/src/styles/tokens/hero.css (kein Vodafone-Rot mehr) */
  --navy-900:#0a2245;   /* tiefster Gradient-Stop */
  --navy-800:#0f2d52;   /* Grundton */
  --navy-700:#1b4f86;   /* heller Akzent + Card-Border */
  --surface:#13335c;    /* Card-Flaeche */
  --ink-pill:#10305a;   /* Text auf weisser Pill */
  --text:#ffffff;
  --text-soft:rgba(255,255,255,.82);
  --text-muted:rgba(255,255,255,.7);
  --live:#1faa59;       /* Live-Dot aktiv */
  --live-off:rgba(255,255,255,.3);
  --ok:#5fd39a;         /* Erfolgs-Text auf Navy */
  --danger:#ff8a8a;     /* Fehler-Text auf Navy */
  --bg:radial-gradient(120% 90% at 50% 0%,#1b4f86 0%,#0f2d52 55%,#0a2245 100%);
  --ease:cubic-bezier(0.22,1,0.36,1);
  --font:'Space Grotesk','Helvetica Neue',Arial,sans-serif;
  --shadow:0 18px 40px -24px rgba(7,18,40,.7);
  --shadow-pill:0 10px 26px -12px rgba(7,18,40,.7);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--navy-900);background-image:var(--bg);background-attachment:fixed;color:var(--text);font-size:15px;line-height:1.5;min-height:100vh}
::selection{background:var(--navy-700);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:30px 28px 80px}

/* Header / Wortmarke */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:13px}
.logo-mark{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-text{display:flex;flex-direction:column;line-height:1.12}
.brand-name{font-weight:600;font-size:20px;letter-spacing:.04em}
.brand-by{font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--text-muted);font-weight:600}
.spacer{flex:1}

/* Grid + Cards */
.grid{display:grid;gap:20px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--surface);border:1px solid var(--navy-700);border-radius:18px;padding:24px;box-shadow:var(--shadow)}
.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:980px){.c4,.c6,.c8{grid-column:span 12}}
h3{font-size:16px;font-weight:600;margin-bottom:4px}
.hint{color:var(--text-muted);font-size:13px;margin-bottom:16px}

/* Agent-Rufnummer (prominente eigene Anzeige) */
.number-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.number-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--text-muted);font-weight:600}
.number-value{font-size:34px;font-weight:600;letter-spacing:.01em}
.dot{width:10px;height:10px;border-radius:50%;background:var(--live);flex-shrink:0}
.dot.off{background:var(--live-off)}

/* Buttons (weisse Pill / Ghost) */
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:99px;padding:12px 22px;font-family:var(--font);font-weight:600;font-size:14px;cursor:pointer;transition:all .22s var(--ease)}
.btn-primary{background:#fff;color:var(--ink-pill);box-shadow:var(--shadow-pill)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{background:transparent;color:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.82)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{font-size:13px;font-weight:600;margin-top:10px;display:none}
.msg.ok{display:block;color:var(--ok)}
.msg.err{display:block;color:var(--danger)}

/* Anrufe (read-only) */
.call{border:1px solid var(--navy-700);border-radius:15px;margin-bottom:12px;background:rgba(255,255,255,.03);overflow:hidden}
.call-h{display:flex;align-items:center;gap:14px;padding:15px 18px}
.dir{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.dir.in{background:rgba(79,140,255,.18);color:#a9c7ff}
.dir.out{background:rgba(255,255,255,.12);color:#fff}
.call-h .cw{flex:1;min-width:0}
.call-h .cn{font-weight:600;font-size:14.5px}
.call-h .cm{color:var(--text-muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;padding:3px 10px;border-radius:99px;white-space:nowrap;background:rgba(255,255,255,.1);color:var(--text-soft)}
.st.active{background:rgba(31,170,89,.22);color:#7fe3aa}
.st.completed{background:rgba(31,170,89,.16);color:#7fe3aa}
.st.failed{background:rgba(255,255,255,.1);color:var(--text-muted)}
.empty{color:var(--text-muted);font-size:13px;text-align:center;padding:22px 8px}
/* p6-funnel: Plan-Auswahl-Karten (Starter/Business, KEIN Free) */
.plans{display:flex;gap:14px;flex-wrap:wrap}
.plan{flex:1 1 200px;border:1px solid var(--navy-700);border-radius:15px;padding:18px;background:rgba(255,255,255,.03);display:flex;flex-direction:column;gap:10px}
.plan-name{font-weight:600;font-size:15px}
.plan-price{font-size:24px;font-weight:600}
.plan-per{font-size:12.5px;font-weight:500;color:var(--text-muted)}
.plan-cta{align-self:flex-start;margin-top:auto}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <span class="logo-mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm2.5 15.5c-2.6 0-5.3-2.3-5.4-5.6-.1-2.2 1.2-4.3 2.9-5.3 1.1-.7 2.4-1 3.4-.9-.7.3-1.5 1.2-1.5 2.4v.3c1.7.4 3.1 1.8 3.1 4 0 2.6-1.6 5.1-2.5 5.1Z" fill="#fff"/></svg></span>
      <span class="brand-text">
        <span class="brand-name">HERMES</span>
        <span class="brand-by">by Sundartha</span>
      </span>
    </div>
    <div class="spacer"></div>
  </div>

  <div class="grid">

    <!-- Agent-Rufnummer: prominente eigene Anzeige (P1), Live-Dot inline -->
    <div class="card c12">
      <div class="number-head">
        <span class="dot off" id="liveDot"></span>
        <span class="number-label">Deine Agent-Rufnummer</span>
      </div>
      <div class="number-value" id="agentNum">—</div>
    </div>

    <!-- Zugang: Browser-Login (OIDC, Feature B). Das Session-Cookie kommt same-origin
         automatisch mit jedem fetch -> kein manuelles Token mehr. -->
    <div class="card c12">
      <h3>Zugang</h3>
      <div class="hint" id="authHint">Anmeldestatus wird geprueft …</div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <a class="btn btn-primary" id="loginBtn" href="/auth/login" style="display:none">Anmelden</a>
        <button class="btn btn-ghost" id="logoutBtn" style="display:none">Abmelden</button>
      </div>
    </div>

    <!-- Zahlungsmethode (Pay3) - nur sichtbar wenn PAYMENT_ENABLED (state.hasCard ist
         dann ein Boolean; sonst undefined -> Block bleibt versteckt). -->
    <div class="card c12" id="billingCard" style="display:none">
      <h3>Zahlungsmethode</h3>
      <div class="hint">Fuer kostenpflichtige Funktionen (z.B. eigene Rufnummer).</div>
      <div id="cardStatus" class="hint" style="margin-bottom:14px"></div>
      <button class="btn btn-primary" id="addCard">Zahlungsmethode hinzufuegen</button>
      <span class="msg" id="cardMsg"></span>
      <!-- W4: Abo-Buchung. Ohne aktives Abo zwei Plan-Buttons; mit Abo der aktive Plan
           + Verlaengerungsdatum (Cancel ist ein Folge-Ticket, hier nur Anzeige). -->
      <div id="subBlock" style="margin-top:18px">
        <div id="subStatus" class="hint" style="margin-bottom:14px"></div>
        <div id="subButtons" class="plans">
          <div class="plan">
            <div class="plan-name">Starter</div>
            <div class="plan-price"><span data-price="starter"></span><span class="plan-per"> / Monat</span></div>
            <button class="btn btn-primary plan-cta" data-plan="starter">Abonnieren</button>
          </div>
          <div class="plan">
            <div class="plan-name">Business</div>
            <div class="plan-price"><span data-price="business"></span><span class="plan-per"> / Monat</span></div>
            <button class="btn btn-primary plan-cta" data-plan="business">Abonnieren</button>
          </div>
        </div>
        <span class="msg" id="subMsg"></span>
      </div>
    </div>

    <!-- Anrufe (read-only Historie) -->
    <div class="card c12">
      <h3>Anrufe</h3>
      <div class="hint">Deine letzten Telefonate (read-only).</div>
      <div id="calls"><div class="empty">Noch nicht verbunden.</div></div>
    </div>

  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

// p6-funnel: dedizierte Plan-Preise (Starter/Business, KEIN Free). Benannte Konstante
// (G25, keine Magic Number) - reine Anzeige; MUSS zum je-Slug hinterlegten Stripe-Price
// (PLAN_SLUGS in src/billing/subscribe.js) passen. Waehrung konsistent (EUR).
const PLAN_PRICES = Object.freeze({ starter: "4,99 €", business: "9,99 €" });
function fillPlanPrices(){
  document.querySelectorAll("[data-price]").forEach((el)=>{
    el.textContent = PLAN_PRICES[el.dataset.price] || "";
  });
}

// Web-Session-only (Konvergenz #3): das Session-Cookie (HttpOnly, same-origin) wird
// vom Browser automatisch mitgeschickt - kein Authorization-Header, kein localStorage,
// kein manuelles Token. Login/Logout laufen ueber /auth/login bzw. /auth/logout.
function showAuth(text, showLogin, showLogout){
  $("authHint").textContent = text;
  $("loginBtn").style.display = showLogin ? "inline-flex" : "none";
  $("logoutBtn").style.display = showLogout ? "inline-flex" : "none";
}

function esc(s){return String(s??"").replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function renderCalls(calls){
  if(!calls.length){$("calls").innerHTML='<div class="empty">Keine Anrufe.</div>';return}
  $("calls").innerHTML = calls.map(c=>{
    const who = c.direction==="outbound" ? c.to : c.from;
    return `<div class="call">
      <div class="call-h">
        <div class="dir ${c.direction==="outbound"?"out":"in"}">${c.direction==="outbound"?"&#8599;":"&#8601;"}</div>
        <div class="cw">
          <div class="cn">${esc(who)}</div>
          <div class="cm">${c.goal?esc(c.goal):(c.direction==="inbound"?"Eingehender Anruf":"Ausgehender Anruf")}</div>
        </div>
        <span class="st ${c.status}">${c.status==="active"?"Live":c.status==="completed"?"Beendet":c.status==="cancelled"?"Abgebrochen":"Fehlgeschlagen"}</span>
      </div>
    </div>`;
  }).join("");
}

async function refresh(){
  const r = await fetch("/api/self-service/state");
  // fail-closed: ohne gueltige Session bleibt die Seite leer (kein Tenant-Datenleck).
  if(r.status===401){ $("liveDot").classList.add("off"); showAuth("Bitte anmelden, um deinen Bereich zu sehen.", true, false); return; }
  if(r.status===403){ $("liveDot").classList.add("off"); showAuth("Aktiviere dein Konto: waehle einen Plan.", false, true); renderActivation(); return; }
  if(!r.ok){ $("liveDot").classList.add("off"); showAuth("Voruebergehend nicht erreichbar.", false, true); return; }
  showAuth("Angemeldet.", false, true);
  const s = await r.json();
  $("agentNum").textContent = s.agent.number || "nicht konfiguriert";
  $("liveDot").classList.toggle("off", !s.calls.some(c=>c.status==="active"));
  renderCalls(s.calls);
  renderBilling(s);
}

// Karten-Block nur zeigen, wenn der Server hasCard liefert (PAYMENT_ENABLED an).
// Sonst bleibt er versteckt -> Verhalten byte-identisch zum Bestand ohne Payment.
function renderBilling(s){
  const card = $("billingCard");
  if(typeof s.hasCard!=="boolean"){ card.style.display="none"; return; }
  card.style.display="";
  $("cardStatus").textContent = s.hasCard ? "Karte hinterlegt." : "Noch keine Karte hinterlegt.";
  $("addCard").textContent = s.hasCard ? "Andere Karte hinterlegen" : "Zahlungsmethode hinzufuegen";
  renderSubscription(s);
}

// W4: Abo-Anzeige. Mit aktivem Plan -> Plan + Verlaengerungsdatum, Plan-Buttons aus.
// Ohne Abo -> die Plan-Buttons (Subscribe). Cancel ist ein Folge-Ticket (nur Anzeige).
function renderSubscription(s){
  const sub = s.subscription || {};
  if(sub.planSlug){
    const until = sub.currentPeriodEnd ? new Date(sub.currentPeriodEnd*1000).toLocaleDateString("de-DE") : "";
    const name = sub.planSlug.charAt(0).toUpperCase()+sub.planSlug.slice(1);
    $("subStatus").textContent = until ? `Aktiver Plan: ${name} (verlaengert am ${until}).` : `Aktiver Plan: ${name}.`;
    $("subButtons").style.display="none";
  } else {
    $("subStatus").textContent = "Kein aktives Abo. Waehle einen Plan.";
    $("subButtons").style.display="";
  }
}

// P5: Gefuehrte Aktivierung. /api/self-service/state ist fuer suspended 403 (kein Leak),
// darum holt diese Ansicht den schlanken Billing-Status (suspended-erreichbar) und rendert
// DENSELBEN billingCard (Plan-Buttons + Karte) wie der aktive Pfad - eine Render-Quelle
// (renderBilling), nur die Datenquelle unterscheidet sich.
async function renderActivation(){
  const r = await fetch("/api/self-service/billing/status");
  if(!r.ok) return; // 401 -> refresh() hat den Login-Hinweis bereits gesetzt
  const st = await r.json();
  if(!st.paymentEnabled){ $("billingCard").style.display="none"; return; }
  renderBilling({ hasCard: st.hasCard, subscription: { planSlug: st.planSlug } });
}

// P5: Checkout-Start, geteilt vom "Karte hinzufuegen"-Button UND vom gefuehrten no_card-
// Pfad beim Abonnieren (G5: eine Quelle fuer den Stripe-Checkout-Redirect).
async function startCardSetup(msgEl){
  const r = await fetch("/api/self-service/billing/setup-checkout", { method:"POST" });
  if(r.ok){ window.location = (await r.json()).url; return; } // Redirect zu Stripe Checkout
  if(r.status===401){ msgEl.textContent="Sitzung abgelaufen - bitte neu anmelden."; msgEl.className="msg err"; refresh(); }
  else{ msgEl.textContent="Konnte Checkout nicht starten."; msgEl.className="msg err"; }
  setTimeout(()=>msgEl.className="msg",2500);
}

$("logoutBtn").onclick = async ()=>{
  await fetch("/auth/logout", { method:"POST" }); // invalidiert Session + loescht Cookie
  location.reload();
};

// Karte hinzufuegen: POST liefert die Stripe-Checkout-URL -> Browser-Redirect dorthin.
$("addCard").onclick = ()=>{ const m=$("cardMsg"); m.className="msg"; startCardSetup(m); };

// W4: Abo buchen. POST {plan} -> bei Erfolg ist der Tenant aktiv (Status-Flip im Server);
// 409 no_card -> erst Karte hinterlegen; sonst kurze Fehlermeldung. Danach refresh().
document.querySelectorAll("[data-plan]").forEach(btn=>{
  btn.onclick = async ()=>{
    const m=$("subMsg"); m.className="msg";
    const r = await fetch("/api/self-service/billing/subscribe", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ plan: btn.dataset.plan }),
    });
    if(r.ok){ m.textContent="Abo gebucht."; m.className="msg ok"; refresh(); }
    else if(r.status===409){
      const e = await r.json().catch(()=>({}));
      if(e.error==="no_card"){ startCardSetup(m); return; } // P5: gefuehrt -> erst Karte, dann zurueck + Plan
      m.textContent="Du hast bereits ein Abo."; m.className="msg err";
    }
    else if(r.status===401){ m.textContent="Sitzung abgelaufen - bitte neu anmelden."; m.className="msg err"; refresh(); }
    else{ m.textContent="Abo konnte nicht gebucht werden."; m.className="msg err"; }
    setTimeout(()=>m.className="msg",3000);
  };
});

// Rueckkehr von Stripe Checkout: kurze Rueckmeldung (der Status kommt ohnehin aus refresh()).
(function showCardReturn(){
  const p = new URLSearchParams(location.search).get("card");
  if(!p) return;
  const m=$("cardMsg");
  if(p==="ok"){ m.textContent="Karte hinterlegt."; m.className="msg ok"; }
  else if(p==="canceled"){ m.textContent="Abgebrochen - keine Karte hinterlegt."; m.className="msg err"; }
  history.replaceState(null, "", location.pathname); // Query entfernen (sauberer Reload)
})();

fillPlanPrices();
refresh();
</script>
</body>
</html>
