<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hermes — Calendar</title>
<style>
  /* Gemeinsamer Olympus-HUD-Kartenrahmen (H4) - siehe agent-status.html fuer
     die ausfuehrliche Begruendung. Der .list-Wrapper UND die Basis-Regeln
     .list .row/.list .row:first-child/.list .cell kommen ebenfalls aus
     HUD_CARD_CSS (geteilt, weil sowohl calls.html als auch calendar.html
     eine wortgleiche Objekt-Liste zeigen, s. hud-card-css.js). */
  /*__HUD_CARD_CSS__*/
  /*__WING_CSS__*/
  /* Nur die feldspezifischen Overrides fuer die Kalender-Liste - eigene
     Felder, deshalb lokal statt geteilt. */
  .cell[data-field="title"]{font-weight:600;flex-basis:100%;color:rgba(255,255,255,.94)}
  .cell[data-field="start"]{color:rgba(255,255,255,.5);font-size:12px;font-variant-numeric:tabular-nums}
  .cell[data-field="end"]{margin-left:auto;color:rgba(255,255,255,.5);font-size:12px;font-variant-numeric:tabular-nums}
</style>
<!-- Lokalisierung (widget-i18n.js, injiziert von widget-catalog.js): Markup-

<!--__I18N__-->
<!--__WING_ENGINE__-->
</head>
<body>
  <div class="card">
    <div class="eyebrow" data-i18n="Hermes · Calendar">Hermes · Calendar</div>
    <div class="hero">
      <div class="wing-wrap">
        <!--__WING_MARKUP__-->
        <span class="wing-canvas-mount" data-wing-canvas aria-hidden="true"></span>
      </div>
      <span class="phase">get_calendar</span>
      <span class="hero-title" data-i18n="Calendar">Calendar</span>
    </div>
    <!-- Objekt-Listen-Slot: data-mcp-row deklariert die Sub-Felder je Eintrag; das

    <div class="foot"><span>Hermes</span></div>
  </div>
  <!-- Read-only Widget: kein Callback, kein Tool-Trigger, kein Button-Element. -->
  <!--__WING_CANVAS_MOUNT__-->
