<!-- @dsCard group="MCP" name="get_calendar" subtitle="The owner's next calendar entries" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hermes — Calendar</title>
<style>
  /* Gemeinsamer Olympus-HUD-Kartenrahmen (H4) - siehe agent-status.html fuer
     die ausfuehrliche Begruendung. */
  /*__HUD_CARD_CSS__*/
  /*__WING_CSS__*/
  /* Row/Cell-Layout fuer die Kalender-Liste - eigene Felder, deshalb lokal. */
  .row{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;
    padding:11px 2px;border-top:1px solid rgba(255,255,255,.09)}
  .row:first-child{border-top:1px solid rgba(255,255,255,.16)}
  .cell{color:rgba(255,255,255,.85)}
  .cell[data-field="title"]{font-weight:600;flex-basis:100%;color:rgba(255,255,255,.94)}
  .cell[data-field="start"]{color:rgba(255,255,255,.5);font-size:12px;font-variant-numeric:tabular-nums}
  .cell[data-field="end"]{margin-left:auto;color:rgba(255,255,255,.5);font-size:12px;font-variant-numeric:tabular-nums}
</style>
<!--__WING_ENGINE__-->
</head>
<body>
  <div class="card">
    <div class="eyebrow">Hermes · Kalender</div>
    <div class="hero">
      <div class="wing-wrap">
        <!--__WING_MARKUP__-->
        <span class="wing-canvas-mount" data-wing-canvas aria-hidden="true"></span>
      </div>
      <span class="phase">get_calendar</span>
      <span class="hero-title">Kalender</span>
    </div>
    <!-- Objekt-Listen-Slot: data-mcp-row deklariert die Sub-Felder je Eintrag; das
         W1-Binding (widget-bind.js) rendert je Termin eine Row (textContent, XSS-sicher). -->
    <div class="list" data-mcp="calendar" data-mcp-row="title,start,end"></div>
    <div class="foot"><span>Hermes</span></div>
  </div>
  <!-- Read-only Widget: kein Callback, kein Tool-Trigger, kein Button-Element. -->
  <!--__WING_CANVAS_MOUNT__-->
</body>
</html>
