<!-- @dsCard group="MCP" name="get_call_status" subtitle="Live status + last transcript lines" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hermes — Call Status</title>
<style>
  /* Inline-Tokens: Subset aus design-system/_shared/tokens.css (Werte identisch,
     self-contained fuer die Iframe-Sandbox - kein externer CSS-Import/Linkback, AC6). */
  :root {
    --color-red-600:#e60000; --color-ink-900:#25282b; --color-gray-500:#7e7e7e;
    --color-gray-150:#ececec; --color-gray-50:#fafafa; --color-white:#fff;
    --color-green-500:#1faa59;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
    --radius-md:12px; --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  body{margin:0;font-family:var(--font-sans);color:var(--color-ink-900);background:transparent}
  .card{background:var(--color-white);border:1px solid var(--color-gray-150);
        border-radius:var(--radius-md);padding:var(--space-4);max-width:420px}
  .head{display:flex;align-items:center;gap:var(--space-2)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--color-green-500)}
  .title{font-weight:600}
  .sub{color:var(--color-gray-500);font-size:13px}
  .badge{margin-left:auto;font-size:12px;color:var(--color-green-500)}
  .line{display:flex;justify-content:space-between;margin-top:var(--space-3);
        padding-top:var(--space-2);border-top:1px solid var(--color-gray-150)}
  .turn{margin-top:var(--space-2);font-size:14px}
  .who{color:var(--color-gray-500);margin-right:var(--space-1)}
  .foot{margin-top:var(--space-3);color:var(--color-gray-500);font-size:12px;
        display:flex;justify-content:space-between}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <span class="dot"></span>
      <span><span class="title">Anruf-Status</span><br />
      <span class="sub">get_call_status</span></span>
      <span class="badge" data-mcp="status">—</span>
    </div>
    <div class="line"><span>Dauer</span><span data-mcp="duration_s">—</span></div>
    <div data-mcp="last_transcript_lines"></div>
    <div class="foot"><span data-mcp="call_id">—</span><span>Hermes</span></div>
  </div>
  <!-- Read-only Widget (P1): kein Callback, kein Tool-Trigger (Q3/P4). Der Host
       fuellt data-mcp-* aus dem gepushten structuredContent (SEP-1865). -->
</body>
</html>
