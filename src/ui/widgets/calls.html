<!-- @dsCard group="MCP" name="list_calls" subtitle="Recent inbound & outbound calls" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hermes — Calls</title>
<style>
  /* Gemeinsamer Olympus-HUD-Kartenrahmen (H4) - siehe agent-status.html fuer
     die ausfuehrliche Begruendung (inkl. .list-Wrapper: geteilt, weil sowohl
     calls.html als auch calendar.html eine Objekt-Liste zeigen). */
  /*__HUD_CARD_CSS__*/
  /*__WING_CSS__*/
  /* Row/Cell-Layout fuer die Anruf-Liste - inhaltlich eigen (Felder/Farben
     unterscheiden sich von calendar.html), deshalb lokal statt geteilt.
     .row/.cell sind die von widget-bind.js (renderRows) FEST vergebenen
     Klassennamen (ROW_CLASS/CELL_CLASS) - hier nur restyled, nicht erzeugt. */
  .row{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;
    padding:11px 2px;border-top:1px solid rgba(255,255,255,.09)}
  .row:first-child{border-top:1px solid rgba(255,255,255,.16)}
  .cell{color:rgba(255,255,255,.85)}
  .cell[data-field="direction"]{font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.22);
    border-radius:var(--radius-pill);padding:2px 9px}
  .cell[data-field="counterparty"]{font-weight:600;color:rgba(255,255,255,.94)}
  .cell[data-field="status"]{color:var(--color-accent-light-strong);font-size:12px}
  .cell[data-field="startedAt"]{margin-left:auto;color:rgba(255,255,255,.45);
    font-size:11.5px;font-variant-numeric:tabular-nums}
  .cell[data-field="summary"]{flex-basis:100%;color:rgba(255,255,255,.55);font-size:12.5px}
</style>
<!--__WING_ENGINE__-->
</head>
<body>
  <div class="card">
    <div class="eyebrow">Hermes · Letzte Anrufe</div>
    <div class="hero">
      <div class="wing-wrap">
        <!--__WING_MARKUP__-->
        <span class="wing-canvas-mount" data-wing-canvas aria-hidden="true"></span>
      </div>
      <span class="phase">list_calls</span>
      <span class="hero-title">Letzte Anrufe</span>
    </div>
    <!-- Objekt-Listen-Slot: data-mcp-row deklariert die Sub-Felder je Eintrag; das
         W1-Binding (widget-bind.js) rendert je Call eine Row (textContent, XSS-sicher).
         class="list" ist ein reiner Styling-Hook (position/z-index gegen das
         Scanline-Overlay) - data-mcp/data-mcp-row bleiben unveraendert. -->
    <div class="list" data-mcp="calls" data-mcp-row="direction,counterparty,status,startedAt,summary"></div>
    <div class="foot"><span>Hermes</span></div>
  </div>
  <!-- Read-only Widget: kein Callback, kein Tool-Trigger, kein Button-Element. -->
  <!--__WING_CANVAS_MOUNT__-->
</body>
</html>
