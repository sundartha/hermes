<!-- @dsCard group="MCP" name="get_agent_status" subtitle="Agent number, engine, usage & permissions" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hermes — Agent Status</title>
<style>
  /* Inline-Tokens: 1:1 aus apps/web/src/styles/tokens/primitives.css + semantic.css
     (kanonische Quelle), self-contained fuer die Iframe-Sandbox - kein externer
     CSS-Import/Linkback, AC6. */
  :root {
    --color-ink-900:#25282b; --color-gray-500:#7e7e7e; --color-gray-150:#ececec;
    --color-white:#fff; --color-navy-700:#1b4f86;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
    --radius-card:18px;
    --shadow-card:0 6px 18px rgba(0,0,0,.07);
    --font-sans:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
    --wing-size:28px;
  }
  body{margin:0;font-family:var(--font-sans);color:var(--color-ink-900);background:transparent}
  .card{background:var(--color-white);border:1px solid var(--color-gray-150);
        border-radius:var(--radius-card);box-shadow:var(--shadow-card);
        padding:var(--space-4);max-width:420px}
  .head{display:flex;align-items:center;gap:var(--space-2)}
  /* Wing-Marke: CSS aus wing-markup.js injiziert (G5/S2 - eine Quelle statt
     Copy-Paste in 5 Dateien, siehe widget-catalog.js withWingAssets). */
  /*__WING_CSS__*/
  .title{font-weight:600}
  .sub{color:var(--color-gray-500);font-size:13px}
  .line{display:flex;justify-content:space-between;margin-top:var(--space-3);
        padding-top:var(--space-2);border-top:1px solid var(--color-gray-150)}
  .foot{margin-top:var(--space-3);color:var(--color-gray-500);font-size:12px;
        display:flex;justify-content:space-between}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <!--__WING_MARKUP__-->
      <span><span class="title" data-mcp="owner">—</span><br />
      <span class="sub">get_agent_status</span></span>
    </div>
    <div class="line"><span>Nummer</span><span data-mcp="number">—</span></div>
    <div class="line"><span>Voice-Engine</span><span data-mcp="voiceEngine">—</span></div>
    <div class="line"><span>Modell</span><span data-mcp="model">—</span></div>
    <div class="line"><span>Calls</span><span data-mcp="calls">—</span></div>
    <div class="line"><span>KI-Kosten (EUR)</span><span data-mcp="costEur">—</span></div>
    <div class="line"><span>Budget max. (EUR)</span><span data-mcp="maxBudgetEur">—</span></div>
    <div class="line"><span>Berechtigungen</span><span data-mcp="permissions">—</span></div>
    <div class="foot"><span data-mcp="number">—</span><span>Hermes</span></div>
  </div>
  <!-- Read-only Widget (W3): kein Callback, kein Tool-Trigger, kein Button-Element.
       Das eingefuegte Binding-Script (widget-bind.js, W1) fuellt data-mcp-* aus dem
       host-gepushten structuredContent (SEP-1865). -->
</body>
</html>
