<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hermes — Agent Status</title>
<style>
  /* Inline-Tokens: Subset aus design-system/_shared/tokens.css (Werte identisch,

  :root {
    --color-ink-900:#25282b; --color-gray-500:#7e7e7e; --color-gray-150:#ececec;
    --color-white:#fff; --color-green-500:#1faa59;

    --radius-md:12px; --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  body{margin:0;font-family:var(--font-sans);color:var(--color-ink-900);background:transparent}
  .card{background:var(--color-white);border:1px solid var(--color-gray-150);

  .line{display:flex;justify-content:space-between;margin-top:var(--space-3);

  .foot{margin-top:var(--space-3);color:var(--color-gray-500);font-size:12px;
        display:flex;justify-content:space-between}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <span class="dot"></span>
      <span><span class="title" data-mcp="owner">—</span><br />
      <span class="sub">get_agent_status</span></span>

    <div class="line"><span>Voice-Engine</span><span data-mcp="voiceEngine">—</span></div>
    <div class="line"><span>Modell</span><span data-mcp="model">—</span></div>

    <div class="line"><span>Berechtigungen</span><span data-mcp="permissions">—</span></div>
    <div class="foot"><span data-mcp="number">—</span><span>Hermes</span></div>
  </div>
  <!-- Read-only Widget (W3): kein Callback, kein Tool-Trigger, kein Button-Element.
       Das eingefuegte Binding-Script (widget-bind.js, W1) fuellt data-mcp-* aus dem
       host-gepushten structuredContent (SEP-1865). -->
