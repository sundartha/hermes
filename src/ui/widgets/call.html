<!-- @dsCard group="MCP" name="place_call" subtitle="Unified live call card: dialing -> status -> result, self-polling + cancel" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hermes — Call</title>
<style>
  /*__HUD_CARD_CSS__*/
  /*__WING_CSS__*/
  .w{min-height:492px}
  .kopf{min-height:92px;margin-top:24px}
  .verbindung{display:flex;align-items:center;gap:6px;height:72px;margin-top:16px}
  .verbindung .wing-wrap{--wing-size:72px;margin-left:-8px}
  .track{position:relative;flex:1 1 0;height:1px;background:var(--fg2);transform-origin:left center}
  .runner{display:none;position:absolute;top:-4px;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:var(--fg);box-shadow:0 0 14px 2px var(--ga)}
  .ph-dial .runner{display:block}
  .ph-fail .track,.ph-cancel .track{transform:scaleX(.5)}
  .pill{box-sizing:border-box;width:56px;height:56px;flex-shrink:0;border:1px dashed transparent;border-radius:999px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
  .pill i{display:none;width:8px;height:8px;border-radius:50%;background:var(--fg)}
  .pill span{display:none}
  .ph-dial .pill i{display:block}
  .ph-live .pill span,.ph-done .pill span{display:inline}
  .ph-live .pill,.ph-done .pill{width:112px}
  .ph-done .pill{background:var(--fg);color:var(--bg)}
  .ph-fail .pill,.ph-cancel .pill{background:transparent;box-shadow:none;border-color:var(--line2)}
  .ph-dial .ga{opacity:.5}.ph-live .ga{opacity:1}.ph-done .ga{opacity:.8}
  .ph-fail .ga,.ph-cancel .ga{opacity:.1}.ph-fail .gb,.ph-cancel .gb{opacity:.35}
  .w .sheet{flex:1 1 auto;margin-top:16px;padding:4px 12px 12px;display:flex;flex-direction:column}
  .sheet .zeile{border-bottom:1px solid var(--hair)}
  .sheet .zeile.lines{grid-template-columns:minmax(0,1fr)}
  .lines .turn{font-size:15px;line-height:21px;color:var(--fg);overflow-wrap:anywhere}
  .fuss{display:flex;align-items:center;justify-content:space-between;gap:16px;height:44px;margin-top:auto;font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums}
  button.quiet{height:44px;padding:0 20px;margin-left:auto;border:0;border-radius:999px;color:var(--fg);font:500 14px "Space Grotesk",system-ui,sans-serif;cursor:pointer}
  button.quiet:hover{filter:brightness(1.18)}
  .hud-cancel:focus-visible{outline:2px solid var(--color-accent-light);outline-offset:2px}
  .hud-cancel:disabled{opacity:.6;cursor:default}
  .slot-hidden{display:none}
</style>
<!--__I18N__-->
</head>
<body>
  <div class="w">
    <div class="szene" aria-hidden="true">
      <span class="glow ga" style="width:260px;height:260px;right:-50px;top:130px"></span>
      <span class="glow gb" style="width:220px;height:220px;right:50px;top:-120px"></span>
      <span class="glow gc" style="width:280px;height:280px;left:-90px;bottom:-130px"></span>
    </div>
    <div class="marke" style="height:24px"><b>Hermes</b></div>
    <div class="kopf">
      <h1 class="rise"><span data-hud-phase data-i18n="Placing call">Placing call</span></h1>
    </div>
    <div class="verbindung">
      <span class="wing-wrap" aria-hidden="true">
        <!--__WING_MARKUP__-->
        <span class="wing-canvas-mount" data-wing-canvas></span>
      </span>
      <div class="track" aria-hidden="true"><span class="runner"></span></div>
      <div class="pill lens"><i aria-hidden="true"></i><span data-duration-display>0:00</span></div>
    </div>
    <div class="sheet">
      <div class="zeile lines" data-row="lines" data-mcp="last_transcript_lines"></div>
      <div class="zeile rise" data-row="failure" style="display:none">
        <span data-i18n="Reason">Reason</span><span data-failure-display>—</span>
      </div>
      <div class="zeile rise" data-row="objective" style="display:none">
        <span data-i18n="Goal">Goal</span><span data-objective-display>—</span>
      </div>
      <div class="zeile rise" data-row="outcome" style="display:none">
        <span data-i18n="Outcome">Outcome</span><span data-mcp="outcome">—</span>
      </div>
      <div class="zeile rise" data-row="summary" style="display:none">
        <span data-i18n="Result">Result</span><span data-mcp="result_summary">—</span>
      </div>
      <div class="zeile rise d1" data-row="next_step" style="display:none">
        <span data-i18n="Next step">Next step</span><span data-mcp="next_step">—</span>
      </div>
      <div class="fuss">
        <button type="button" class="quiet lens hud-cancel" data-cancel data-i18n="Cancel call">Cancel call</button>
      </div>
    </div>
    <span class="slot-hidden" data-mcp="call_id">—</span>
    <span class="slot-hidden" data-mcp="status">—</span>
    <span class="rimcard" aria-hidden="true"></span>
  </div>
  <!--__WING_ENGINE__-->
  <!-- Vereintes Widget: EIN Iframe fuer den gesamten Anruf-Lebenszyklus
       (dialing -> in_progress -> completed/failed/cancelled). Der initiale call_id/
       status-Push von place_call laeuft ueber den GETEILTEN, bereits bewiesenen
       Empfangspfad (widget-bind.js, von der Katalog-Ladefunktion unten injiziert).
       Alles danach - Self-Poll, der ausgehende tools/call an den Host, Terminal-
       Erkennung, get_call_result, Cancel - lebt in DIESEM eigenen Inline-Skript:
       kein neues widget-bridge.js-Modul, keine Katalog-Aenderung, exakt das
       etablierte Muster der mittlerweile entfernten Vorlaeufer-Widgets
       (Cancel-Callback bzw. Bruecken-Kandidaten-Spike).
       Eine minimale eigene Slot-Fuell-Funktion statt Import aus widget-bind.js ist
       bewusst dupliziert - ein self-contained Iframe-Script kann keinen ES-Import
       ziehen (derselbe Kompromiss wie im inzwischen entfernten Bruecken-Spike).
       XSS-Disziplin unveraendert: Werte landen NUR ueber textContent, nie als
       geparstes Markup.
       Das Woerterbuch (widget-i18n.js) steht ueber den Platzhalter I18N im
       head; die Wing-Canvas-Engine (Olympus-HUD) wird ueber den WING_ENGINE-
       Platzhalter (widget-catalog.js withWingEngine) HINTER dem Karten-Markup
       und VOR diesem Skript injiziert, damit die Karte vor der Engine
       gezeichnet werden kann; die Engine wird erst nach der ersten Zeichnung
       gemountet. Der Platzhalter darf hier NICHT woertlich stehen:
       HTML-Kommentare nesten nicht, sein "Ende" wuerde diesen Kommentar
       schliessen und den Rest als sichtbaren Text leaken (beim Testen
       gefunden); ausserdem ersetzt widget-catalog nur das ERSTE Vorkommen.
       window.HermesWingCanvas ist beim
       Ausfuehren dieses Skripts deshalb bereits synchron verfuegbar (kein
       DOMContentLoaded-Umweg noetig). Autorenregel: DIESER Inline-Skript-Block
       bleibt IMMER der letzte im Dokument (Test-Helfer ownScriptSource() verlaesst
       sich darauf, siehe test/mcp-ui-w1-call-widget.test.js). -->
  <script>
  (function () {
    "use strict";

    // Self-Poll-Takt + Kein-Live-Update-Grenze.
    var POLL_CONNECTING_MS = 3000;
    var POLL_INTERVAL_MS = 5000;
    var TIMER_TOLERANCE_S = 1;
    var TIMER_MAX_CATCHUP_S = 2;
    var FALLBACK_TIMEOUT_MS = 15000;
    var RESULT_RETRY_MS = 3000;
    var MAX_RESULT_RETRIES = 5;
    var AWAIT_SUMMARIES = /*__AWAIT_SUMMARIES__*/;

    // Tool-Namen wie server-seitig registriert (src/mcp-tools.js).
    var TOOL_GET_STATUS = "get_call_status";
    var TOOL_GET_CALL_RESULT = "get_call_result";
    var TOOL_CANCEL = "cancel_call";

    // Wire-Formate der MCP-Apps-Spec (SEP-1865 / ext-apps 2026-01-26). METHOD_TOOLS_CALL
    // ist der EINZIGE erlaubte App->Host-Sendeweg fuer Tool-Calls; fruehere, erfundene
    // Wire-Strings duerfen hier nirgends woertlich stehen (Spec-Gate, s.
    // test/mcp-ui-w1-call-widget.test.js).
    // METHOD_TOOL_RESULT = Kanal A (Host-Push, den der geteilte BIND_SCRIPT ohnehin
    // bindet - wir werten ihn zusaetzlich selbst aus, um Terminal-Status zu erkennen).
    var METHOD_TOOLS_CALL = "tools/call";
    var METHOD_TOOL_RESULT = "ui/notifications/tool-result";
    // Ready-Signal des geteilten BIND_SCRIPT (src/ui/widget-bind.js: UI_READY_FLAG /
    // UI_READY_EVENT) - gesetzt, sobald der Host die ui/initialize-Anfrage beantwortet
    // hat. Ein self-contained Iframe-Skript kann nicht importieren, die Namen sind hier
    // deshalb woertlich dupliziert; ein Sync-Test (test/mcp-ui-w1-call-widget.test.js)
    // haelt beide Quellen zusammen (kein stiller Drift).
    var UI_READY_FLAG = "__hermesUiReady";
    var UI_READY_EVENT = "hermes:ui-ready";

    // Aufeinanderfolgende JSON-RPC-Fehlerantworten, nach denen Weiter-Pollen sinnlos ist
    // (haeufigster Fall: die Tool-Berechtigung im Connector steht auf "Fragen" - eine
    // Rueckfrage kann ein Widget nicht beantworten). Ein Erfolg setzt den Zaehler zurueck.
    var MAX_CONSECUTIVE_RPC_ERRORS = 3;

    var TERMINAL_STATUSES = ["completed", "failed", "cancelled"];
    var EMDASH = "—";
    var I18N_ATTR = "data-i18n";

    // Lokalisierung: window.HermesI18n kommt aus dem im <head> injizierten
    // I18N_SCRIPT (widget-i18n.js) und ist hier synchron verfuegbar. Faellt es
    // aus, degradiert t() auf die Keys - die SIND englische Texte (fail-safe).
    var t = window.HermesI18n && typeof window.HermesI18n.t === "function"
      ? window.HermesI18n.t
      : function (key) { return key; };

    // Anzeige-Labels (reine Praesentation) fuer die failure_reason-Basis-Token aus
    // src/telephony/failure-reason.js#FAILURE_REASON_BASE_TOKENS - die Klassifikation lebt
    // nur dort; unbekannt -> "Failed" (failureReasonKey). Ein neues Token braucht hier
    // eine Zeile, sonst schlaegt der zugehoerige Test (test/gemeinsam/mcp-ui-widget-i18n.test.js) fehl.
    var FAILURE_REASON_LABELS = {
      "no-answer": "No answer",
      "busy": "Busy",
      "canceled": "Cancelled",
      "failed": "Failed",
      "not-placed": "Not placed",
      "unreachable": "Unreachable",
      "result-unknown": "Result unknown",
      "at-capacity": "At capacity",
      // Diese zwei internen Token existieren bereits als Satz in FAILURE_REASON_TEXTS
      // (i18n/failure-reason-texts.js), hatten hier aber nie ein Kurzlabel - sie
      // erschienen bislang ROH ("max-duration-cap") in der Karte.
      "max-duration-cap": "Duration limit",
      "budget-exhausted": "Budget used up",
    };

    // STATUS_VIEW: EIN kanonischer Eintrag pro Call-Status (One-Switch-Regel: ein neuer
    // Status braucht GENAU EINE Zeile). Die 5 WingMark-Zustaende sind fix - cancelled
    // nutzt bewusst den wingStatus von failed.
    var WING_STATUS_IDLE = "idle";

    // Ring-Geometrie (Olympus-HUD): rein dekorativ, kein echter Fortschritts-
    // Prozentsatz in den Slots verfuegbar - kurzer/wandernder Bogen bei
    // dialing/in_progress (CSS-Rotation via ring--spin), geschlossener Ring bei
    // completed, unterbrochener gedaempfter Ring bei failed/cancelled. Muss VOR
    // STATUS_VIEW stehen, da dessen ringPreset-Eintraege darauf aufbauen.
    var RING_RADIUS_PX = 74; // deckt sich mit r="74" im SVG-Markup, s. test/mcp-ui-w1-call-widget.test.js
    var RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS_PX;
    var RING_ARC_DIALING_PX = 110;
    var RING_ARC_IN_PROGRESS_PX = 270;
    var RING_ARC_INTERRUPTED_DASH_PX = 37;
    var RING_ARC_INTERRUPTED_GAP_PX = 23;
    var RING_PRESET_DEFAULT = { cls: "ring", dash: RING_CIRCUMFERENCE + " 0" };

    // pillLabel/hudPhase tragen den Uebersetzungs-KEY: die Sprache steht erst mit dem ersten
    // Tool-Ergebnis fest, t(...) laeuft deshalb erst zur Anwendezeit (updateStatusPill/-HudPhase).
    var STATUS_VIEW = {
      dialing: {
        phase: "dial",
        wingStatus: "connecting",
        pillLabel: "Connecting",
        pillClass: "pill pill--active",
        dot: true,
        hudPhase: "Placing call",
        ringPreset: { cls: "ring ring--spin ring--accent", dash: RING_ARC_DIALING_PX + " " + (RING_CIRCUMFERENCE - RING_ARC_DIALING_PX) },
      },
      in_progress: {
        phase: "live",
        wingStatus: "working",
        pillLabel: "Live",
        pillClass: "pill pill--active",
        dot: true,
        hudPhase: "In call",
        ringPreset: { cls: "ring ring--spin ring--accent-strong", dash: RING_ARC_IN_PROGRESS_PX + " " + (RING_CIRCUMFERENCE - RING_ARC_IN_PROGRESS_PX) },
      },
      completed: {
        phase: "done",
        wingStatus: "success",
        pillLabel: "Completed",
        pillClass: "pill pill--done",
        dot: false,
        hudPhase: "Call ended",
        ringPreset: { cls: "ring ring--accent-solid", dash: RING_CIRCUMFERENCE + " 0" },
      },
      failed: {
        phase: "fail",
        wingStatus: "error",
        pillLabel: "Failed",
        pillClass: "pill pill--muted",
        dot: false,
        hudPhase: "Call ended",
        ringPreset: { cls: "ring ring--muted", dash: RING_ARC_INTERRUPTED_DASH_PX + " " + RING_ARC_INTERRUPTED_GAP_PX },
      },
      cancelled: {
        phase: "cancel",
        wingStatus: "error",
        pillLabel: "Cancelled",
        pillClass: "pill pill--muted",
        dot: false,
        hudPhase: "Call ended",
        ringPreset: { cls: "ring ring--muted", dash: RING_ARC_INTERRUPTED_DASH_PX + " " + RING_ARC_INTERRUPTED_GAP_PX },
      },
    };

    // Alle moeglichen Wing-Status-Modifier-Klassen ("wing--idle", "wing--connecting",
    // ...), aus WING_STATUS_IDLE + STATUS_VIEW abgeleitet statt ein zweites Mal
    // hartcodiert - dedupliziert, da mehrere Call-Status auf denselben
    // Wing-Status faellen (cancelled -> error, s.o.). updateWingForStatus nutzt diese
    // Liste, um NUR den Status-Teil der Klasse zu wechseln (s. dort).
    var WING_MODIFIER_CLASSES = (function collectWingModifierClasses() {
      var seen = {};
      var classes = [];
      var values = [WING_STATUS_IDLE];
      for (var key in STATUS_VIEW) values.push(STATUS_VIEW[key].wingStatus);
      for (var i = 0; i < values.length; i++) {
        var cls = "wing--" + values[i];
        if (!seen[cls]) {
          seen[cls] = true;
          classes.push(cls);
        }
      }
      return classes;
    })();

    // Fluegel-Held (Olympus-HUD): Mount-Groesse der Canvas-Engine, deckt sich
    // mit --wing-size im CSS oben - Kreuzpruefung gegen Drift siehe
    // test/mcp-ui-w1-call-widget.test.js.
    var WING_CANVAS_SIZE_PX = 72;
    var WING_FPS_CAP = 60;

    var doc = document;
    var pollTimerId = null;
    var pollPeriodMs;
    var fallbackTimerId = null;
    var anyResponseReceived = false;
    var callResultFetched = false;
    var resultRetries = 0;
    var objectiveVisible = true;
    var summaryHidden = false;
    var pendingRequests = {}; // rpcId -> Tool-Name (Antwort-Zuordnung, s. handleMessage)
    var consecutiveRpcErrors = 0;
    var rpcCounter = 0;
    var currentStatus = "dialing";
    var shownStatus = null;
    var engineHandle = null; // Wing-Canvas-Engine-Handle nach erfolgreichem mount(); null = reiner CSS-Fallback
    var timerAnchor = null;
    var timerFrameId = null;
    var timerShownS = null;
    var timerLastTargetS = null;
    var roundTripMs = 0;
    var sentAtById = {};

    function isRecord(value) {
      return typeof value === "object" && value !== null;
    }

    function isTerminalStatus(status) {
      return TERMINAL_STATUSES.indexOf(status) !== -1;
    }

    function slot(name) {
      return doc.querySelector('[data-mcp="' + name + '"]');
    }

    function dashIfEmpty(value) {
      return value === null || value === undefined ? EMDASH : String(value);
    }

    function setSlotText(name, value) {
      var el = slot(name);
      if (!el) return;
      el.textContent = dashIfEmpty(value);
    }

    // Anzeige-Elemente ohne data-mcp (s. Markup-Kommentar bei .rows): werden
    // NUR von diesem Skript beschrieben, nie vom geteilten BIND_SCRIPT.
    function setDisplayText(selector, value) {
      var el = doc.querySelector(selector);
      if (!el) return;
      el.textContent = dashIfEmpty(value);
    }

    // Sekunden -> "m:ss" (sprachneutral, tabular-nums im CSS). Anrufe sind
    // durch die Max-Dauer-Sicherung kurz; Stundenformat braucht es nicht.
    function formatDuration(totalSeconds) {
      var s = Math.max(0, Math.floor(totalSeconds));
      var rest = s % 60;
      return Math.floor(s / 60) + ":" + (rest < 10 ? "0" + rest : rest);
    }

    function monotonicNow() {
      var perf = window.performance;
      return perf && typeof perf.now === "function" ? perf.now() : Date.now();
    }

    function parseTimestampMs(value) {
      if (typeof value !== "string") return null;
      var ms = Date.parse(value);
      return isNaN(ms) ? null : ms;
    }

    function timerTargetS() {
      var serverNowMs = timerAnchor.serverMs + (monotonicNow() - timerAnchor.perfMs);
      return Math.max(0, Math.floor((serverNowMs - timerAnchor.answeredMs) / 1000));
    }

    function timerStepS(target) {
      var deviation = timerShownS + 1 - target;
      if (deviation > TIMER_TOLERANCE_S) return 0;
      return deviation < -TIMER_TOLERANCE_S ? TIMER_MAX_CATCHUP_S : 1;
    }

    function timerFrame() {
      timerFrameId = null;
      if (!timerAnchor) return;
      var target = timerTargetS();
      if (timerShownS === null) {
        timerShownS = target;
      } else if (target !== timerLastTargetS) {
        timerShownS += timerStepS(target);
      }
      if (target !== timerLastTargetS) {
        timerLastTargetS = target;
        setDisplayText("[data-duration-display]", formatDuration(timerShownS));
      }
      timerFrameId = window.requestAnimationFrame(timerFrame);
    }

    function stopTimer() {
      timerAnchor = null;
      if (timerFrameId !== null) window.cancelAnimationFrame(timerFrameId);
      timerFrameId = null;
    }

    function anchorTimer(answeredMs, serverMs) {
      timerAnchor = { answeredMs: answeredMs, serverMs: serverMs + roundTripMs / 2, perfMs: monotonicNow() };
      if (timerFrameId !== null) window.cancelAnimationFrame(timerFrameId);
      timerFrame();
    }

    function applyDuration(data) {
      var answeredMs = parseTimestampMs(data.answered_at);
      var serverMs = parseTimestampMs(data.server_time);
      var live = !isTerminalStatus(data.status);
      if (live && answeredMs !== null && serverMs !== null) {
        anchorTimer(answeredMs, serverMs);
        return;
      }
      if (live && timerAnchor) return;
      stopTimer();
      if (typeof data.duration_s === "number") setDisplayText("[data-duration-display]", formatDuration(data.duration_s));
    }

    function failureReasonKey(raw) {
      if (raw === null || raw === undefined) return null;
      return FAILURE_REASON_LABELS[String(raw).split(":")[0]] || "Failed";
    }

    function objectiveKey(value, hasResultText) {
      if (value === true) return "Goal reached";
      if (value === false) return "Goal not reached";
      if ((value === "unclear" || value === undefined) && !hasResultText) return "Result being evaluated";
      return null;
    }

    function setKeyedText(el, key, plain) {
      if (!el) return;
      if (key && el.setAttribute) el.setAttribute(I18N_ATTR, key);
      else if (el.removeAttribute) el.removeAttribute(I18N_ATTR);
      if (key) el.textContent = t(key);
      else el.textContent = dashIfEmpty(plain);
    }

    function setKeyedDisplay(selector, key, plain) {
      setKeyedText(doc.querySelector(selector), key, plain);
    }

    function observeLocale(meta) {
      if (window.HermesI18n && typeof window.HermesI18n.observe === "function") window.HermesI18n.observe(meta);
    }

    function setRowVisible(rowKey, visible) {
      var el = doc.querySelector('[data-row="' + rowKey + '"]');
      if (el) el.style.display = visible ? "" : "none";
    }

    // Gemeinsamer Helfer fuer die beiden skalaren Ergebnis-Karten-Felder
    // (outcome/next_step). Zeile bleibt VERSTECKT, wenn das Feld leer ist - eine Zeile
    // "Naechster Schritt: —" ist Rauschen, kein Ergebnis.
    function applyResultRow(key, value) {
      var present = typeof value === "string" && value.length > 0;
      setRowVisible(key, present);
      if (present) setSlotText(key, value);
    }

    function setCancelDisabled(disabled) {
      var btn = doc.querySelector("[data-cancel]");
      if (!btn) return;
      btn.disabled = disabled;
      btn.style.display = disabled ? "none" : "";
    }

    // className-Token-Helfer (kein DOM-classList-Zwang - funktioniert mit jedem
    // Element, das nur .className als String kennt). Ersetzen GENAU ein Token,
    // ruehren den Rest der Klasse nicht an (s. updateWingForStatus).
    function removeClassToken(el, token) {
      var classes = (el.className || "").split(/\s+/).filter(function (c) { return c && c !== token; });
      el.className = classes.join(" ");
    }

    function addClassToken(el, token) {
      var classes = (el.className || "").split(/\s+/).filter(Boolean);
      if (classes.indexOf(token) === -1) classes.push(token);
      el.className = classes.join(" ");
    }

    // Reine Status-Uebersetzung, keine DOM-Beruehrung (Command-Query-Trennung, P5).
    function wingStatusFor(status) {
      var view = STATUS_VIEW[status];
      return view ? view.wingStatus : WING_STATUS_IDLE;
    }

    // Spiegelt den Call-Status auf den Wing-Zustand: Klassenwechsel auf dem CSS-Wrapper
    // (Fallback-Pfad); engineHandle.setStatus() steht in updateForStatus.
    // Wechselt NUR den wing--<status>-Token, damit "wing--dark" (von wingSpan()) bleibt.
    function updateWingForStatus(status) {
      var mapped = wingStatusFor(status);
      var wing = doc.querySelector("[data-wing]");
      if (wing) {
        for (var i = 0; i < WING_MODIFIER_CLASSES.length; i++) removeClassToken(wing, WING_MODIFIER_CLASSES[i]);
        addClassToken(wing, "wing--" + mapped);
      }
    }

    function updateCardPhase(status) {
      var view = STATUS_VIEW[status];
      var card = doc.querySelector(".w");
      if (card && view) card.className = "w ph-" + view.phase;
    }

    // Lokalisierte Anzeige-Uebersetzung der Status-Pill - reine
    // Darstellung; der rohe Status bleibt unveraendert im [data-mcp="status"]-Slot
    // (structuredContent-Vertrag unangetastet, siehe applyCallStatus/setSlotText).
    function updateStatusPill(status) {
      var view = STATUS_VIEW[status];
      var pill = doc.querySelector("[data-status-pill]");
      var dot = doc.querySelector("[data-status-dot]");
      var label = doc.querySelector("[data-status-label]");
      if (pill) pill.className = view ? view.pillClass : "pill pill--muted";
      if (dot) dot.style.display = view && view.dot ? "" : "none";
      setKeyedText(label, view ? view.pillLabel : null);
    }

    // Status-abgeleitete HUD-Unterzeile - wie die Status-Pill eine reine
    // Anzeige-Uebersetzung, keine neue Datenquelle. t() zur ANWENDEZEIT (s.
    // STATUS_VIEW-Kommentar oben) - nicht beim Laden aufgeloest.
    function updateHudPhase(status) {
      var view = STATUS_VIEW[status];
      var el = doc.querySelector("[data-hud-phase]");
      setKeyedText(el, view ? view.hudPhase : null);
    }

    var RING_FADE_MS = 500;
    var RING_FADE_EASE = "cubic-bezier(0.22,1,0.36,1)";

    function ringFadeAllowed() {
      return !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    }

    function updateRingForStatus(status) {
      var view = STATUS_VIEW[status];
      var preset = view ? view.ringPreset : RING_PRESET_DEFAULT;
      var svg = doc.querySelector("[data-ring]");
      var arc = doc.querySelector("[data-ring-arc]");
      if (svg) svg.setAttribute("class", preset.cls); // SVG: .className ist SVGAnimatedString, setAttribute noetig
      if (arc) arc.setAttribute("stroke-dasharray", preset.dash);
      if (svg && typeof svg.animate === "function" && ringFadeAllowed()) {
        svg.animate([{ opacity: 0.25 }, { opacity: 1 }], { duration: RING_FADE_MS, easing: RING_FADE_EASE });
      }
    }

    // Zeilenweise wie widget-bind.js renderLines (dieselbe .turn-Klasse, dieselbe
    // XSS-Disziplin) - hier dupliziert, da dieses Skript self-contained bleibt (s.
    // Datei-Kommentar oben).
    function renderTranscriptLines(lines) {
      var container = slot("last_transcript_lines");
      if (!container) return;
      while (container.firstChild) container.removeChild(container.firstChild);
      for (var i = 0; i < lines.length; i++) {
        var div = doc.createElement("div");
        div.className = "turn";
        div.textContent = String(lines[i]);
        container.appendChild(div);
      }
    }

    // Terminal-Folgen: Sichtbarkeit je Status, Cancel deaktivieren,
    // Polling stoppen, bei completed EINMAL get_call_result nachladen.
    function updateForStatus(status) {
      var terminal = isTerminalStatus(status);
      currentStatus = status;
      if (engineHandle) engineHandle.setStatus(wingStatusFor(status));
      if (status !== shownStatus) {
        shownStatus = status;
        updateWingForStatus(status);
        updateCardPhase(status);
        updateStatusPill(status);
        updateHudPhase(status);
        updateRingForStatus(status);
      }
      setRowVisible("lines", !terminal);
      setRowVisible("failure", status === "failed");
      setRowVisible("summary", status === "completed" && !summaryHidden);
      setRowVisible("objective", status === "completed" && objectiveVisible);
      setCancelDisabled(terminal);
      if (terminal) stopPolling();
      else retunePolling();
      if (status === "completed") fetchCallResultOnce();
    }

    // Wendet die get_call_status-Whitelist (pickCallStatus, src/mcp-tools.js) an.
    function applyCallStatus(data) {
      if (!isRecord(data)) return;
      if (data.call_id) setSlotText("call_id", data.call_id);
      applyDuration(data);
      if (Array.isArray(data.last_transcript_lines)) renderTranscriptLines(data.last_transcript_lines);
      if ("failure_reason" in data) setKeyedDisplay("[data-failure-display]", failureReasonKey(data.failure_reason));
      if (data.status) {
        setSlotText("status", data.status);
        updateForStatus(data.status);
      }
    }

    function isAwaitPlaceholder(data) {
      return data.objective_achieved === "unclear" && AWAIT_SUMMARIES.indexOf(data.result_summary) !== -1;
    }

    function applyObjective(data, awaiting) {
      var hasText = !awaiting && typeof data.result_summary === "string" && data.result_summary.trim().length > 0;
      var key = objectiveKey(data.objective_achieved, hasText);
      if (awaiting && resultRetries >= MAX_RESULT_RETRIES) key = null;
      objectiveVisible = key !== null;
      setKeyedDisplay("[data-objective-display]", key, null);
      setRowVisible("objective", objectiveVisible && currentStatus === "completed");
    }

    function summaryAfterOutcome(outcome, summary) {
      var head = outcome.replace(/[\s.!?\u2026]+$/, "");
      if (head.length === 0 || summary.slice(0, head.length).toLowerCase() !== head.toLowerCase()) return summary;
      var boundary = /^(?:[.!?\u2026]+(?:\s+|$)|$)/.exec(summary.slice(head.length));
      return boundary ? summary.slice(head.length + boundary[0].length) : summary;
    }

    function applySummaryRow(data, awaiting) {
      var outcome = typeof data.outcome === "string" ? data.outcome.trim() : "";
      var summary = typeof data.result_summary === "string" ? data.result_summary.trim() : "";
      var rest = summaryAfterOutcome(outcome, summary);
      summaryHidden = awaiting || (outcome.length > 0 && rest.length === 0);
      if ("result_summary" in data && !awaiting) setSlotText("result_summary", outcome.length > 0 ? rest : data.result_summary);
      setRowVisible("summary", currentStatus === "completed" && !summaryHidden);
    }

    // Wendet die get_call_result-Whitelist (pickTranscript) an.
    function applyCallResult(data) {
      if (!isRecord(data)) return;
      if (data.call_id) setSlotText("call_id", data.call_id);
      var awaiting = isAwaitPlaceholder(data);
      applyObjective(data, awaiting);
      applySummaryRow(data, awaiting);
      if (awaiting) scheduleResultRetry();
      // Die beiden skalaren Karten-Felder.
      applyResultRow("outcome", data.outcome);
      applyResultRow("next_step", data.next_step);
    }

    function pollPeriodFor(status) {
      return status === "in_progress" ? POLL_INTERVAL_MS : POLL_CONNECTING_MS;
    }

    function retunePolling() {
      if (pollTimerId === null) return;
      var period = pollPeriodFor(currentStatus);
      if (period === pollPeriodMs) return;
      clearInterval(pollTimerId);
      pollTimerId = setInterval(pollTick, period);
      pollPeriodMs = period;
    }

    function stopPolling() {
      if (pollTimerId !== null) {
        clearInterval(pollTimerId);
        pollTimerId = null;
      }
      if (fallbackTimerId !== null) {
        clearTimeout(fallbackTimerId);
        fallbackTimerId = null;
      }
    }

    function currentCallId() {
      var el = slot("call_id");
      var v = el ? (el.textContent || "").trim() : "";
      return v && v !== EMDASH ? v : "";
    }

    function nextRpcId() {
      rpcCounter += 1;
      return "call-widget-" + rpcCounter;
    }

    // Erste Antwort (gleich welcher Kanal) - danach greift der 15s-Fallback nicht mehr.
    // Die frueher hier gefuehrte Sendeformat-Auswahl (eine vormalige interne Zustands-
    // variable) ist entfallen: es gibt nur noch EIN Sende-Format (METHOD_TOOLS_CALL).
    function markResponse(data, applyFn) {
      anyResponseReceived = true;
      applyFn(data);
    }

    function dispatchFor(tool) {
      return tool === TOOL_GET_CALL_RESULT ? applyCallResult : applyCallStatus;
    }

    // Der EINZIGE ausgehende Weg: JSON-RPC-postMessage "tools/call", id-gematcht
    // (handleMessage). Das ready-Gate steht hier fuer ALLE Aufrufer. Rueckgabe true =
    // tatsaechlich gesendet - Pflicht fuer jeden einmaligen Effekt, der am Versand haengt.
    function sendToolCall(tool, args) {
      if (!window[UI_READY_FLAG]) return false;
      var parent = window.parent;
      if (!parent || typeof parent.postMessage !== "function") return false;
      var id = nextRpcId();
      pendingRequests[id] = tool;
      sentAtById[id] = monotonicNow();
      parent.postMessage(
        { jsonrpc: "2.0", id: id, method: METHOD_TOOLS_CALL, params: { name: tool, arguments: args } },
        "*",
      );
      return true;
    }

    // callResultFetched NUR bei tatsaechlichem Versand. Vor dem Handshake bleibt der Guard
    // offen; der erste Poll-Tick nach whenUiReady(startPolling) holt das Ergebnis nach.
    function fetchCallResultOnce() {
      if (callResultFetched) return;
      var callId = currentCallId();
      if (callId && sendToolCall(TOOL_GET_CALL_RESULT, { call_id: callId })) callResultFetched = true;
    }

    function scheduleResultRetry() {
      if (resultRetries >= MAX_RESULT_RETRIES) return;
      resultRetries += 1;
      setTimeout(function () {
        var callId = currentCallId();
        if (callId) sendToolCall(TOOL_GET_CALL_RESULT, { call_id: callId });
      }, RESULT_RETRY_MS);
    }

    function pollTick() {
      var callId = currentCallId();
      if (!callId) return; // initialer call_id-Push noch nicht angekommen - naechster Tick
      sendToolCall(TOOL_GET_STATUS, { call_id: callId });
    }

    // Optische Deaktivierung (Button verschwindet) NUR nach bestaetigtem Versand - klickt
    // der Nutzer, bevor der Handshake steht, gibt sendToolCall() false zurueck und der
    // Button bleibt unveraendert sichtbar/aktiv statt einen nie gesendeten Abbruch
    // vorzutaeuschen (kein stiller Klickverlust ohne Feedback).
    function onCancelClick() {
      var callId = currentCallId();
      if (!callId) return;
      // Cancel-Callback (Muster des inzwischen entfernten Einzel-Widgets)
      if (sendToolCall(TOOL_CANCEL, { call_id: callId })) setCancelDisabled(true);
    }

    // Keine Host-Bruecke innerhalb der Frist -> Polling einstellen;
    // die Karte zeigt dann still den zuletzt gepushten Stand (kein sichtbares
    // Diagnose-Label mehr, s. markResponse-Kommentar).
    function onFallbackTimeout() {
      fallbackTimerId = null;
      if (anyResponseReceived) return; // schon eine Antwort da - kein Abbruch noetig
      if (pollTimerId !== null) {
        clearInterval(pollTimerId);
        pollTimerId = null;
      }
    }

    // Kanal A: Host-Notification (dieselbe Form wie der initiale place_call-Push; der
    // geteilte BIND_SCRIPT bindet sie ohnehin schon in die ueberlappenden Slots - wir
    // werten sie zusaetzlich selbst aus, um Terminal-Status + Diagnose zu erkennen).
    // Kanal B: direkte JSON-RPC-Antwort auf einen unserer eigenen Requests (id-gematcht).
    function handleMessage(event) {
      var m = event && event.data;
      if (!isRecord(m)) return;

      if (m.method === METHOD_TOOL_RESULT && isRecord(m.params) && isRecord(m.params.structuredContent)) {
        var pushed = m.params.structuredContent;
        var pushedFn = "result_summary" in pushed ? applyCallResult : applyCallStatus;
        roundTripMs = 0;
        markResponse(pushed, pushedFn);
        return;
      }

      var pendingTool = m.id != null ? pendingRequests[m.id] : null;
      if (!pendingTool) return;
      delete pendingRequests[m.id];
      roundTripMs = Math.max(0, monotonicNow() - sentAtById[m.id]);
      delete sentAtById[m.id];
      if (isRecord(m.result)) observeLocale(m.result._meta);
      // JSON-RPC-Fehlerantwort: NICHT mehr still verschlucken. Transiente Fehler duerfen
      // nicht stoppen (ein Erfolg setzt den Zaehler zurueck), aber ein dauerhaft
      // ablehnender Host wird nicht endlos weitergefragt. Die Karte behaelt dabei ihren
      // letzten Stand - kein Blanking, kein erfundener Fehlertext.
      if (m.error) {
        consecutiveRpcErrors += 1;
        if (consecutiveRpcErrors >= MAX_CONSECUTIVE_RPC_ERRORS) stopPolling();
        return;
      }
      consecutiveRpcErrors = 0;
      var data = isRecord(m.result) ? m.result.structuredContent : undefined;
      markResponse(data, dispatchFor(pendingTool));
    }

    // Montiert die Wing-Canvas-Engine (in <head> VOR diesem Skript injiziert, also synchron
    // verfuegbar). Bei jedem Fehlschlag bleibt die CSS-WingMark sichtbar - NIE ein leeres Loch.
    function mountWingEngine() {
      if (!(window.HermesWingCanvas && typeof window.HermesWingCanvas.mount === "function")) return;
      var host = doc.querySelector("[data-wing-canvas]");
      var wingImg = doc.querySelector("[data-wing] img");
      if (!host || !wingImg) return;
      try {
        engineHandle = window.HermesWingCanvas.mount(host, { size: WING_CANVAS_SIZE_PX, src: wingImg.src, image: wingImg, status: wingStatusFor(currentStatus), fpsCap: WING_FPS_CAP });
        var wing = doc.querySelector("[data-wing]");
        if (wing) wing.style.display = "none"; // Canvas ersetzt die CSS-Marke NACH Erfolg (progressive enhancement)
      } catch (e) {
        engineHandle = null; // fail-safe: CSS-WingMark bleibt die einzige sichtbare Marke
      }
    }

    // Sofort-Tick + Takt (3s Verbindung, 5s Live) + 15s-Fallback-Frist. Laeuft NUR nach dem Host-Handshake
    // (whenUiReady) - vorher startet auch die Fallback-Uhr nicht.
    function startPolling() {
      pollTick();
      pollPeriodMs = pollPeriodFor(currentStatus);
      pollTimerId = setInterval(pollTick, pollPeriodMs);
      fallbackTimerId = setTimeout(onFallbackTimeout, FALLBACK_TIMEOUT_MS);
    }

    // Late-safe: Signal schon gefeuert (BIND_SCRIPT lief frueher, oder Remount) -> sofort
    // starten; sonst genau einmal auf das Event warten. Damit haengt die Reihenfolge NICHT
    // an der Injektions-Position des BIND_SCRIPT (widget-catalog.js haengt es NACH diesem
    // Skript ein). Kein Timeout-Fallback: ein Host, der den Handshake nicht beantwortet,
    // beantwortet auch keinen tools/call.
    function whenUiReady(startFn) {
      if (window[UI_READY_FLAG]) {
        startFn();
        return;
      }
      window.addEventListener(UI_READY_EVENT, startFn, { once: true });
    }

    function afterFirstPaint(fn) {
      if (typeof window.requestAnimationFrame !== "function") {
        fn();
        return;
      }
      window.requestAnimationFrame(function () {
        if (typeof window.requestIdleCallback === "function") window.requestIdleCallback(fn);
        else setTimeout(fn, 0);
      });
    }

    function init() {
      var btn = doc.querySelector("[data-cancel]");
      if (btn) btn.addEventListener("click", onCancelClick);
      updateForStatus("dialing");
      afterFirstPaint(mountWingEngine);
      window.addEventListener("message", handleMessage);
      whenUiReady(startPolling);
    }

    init();
  })();
  </script>
</body>
</html>
